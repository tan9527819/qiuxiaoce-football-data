<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>竞彩足球预测分析</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f3f5f8;
    color:#172033;
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#14233d,#203b63);
    color:#fff;
    padding:30px 20px 25px;
}

.header h1{
    margin:0;
    font-size:28px;
    font-weight:800;
}

.header p{
    margin:10px 0 0;
    font-size:16px;
    opacity:.75;
}

.toolbar{
    background:#fff;
    padding:18px;
    border-bottom:1px solid #e5e7eb;
}

.toolbar-inner{
    display:flex;
    gap:10px;
    max-width:900px;
    margin:auto;
}

input{
    flex:1;
    height:54px;
    border:2px solid #d9dee7;
    border-radius:14px;
    padding:0 16px;
    font-size:18px;
}

button{
    width:110px;
    height:54px;
    border:0;
    border-radius:14px;
    background:#172033;
    color:#fff;
    font-size:18px;
    font-weight:700;
}

.container{
    max-width:900px;
    margin:18px auto;
    padding:0 14px 60px;
}

.status{
    background:#fff;
    border-radius:15px;
    padding:18px;
    margin-bottom:16px;
    font-size:16px;
    color:#667085;
}

.card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:18px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.card-head{
    padding:18px;
    border-bottom:1px solid #edf0f4;
}

.topline{
    display:flex;
    align-items:center;
    gap:8px;
}

.code{
    color:#1677ff;
    font-size:14px;
    font-weight:800;
}

.league{
    color:#667085;
    font-size:13px;
}

.teams{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
}

.team{
    flex:1;
    font-size:19px;
    font-weight:800;
}

.away{
    text-align:right;
}

.vs{
    color:#98a2b3;
    font-size:12px;
    font-weight:700;
}

.time{
    margin-top:10px;
    color:#667085;
    font-size:13px;
}

.section{
    padding:17px 18px;
    border-bottom:1px solid #edf0f4;
}

.section:last-child{
    border-bottom:0;
}

.title{
    font-size:16px;
    font-weight:800;
    margin-bottom:12px;
}

.odds{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.odd{
    background:#f7f8fa;
    border-radius:12px;
    padding:13px 8px;
    text-align:center;
}

.odd-label{
    font-size:13px;
    color:#667085;
    margin-bottom:7px;
}

.odd-value{
    font-size:20px;
    font-weight:900;
}

.handicap{
    background:#f7f8fa;
    border-radius:12px;
    padding:12px;
    text-align:center;
    margin-bottom:10px;
    font-size:15px;
    font-weight:800;
}

.analysis{
    line-height:1.9;
    font-size:14px;
}

.final{
    background:#f8fafc;
}

.final-main{
    font-size:19px;
    font-weight:900;
}

.source{
    margin-top:9px;
    color:#98a2b3;
    font-size:11px;
}

.error{
    background:#fff4f4;
    color:#b42318;
    padding:20px;
    border-radius:15px;
    line-height:1.8;
}

.empty{
    background:#fff;
    padding:55px 20px;
    border-radius:15px;
    text-align:center;
    color:#98a2b3;
}

.loading{
    background:#fff;
    padding:55px 20px;
    border-radius:15px;
    text-align:center;
    color:#667085;
}

@media(max-width:600px){

    .header h1{
        font-size:27px;
    }

    .team{
        font-size:17px;
    }

    .odd-value{
        font-size:18px;
    }

}
</style>
</head>

<body>

<header class="header">

    <h1>竞彩足球预测分析</h1>

    <p>
        真实竞彩比赛 · 胜平负 · 让球胜平负
    </p>

</header>


<div class="toolbar">

    <div class="toolbar-inner">

        <input
            id="date"
            type="date"
        >

        <button onclick="loadData()">
            刷新
        </button>

    </div>

</div>


<main class="container">

    <div id="status" class="status">
        正在连接中国体育彩票竞彩数据……
    </div>

    <div id="matches">

        <div class="loading">
            正在读取真实竞彩足球比赛……
        </div>

    </div>

</main>


<script>

/* =====================================================
   官方竞彩足球接口
   ===================================================== */

const API =
"https://webapi.sporttery.cn/gateway/uniform/football/getMatchCalculatorV1.qry";


/* =====================================================
   页面元素
   ===================================================== */

const dateInput =
document.getElementById("date");

const statusBox =
document.getElementById("status");

const matchesBox =
document.getElementById("matches");


/* =====================================================
   今天
   ===================================================== */

function today(){

    const d = new Date();

    return d.getFullYear()
        + "-"
        + String(d.getMonth()+1).padStart(2,"0")
        + "-"
        + String(d.getDate()).padStart(2,"0");
}

dateInput.value = today();


/* =====================================================
   安全输出
   ===================================================== */

function esc(v){

    if(v === undefined || v === null){
        return "";
    }

    return String(v)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}


/* =====================================================
   请求官方竞彩
   ===================================================== */

async function requestOfficial(){

    const url =
        API
        + "?channel=c"
        + "&poolCode=had,hhad,crs,ttg";

    const response =
        await fetch(url,{
            method:"GET",
            headers:{
                "Accept":
                "application/json, text/plain, */*"
            },
            cache:"no-store"
        });

    if(!response.ok){

        throw new Error(
            "官方竞彩接口 HTTP "
            + response.status
        );
    }

    const json =
        await response.json();

    return json;
}


/* =====================================================
   获取官方比赛列表
   ===================================================== */

function getAllMatches(json){

    if(
        !json ||
        !json.value ||
        !Array.isArray(json.value.matchInfoList)
    ){

        return [];
    }

    const result = [];

    for(
        const group of json.value.matchInfoList
    ){

        const list =
            group.subMatchList || [];

        for(
            const match of list
        ){

            result.push(match);
        }
    }

    return result;
}


/* =====================================================
   日期转换
   ===================================================== */

function normalizeDate(value){

    if(!value){
        return "";
    }

    const text =
        String(value);

    if(text.length >= 10){
        return text.substring(0,10);
    }

    return text;
}


/* =====================================================
   获取比赛
   ===================================================== */

function getDateMatches(
    allMatches,
    targetDate
){

    return allMatches.filter(match => {

        const matchDate =
            normalizeDate(
                match.matchDate
            );

        return matchDate === targetDate;

    });

}


/* =====================================================
   赛事名称
   ===================================================== */

function leagueName(match){

    return (
        match.leagueAbbName
        ||
        match.leagueAllName
        ||
        "竞彩足球"
    );
}


/* =====================================================
   主队
   ===================================================== */

function homeName(match){

    return (
        match.homeTeamAbbName
        ||
        match.homeTeamAllName
        ||
        "主队"
    );
}


/* =====================================================
   客队
   ===================================================== */

function awayName(match){

    return (
        match.awayTeamAbbName
        ||
        match.awayTeamAllName
        ||
        "客队"
    );
}


/* =====================================================
   编号
   ===================================================== */

function matchNumber(match){

    return (
        match.matchNumStr
        ||
        match.matchNum
        ||
        "竞彩"
    );
}


/* =====================================================
   比赛时间
   ===================================================== */

function matchTime(match){

    if(
        match.matchDate &&
        match.matchTime
    ){

        return (
            match.matchDate
            + " "
            + match.matchTime
        );
    }

    return (
        match.matchDateTime
        ||
        match.matchTime
        ||
        "暂无"
    );
}


/* =====================================================
   胜平负
   ===================================================== */

function getHad(match){

    const had =
        match.had || {};

    return {

        win:
            had.h !== undefined
            ? had.h
            : null,

        draw:
            had.d !== undefined
            ? had.d
            : null,

        lose:
            had.a !== undefined
            ? had.a
            : null

    };
}


/* =====================================================
   让球胜平负
   ===================================================== */

function getHhad(match){

    const hhad =
        match.hhad || {};

    return {

        line:
            hhad.goalLine !== undefined
            ? hhad.goalLine
            : (
                hhad.goalLineValue !== undefined
                ? hhad.goalLineValue
                : null
            ),

        win:
            hhad.h !== undefined
            ? hhad.h
            : null,

        draw:
            hhad.d !== undefined
            ? hhad.d
            : null,

        lose:
            hhad.a !== undefined
            ? hhad.a
            : null

    };
}


/* =====================================================
   赔率显示
   ===================================================== */

function odd(value){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "暂无";
    }

    return String(value);
}


/* =====================================================
   简单分析
   ===================================================== */

function buildAnalysis(
    had,
    hhad
){

    const result = [];


    if(
        had.win !== null &&
        had.draw !== null &&
        had.lose !== null
    ){

        const values = [

            {
                name:"主胜",
                value:Number(had.win)
            },

            {
                name:"平",
                value:Number(had.draw)
            },

            {
                name:"主负",
                value:Number(had.lose)
            }

        ].filter(
            x => Number.isFinite(x.value)
        );


        if(values.length === 3){

            values.sort(
                (a,b) =>
                a.value - b.value
            );

            result.push(
                "当前竞彩胜平负赔率最低项："
                + values[0].name
                + "。"
            );

        }

    }else{

        result.push(
            "当前胜平负赔率尚未完整开售。"
        );
    }


    if(hhad.line !== null){

        result.push(
            "让球数据："
            + hhad.line
            + "。"
        );

    }else{

        result.push(
            "当前让球数据暂无。"
        );
    }


    result.push(
        "XG：暂无真实数据，不进行虚构。"
    );

    result.push(
        "历史同赔：暂未接入，不进行虚构。"
    );


    return result;
}


/* =====================================================
   最终方向
   ===================================================== */

function finalDirection(had){

    if(
        had.win === null ||
        had.draw === null ||
        had.lose === null
    ){

        return "暂不推荐";
    }


    const arr = [

        {
            name:"主胜",
            value:Number(had.win)
        },

        {
            name:"平",
            value:Number(had.draw)
        },

        {
            name:"主负",
            value:Number(had.lose)
        }

    ].filter(
        x => Number.isFinite(x.value)
    );


    if(arr.length !== 3){

        return "暂不推荐";
    }


    arr.sort(
        (a,b) =>
        a.value - b.value
    );


    return (
        "赔率最低方向："
        + arr[0].name
    );
}


/* =====================================================
   渲染单场
   ===================================================== */

function renderMatch(match){

    const had =
        getHad(match);

    const hhad =
        getHhad(match);

    const analysis =
        buildAnalysis(
            had,
            hhad
        );

    return `

    <article class="card">

        <div class="card-head">

            <div class="topline">

                <span class="code">
                    ${esc(
                        matchNumber(match)
                    )}
                </span>

                <span class="league">
                    ${esc(
                        leagueName(match)
                    )}
                </span>

            </div>


            <div class="teams">

                <div class="team">
                    ${esc(
                        homeName(match)
                    )}
                </div>

                <div class="vs">
                    VS
                </div>

                <div class="team away">
                    ${esc(
                        awayName(match)
                    )}
                </div>

            </div>


            <div class="time">

                开赛：
                ${esc(
                    matchTime(match)
                )}

            </div>

        </div>


        <section class="section">

            <div class="title">
                胜平负
            </div>


            <div class="odds">

                <div class="odd">

                    <div class="odd-label">
                        主胜
                    </div>

                    <div class="odd-value">
                        ${esc(
                            odd(had.win)
                        )}
                    </div>

                </div>


                <div class="odd">

                    <div class="odd-label">
                        平
                    </div>

                    <div class="odd-value">
                        ${esc(
                            odd(had.draw)
                        )}
                    </div>

                </div>


                <div class="odd">

                    <div class="odd-label">
                        主负
                    </div>

                    <div class="odd-value">
                        ${esc(
                            odd(had.lose)
                        )}
                    </div>

                </div>

            </div>

        </section>


        <section class="section">

            <div class="title">
                让球胜平负
            </div>


            <div class="handicap">

                让球：
                ${esc(
                    hhad.line === null
                    ? "暂无"
                    : hhad.line
                )}

            </div>


            <div class="odds">

                <div class="odd">

                    <div class="odd-label">
                        让胜
                    </div>

                    <div class="odd-value">
                        ${esc(
                            odd(hhad.win)
                        )}
                    </div>

                </div>


                <div class="odd">

                    <div class="odd-label">
                        让平
                    </div>

                    <div class="odd-value">
                        ${esc(
                            odd(hhad.draw)
                        )}
                    </div>

                </div>


                <div class="odd">

                    <div class="odd-label">
                        让负
                    </div>

                    <div class="odd-value">
                        ${esc(
                            odd(hhad.lose)
                        )}
                    </div>

                </div>

            </div>

        </section>


        <section class="section">

            <div class="title">
                简单分析
            </div>

            <div class="analysis">

                ${analysis.map(
                    x =>
                    "<div>• "
                    + esc(x)
                    + "</div>"
                ).join("")}

            </div>

        </section>


        <section class="section final">

            <div class="title">
                当前判断
            </div>

            <div class="final-main">

                ${esc(
                    finalDirection(had)
                )}

            </div>

            <div class="source">

                数据来自中国体育彩票竞彩公开接口。
                当前判断仅依据真实竞彩赔率，
                不代表比赛结果。

            </div>

        </section>

    </article>

    `;
}


/* =====================================================
   加载
   ===================================================== */

async function loadData(){

    const targetDate =
        dateInput.value || today();


    statusBox.innerHTML =
        "正在读取中国体育彩票竞彩足球……";


    matchesBox.innerHTML = `
        <div class="loading">
            正在读取真实竞彩足球比赛……
        </div>
    `;


    try{

        const json =
            await requestOfficial();


        const allMatches =
            getAllMatches(json);


        const matches =
            getDateMatches(
                allMatches,
                targetDate
            );


        console.log(
            "官方全部比赛：",
            allMatches
        );

        console.log(
            "目标日期比赛：",
            matches
        );


        if(!matches.length){

            matchesBox.innerHTML = `

                <div class="empty">

                    <div style="
                        font-size:20px;
                        font-weight:800;
                        color:#344054;
                        margin-bottom:12px;
                    ">
                        ${esc(targetDate)}
                    </div>

                    <div>
                        当前官方接口没有返回该日期可售竞彩足球。
                    </div>

                    <div style="
                        margin-top:12px;
                        font-size:12px;
                    ">
                        已成功连接官方接口，
                        不是虚假数据。
                    </div>

                </div>

            `;


            statusBox.innerHTML =
                "官方竞彩接口连接成功";


            return;
        }


        matchesBox.innerHTML =
            matches
            .map(
                renderMatch
            )
            .join("");


        statusBox.innerHTML = `

            <b>竞彩足球真实数据</b>

            · ${esc(targetDate)}

            · 共 ${matches.length} 场

        `;

    }
    catch(error){

        console.error(error);


        statusBox.innerHTML =
            "竞彩数据读取失败";


        matchesBox.innerHTML = `

            <div class="error">

                <b>
                    无法从浏览器直接读取官方竞彩数据
                </b>

                <br><br>

                ${esc(
                    error.message
                )}

                <br><br>

                当前页面没有使用其他网站数据冒充竞彩数据。

                <br><br>

                如果这里出现 CORS / WAF，
                就不是页面代码的问题，
                而是 GitHub Pages 浏览器直连官方接口受到限制。

            </div>

        `;

    }

}


/* =====================================================
   启动
   ===================================================== */

loadData();

</script>

</body>
</html>
