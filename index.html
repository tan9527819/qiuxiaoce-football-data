<body>

<main>

 <div class="card">

<script>

const TODAY_FILES = [
"2026/10/04/北单088_阿甲_国防与司法vs圣洛伦索_2026-10-04-01-45.json",
"2026/10/04/北单094_阿甲_图库曼竞技vs巴拉卡斯中央_2026-10-04-04-00.json",
"2026/10/04/北单096_巴甲_米内罗竞技vs布拉干蒂诺RB_2026-10-04-05-30.json",
"2026/10/04/北单101_日职乙_宫崎棒牛鸟vsRB大宫松鼠_2026-10-04-18-00.json",
"2026/10/04/北单102_葡甲_SC法伦斯vs沙维什_2026-10-04-18-00.json"
];

let matches=[];
let historyRows=[];


/* =========================
   页面切换
========================= */

function showPage(id,btn){

 document.querySelectorAll(".page").forEach(x=>{
  x.classList.remove("active");
 });

 document.getElementById(id).classList.add("active");

 document.querySelectorAll("nav button").forEach(x=>{
  x.classList.remove("active");
 });

 btn.classList.add("active");

 if(id==="forecast") renderForecast();
 if(id==="data") renderData();
}


/* =========================
   今日赛事
========================= */

async function loadToday(){

 const list=document.getElementById("matchList");

 list.innerHTML=
 '<div class="empty">正在读取今日赛事数据...</div>';

 let result=[];

 for(const file of TODAY_FILES){

  try{

   const r=await fetch(file+"?t="+Date.now());

   if(!r.ok) continue;

   const raw=await r.json();

   result.push(normalize(raw));

  }catch(e){

   console.log("读取失败",file,e);

  }

 }

 matches=result;

 renderLeague();

 renderMatches();

 renderData();

 renderForecast();

}


/* =========================
   数据标准化
========================= */

function normalize(raw){

 const info=raw.info||{};
 const analysis=raw.analysis||{};
 const forecast=raw.forecasts||raw.forecast||{};

 return {

  id:info.id||raw.id||Math.random(),

  matchNo:info.matchNo||info.code||raw.matchNo||"",

  league:info.league||raw.league||"未知联赛",

  home:info.home||info.homeTeam||raw.home||"主队",

  away:info.away||info.awayTeam||raw.away||"客队",

  time:info.time||info.startTime||raw.time||"",

  odds:normalizeOdds(
   raw.odds||analysis.odds||forecast.odds||{}
  ),

  opening:normalizeOdds(
   raw.opening||analysis.opening||{}
  ),

  forecast:forecast,

  analysis:analysis,

  risk:raw.riskAlert||analysis.riskAlert||""

 };

}


/* =========================
   赔率
========================= */

function normalizeOdds(o){

 return {

  home:num(
   o.home||o.win||o["3"]||o["主胜"]
  ),

  draw:num(
   o.draw||o.x||o["1"]||o["平"]
  ),

  away:num(
   o.away||o.lose||o["0"]||o["客胜"]
  )

 };

}

function num(x){

 const n=parseFloat(x);

 return isFinite(n)?n:null;

}


/* =========================
   隐含概率
========================= */

function marketProbability(m){

 const a=m.odds.home;
 const b=m.odds.draw;
 const c=m.odds.away;

 if(!(a&&b&&c)){

  return {
   home:0.33,
   draw:0.34,
   away:0.33,
   valid:false
  };

 }

 const x=1/a;
 const y=1/b;
 const z=1/c;

 const s=x+y+z;

 return {
  home:x/s,
  draw:y/s,
  away:z/s,
  valid:true
 };

}


/* =========================
   深度分析
========================= */

function deepAnalyze(m){

 const p=marketProbability(m);

 let probs=[
  p.home,
  p.draw,
  p.away
 ];

 let max=Math.max(...probs);

 let direction=
  max===p.home?"主胜":
  max===p.draw?"平":
  "客胜";

 let sorted=[...probs].sort((a,b)=>b-a);

 let gap=sorted[0]-sorted[1];

 let risk=0;

 if(gap<0.08) risk+=30;
 else if(gap<0.15) risk+=15;

 if(p.draw>=0.30) risk+=15;

 if(max<0.45) risk+=20;

 let cold="";

 if(max<0.40){
  cold="超级冷门候选";
 }else if(max<0.48){
  cold="冷门观察";
 }

 let primary=direction;

 if(p.draw>=0.31 && Math.abs(p.home-p.away)<0.12){
  primary="平";
 }

 let confidence=Math.round(max*100);

 return {
  p,
  direction,
  primary,
  confidence,
  risk,
  cold,
  gap
 };

}


/* =========================
   渲染赛事
========================= */

function renderMatches(){

 const q=(document.getElementById("search").value||"").toLowerCase();

 const lg=document.getElementById("league").value;

 const list=document.getElementById("matchList");

 let arr=matches.filter(m=>{

  const text=(m.league+" "+m.home+" "+m.away).toLowerCase();

  return (!q||text.includes(q)) &&
         (!lg||m.league===lg);

 });

 if(!arr.length){

  list.innerHTML='<div class="empty">暂无赛事数据</div>';
  return;

 }

 list.innerHTML=arr.map(renderMatchCard).join("");

}


function renderMatchCard(m){

 const a=deepAnalyze(m);
 const p=a.p;

 return `
 <div class="card">

  <div class="match-head">

   <div>

    <div class="muted">
     ${esc(m.matchNo)} · ${esc(m.league)}
    </div>

    <div class="match-title">
     ${esc(m.home)}
     <span class="muted"> vs </span>
     ${esc(m.away)}
    </div>

    <div class="muted">
     ${esc(m.time)}
    </div>

   </div>

   <div style="text-align:right">

    <span class="badge">
     ${a.confidence}%倾向
    </span>

    ${
     a.cold
     ? `<span class="badge cold">${a.cold}</span>`
     : `<span class="badge safe">相对稳定</span>`
    }

   </div>

  </div>


  <div class="prob">

   <div class="p1" style="width:${p.home*100}%"></div>

   <div class="px" style="width:${p.draw*100}%"></div>

   <div class="p2" style="width:${p.away*100}%"></div>

  </div>

  <div class="labels">

   <span>主 ${pct(p.home)}</span>

   <span>平 ${pct(p.draw)}</span>

   <span>客 ${pct(p.away)}</span>

  </div>


  <div class="grid">

   <div class="stat">
    <b>${m.odds.home||"-"}</b>
    <span>主胜赔率</span>
   </div>

   <div class="stat">
    <b>${m.odds.draw||"-"}</b>
    <span>平局赔率</span>
   </div>

   <div class="stat">
    <b>${m.odds.away||"-"}</b>
    <span>客胜赔率</span>
   </div>

  </div>


  <div class="pick">

   <span class="badge hot">单选判断</span>

   <strong>${a.primary}</strong>

   ${
    a.cold
    ? `<span class="badge cold">${a.cold}</span>`
    : ""
   }

   <div class="reason">

    市场概率：
    主 ${pct(p.home)} /
    平 ${pct(p.draw)} /
    客 ${pct(p.away)}。

    ${
     a.primary==="平"
     ? "双方概率接近且平局概率较高，建议重点防平。"
     : "当前最高概率方向为"+a.primary+"，但仍需结合后续变盘和历史同赔验证。"
    }

    风险评分：${a.risk}/100。

   </div>

  </div>

 </div>
 `;

}


/* =========================
   数据页
========================= */

function renderData(){

 document.getElementById("totalMatches").textContent=matches.length;

 let draw=0;
 let cold=0;

 matches.forEach(m=>{

  const a=deepAnalyze(m);

  if(a.primary==="平") draw++;

  if(a.cold) cold++;

 });

 document.getElementById("drawCount").textContent=draw;
 document.getElementById("coldCount").textContent=cold;


 let h=0,d=0,a=0;

 matches.forEach(m=>{

  const p=marketProbability(m);

  h+=p.home;
  d+=p.draw;
  a+=p.away;

 });

 if(matches.length){

  h/=matches.length;
  d/=matches.length;
  a/=matches.length;

  document.getElementById("direction").innerHTML=`

   <div class="grid">

    <div class="stat">
     <b>${pct(h)}</b>
     <span>平均主胜概率</span>
    </div>

    <div class="stat">
     <b>${pct(d)}</b>
     <span>平均平局概率</span>
    </div>

    <div class="stat">
     <b>${pct(a)}</b>
     <span>平均客胜概率</span>
    </div>

   </div>
  `;

 }else{

  document.getElementById("direction").innerHTML="暂无数据";

 }


 document.getElementById("movement").innerHTML=
  movementAnalysis();

}


function movementAnalysis(){

 let available=matches.filter(m=>
  m.opening.home &&
  m.opening.draw &&
  m.opening.away &&
  m.odds.home &&
  m.odds.draw &&
  m.odds.away
 );

 if(!available.length){

  return `
   <div class="notice">
    当前赛事数据没有完整的“初盘 + 即时盘”字段，
    因此暂不判断真实变盘，避免制造虚假异动。
   </div>
  `;

 }

 return available.map(m=>{

  const dh=m.odds.home-m.opening.home;
  const dd=m.odds.draw-m.opening.draw;
  const da=m.odds.away-m.opening.away;

  return `
   <div class="reason">
    <b>${esc(m.home)} vs ${esc(m.away)}</b><br>
    主胜 ${dh>0?"↑":dh<0?"↓":"—"}
    · 平 ${dd>0?"↑":dd<0?"↓":"—"}
    · 客胜 ${da>0?"↑":da<0?"↓":"—"}
   </div>
  `;

 }).join("");

}


/* =========================
   前瞻
========================= */

function renderForecast(){

 const box=document.getElementById("forecastList");

 if(!matches.length){

  box.innerHTML='<div class="empty">暂无赛事</div>';
  return;

 }

 const arr=matches
  .map(m=>({
   m,
   a:deepAnalyze(m)
  }))
  .sort((x,y)=>y.a.confidence-x.a.confidence);


 box.innerHTML=arr.map(x=>{

  const m=x.m;
  const a=x.a;

  return `
   <div class="card">

    <div class="muted">
     ${esc(m.league)} · ${esc(m.time)}
    </div>

    <div class="match-title">
     ${esc(m.home)} vs ${esc(m.away)}
    </div>

    <div class="pick">

     <span class="badge hot">首选</span>

     <strong>${a.primary}</strong>

     <div class="reason">
      概率 ${a.confidence}%；
      平局 ${pct(a.p.draw)}；
      风险 ${a.risk}/100。
     </div>

    </div>

   </div>
  `;

 }).join("");


 renderParlays(arr);

}


function renderParlays(arr){

 const box=document.getElementById("parlays");

 const good=arr
  .filter(x=>x.a.confidence>=45 && x.a.risk<65)
  .slice(0,8);

 if(good.length<3){

  box.innerHTML=`

   <div class="notice">
    当前证据不足，暂不强行生成串关。
    至少需要 3 场达到基础置信条件。
   </div>

  `;

  return;

 }


 const sizes=[8,7,6,5,3];

 box.innerHTML=sizes.map(n=>{

  if(good.length<n){

   return `
    <div class="card">
     <b>${n}串1</b>
     <div class="reason">
      暂不推荐：符合条件的赛事不足 ${n} 场。
     </div>
    </div>
   `;

  }

  const picks=good.slice(0,n);

  return `
   <div class="card">

    <b>${n}串1</b>

    <div class="reason">

     ${picks.map((x,i)=>`
      ${i+1}. ${esc(x.m.home)} vs ${esc(x.m.away)}
      → <b>${x.a.primary}</b>
     `).join("<br>")}

    </div>

   </div>
  `;

 }).join("");

}


/* =========================
   CSV
========================= */

document.getElementById("csvFile").addEventListener("change",function(e){

 const file=e.target.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=function(){

  const text=reader.result;

  historyRows=parseCSV(text);

  try{
   localStorage.setItem(
    "qiuxiaoce_history_csv_v3",
    JSON.stringify(historyRows)
   );
  }catch(e){}

  updateHistoryInfo();

 };

 reader.readAsText(file,"UTF-8");

});


function parseCSV(text){

 const lines=text
  .replace(/\r/g,"")
  .split("\n")
  .filter(x=>x.trim());

 if(!lines.length)return[];

 const headers=parseCSVLine(lines[0]);

 return lines.slice(1).map(line=>{

  const cells=parseCSVLine(line);

  const obj={};

  headers.forEach((h,i)=>{
   obj[h]=(cells[i]||"").trim();
  });

  return obj;

 });

}


function parseCSVLine(line){

 const arr=[];
 let cur="";
 let quote=false;

 for(let i=0;i<line.length;i++){

  const c=line[i];

  if(c==='"'){

   if(quote && line[i+1]==='"'){

    cur+='"';
    i++;

   }else{

    quote=!quote;

   }

  }else if(c===","&&!quote){

   arr.push(cur);
   cur="";

  }else{

   cur+=c;

  }

 }

 arr.push(cur);

 return arr;

}


/* =========================
   历史数据库
========================= */

function updateHistoryInfo(){

 document.getElementById("historyInfo").innerHTML=
  `已读取 <b>${historyRows.length}</b> 条历史记录。`;

 renderThirtyDays();

}


function clearHistory(){

 historyRows=[];

 localStorage.removeItem(
  "qiuxiaoce_history_csv_v3"
 );

 updateHistoryInfo();

 document.getElementById("similarHistory").innerHTML=
  "历史数据库已清除。";

}


function loadHistory(){

 try{

  const x=localStorage.getItem(
   "qiuxiaoce_history_csv_v3"
  );

  if(x){

   historyRows=JSON.parse(x);

   updateHistoryInfo();

  }

 }catch(e){

  console.log(e);

 }

}


/* =========================
   历史匹配
========================= */

function findSimilar(m){

 if(!historyRows.length)return[];

 const odds=m.odds;

 if(!odds.home||!odds.draw||!odds.away){

  return[];

 }

 return historyRows.filter(row=>{

  const oh=num(
   row["主胜"]||
   row["主胜赔率"]||
   row["胜"]||
   row["home"]
  );

  const od=num(
   row["平"]||
   row["平局"]||
   row["平局赔率"]||
   row["draw"]
  );

  const oa=num(
   row["负"]||
   row["客胜"]||
   row["客胜赔率"]||
   row["away"]
  );

  if(!oh||!od||!oa)return false;

  return Math.abs(oh-odds.home)<=0.15 &&
         Math.abs(od-odds.draw)<=0.15 &&
         Math.abs(oa-odds.away)<=0.15;

 }).slice(0,100);

}


function analyzeSimilar(m){

 const rows=findSimilar(m);

 if(!rows.length){

  return {
   count:0,
   text:"暂无足够历史同赔样本"
  };

 }

 let win=0;
 let draw=0;
 let lose=0;

 rows.forEach(r=>{

  const result=
   r["赛果"]||
   r["结果"]||
   r["result"]||
   r["Result"]||
   "";

  if(
   result==="胜"||
   result==="主胜"||
   result==="3"
  )win++;

  else if(
   result==="平"||
   result==="1"
  )draw++;

  else if(
   result==="负"||
   result==="客胜"||
   result==="0"
  )lose++;

 });

 return {

  count:rows.length,

  text:
   `样本 ${rows.length} 场；`+
   `主胜 ${rows.length?Math.round(win/rows.length*100):0}%；`+
   `平 ${rows.length?Math.round(draw/rows.length*100):0}%；`+
   `客胜 ${rows.length?Math.round(lose/rows.length*100):0}%。`

 };

}


/* =========================
   30天统计
========================= */

function renderThirtyDays(){

 const box=document.getElementById("thirtyDays");

 if(!historyRows.length){

  box.innerHTML="暂无历史数据。";
  return;

 }

 const dates=[];

 historyRows.forEach(r=>{

  const d=
   r["日期"]||
   r["比赛日期"]||
   r["date"]||
   r["Date"];

  if(d)dates.push(d);

 });

 if(!dates.length){

  box.innerHTML=
   `数据库已载入 ${historyRows.length} 条，但没有识别到标准日期字段。`;

  return;

 }

 box.innerHTML=
  `数据库共 ${historyRows.length} 条记录。<br>
   已识别日期字段 ${dates.length} 条。<br>
   后续可根据你的 CSV 实际字段进一步计算 30 天命中率。`;

}

 `;

/* =========================
   工具
========================= */

function pct(x){

 return Math.round(x*100)+"%";

}


function esc(x){

 return String(x??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

}
