<body>

<header>

<main>

 <div class="card">

 </div>


 <div class="card">

  <div class="section-title">

</main>


<script>

/* =====================================================
   配置
===================================================== */

const TODAY_FILES = [

 "2026/10/04/北单088_阿甲_国防与司法vs圣洛伦索_2026-10-04-01-45.json",

 "2026/10/04/北单094_阿甲_图库曼竞技vs巴拉卡斯中央_2026-10-04-04-00.json",

 "2026/10/04/北单096_巴甲_米内罗竞技vs布拉干蒂诺RB_2026-10-04-05-30.json",

 "2026/10/04/北单101_日职乙_宫崎棒牛鸟vsRB大宫松鼠_2026-10-04-18-00.json",

 "2026/10/04/北单102_葡甲_SC法伦斯vs沙维什_2026-10-04-18-00.json"

];

const HISTORY_KEY="qiuxiaoce_history_v7";

let matches=[];
let historyRows=[];


/* =====================================================
   基础工具
===================================================== */

function firstValue(){

 for(let i=0;i<arguments.length;i++){

  const v=arguments[i];

  if(
   v!==undefined &&
   v!==null &&
   String(v).trim()!==""
  ){
   return v;
  }

 }

 return "";
}


function num(v){

 if(v===undefined || v===null || v==="")
  return null;

 if(typeof v==="number")
  return isFinite(v)?v:null;

 const n=parseFloat(
  String(v).replace(/[^\d.-]/g,"")
 );

 return isFinite(n)?n:null;
}


function pct(v){

 if(
  v===null ||
  v===undefined ||
  !isFinite(v)
 )
  return "-";

 return (v*100).toFixed(1)+"%";
}


function scorePct(v){

 if(
  v===null ||
  v===undefined ||
  !isFinite(v)
 )
  return "-";

 return Math.round(v)+"";
}


function esc(v){

 return String(
  v===undefined || v===null ? "" : v
 )
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}


function clamp(v,min,max){

 return Math.max(
  min,
  Math.min(max,v)
 );

}


/* =====================================================
   通用字段递归寻找
===================================================== */

function deepGet(root,names,depth=0){

 if(
  !root ||
  typeof root!=="object" ||
  depth>7
 )
  return null;

 for(const name of names){

  if(
   Object.prototype.hasOwnProperty.call(root,name)
  ){
   const value=root[name];

   if(
    value!==undefined &&
    value!==null &&
    value!==""
   )
    return value;
  }

 }

 for(const key of Object.keys(root)){

  const value=root[key];

  if(
   value &&
   typeof value==="object"
  ){

   const found=deepGet(
    value,
    names,
    depth+1
   );

   if(
    found!==null &&
    found!==undefined &&
    found!==""
   )
    return found;

  }

 }

 return null;
}


/* =====================================================
   赔率识别
===================================================== */

function normalizeOdds(o){

 if(!o || typeof o!=="object"){

  return {
   home:null,
   draw:null,
   away:null
  };

 }

 function get(){

  for(
   let i=0;
   i<arguments.length;
   i++
  ){

   const n=num(arguments[i]);

   if(
    n!==null &&
    n>1
   )
    return n;

  }

  return null;
 }

 return {

  home:get(
   o.home,
   o.homeWin,
   o.homeOdds,
   o.home_odds,
   o.win,
   o["3"],
   o["主胜"],
   o["胜"],
   o["主"],
   o["胜赔"],
   o["主胜赔率"],
   o.Home
  ),

  draw:get(
   o.draw,
   o.drawWin,
   o.drawOdds,
   o.draw_odds,
   o.x,
   o["1"],
   o["平"],
   o["平局"],
   o["平赔"],
   o["平局赔率"],
   o.Draw
  ),

  away:get(
   o.away,
   o.awayWin,
   o.awayOdds,
   o.away_odds,
   o.lose,
   o["0"],
   o["负"],
   o["客胜"],
   o["客"],
   o["负赔"],
   o["客胜赔率"],
   o.Away
  )

 };

}


function deepFindOdds(root,depth=0){

 if(
  !root ||
  typeof root!=="object" ||
  depth>7
 )
  return null;

 const direct=normalizeOdds(root);

 if(
  direct.home &&
  direct.draw &&
  direct.away
 )
  return direct;

 const priority=[

  "odds",
  "oddsData",
  "william",
  "williamOdds",
  "europeOdds",
  "europe",
  "euroOdds",
  "欧赔",
  "竞彩",
  "即时",
  "即时赔率",
  "current",
  "currentOdds",
  "latest",
  "latestOdds",
  "market",
  "marketOdds"

 ];

 for(const key of priority){

  if(
   root[key] &&
   typeof root[key]==="object"
  ){

   const found=deepFindOdds(
    root[key],
    depth+1
   );

   if(found)
    return found;

  }

 }

 for(const key of Object.keys(root)){

  const value=root[key];

  if(
   value &&
   typeof value==="object"
  ){

   const found=deepFindOdds(
    value,
    depth+1
   );

   if(found)
    return found;

  }

 }

 return null;
}


/* =====================================================
   原始数据标准化
   注意：raw永远保存，不覆盖
===================================================== */

function normalize(raw){

 const info=
  raw.info ||
  raw.match ||
  raw.event ||
  {};

 const analysis=
  raw.analysis ||
  {};

 const forecast=
  raw.forecasts ||
  raw.forecast ||
  {};

 const home=firstValue(

  info.home,
  info.homeTeam,
  info.home_team,
  info.homeName,

  raw.home,
  raw.homeTeam,
  raw.home_team,
  raw.homeName,
  raw.home_team_name,

  analysis.home,
  analysis.homeTeam

 );

 const away=firstValue(

  info.away,
  info.awayTeam,
  info.away_team,
  info.awayName,

  raw.away,
  raw.awayTeam,
  raw.away_team,
  raw.awayName,
  raw.away_team_name,

  analysis.away,
  analysis.awayTeam

 );

 const league=firstValue(

  info.league,
  info.leagueName,
  info.league_name,
  info.competition,
  info.competitionName,
  info.tournament,

  raw.league,
  raw.leagueName,
  raw.league_name,
  raw.competition,
  raw.competitionName,

  analysis.league

 );

 const matchNo=firstValue(

  info.matchNo,
  info.match_no,
  info.code,
  info.issue,
  info.number,

  raw.matchNo,
  raw.match_no,
  raw.code,
  raw.issue,

  deepGet(
   raw,
   ["lottery_id","lotteryId"]
  )

 );

 const time=firstValue(

  info.time,
  info.startTime,
  info.start_time,
  info.dateTime,

  raw.time,
  raw.startTime,
  raw.start_time,
  raw.dateTime,
  raw.kickoff

 );

 const odds=
  deepFindOdds(raw) ||
  normalizeOdds(
   raw.odds ||
   raw.oddsData ||
   raw.williamOdds ||
   analysis.odds ||
   forecast.odds ||
   {}
  );

 const opening=
  normalizeOdds(

   raw.opening ||
   raw.openingOdds ||
   raw.openOdds ||

   analysis.opening ||
   analysis.openingOdds ||

   {}

  );

 return {

  id:firstValue(
   info.id,
   raw.id,
   matchNo,
   home+"_"+away
  ),

  matchNo,
  league:league || "未知联赛",
  home:home || "主队",
  away:away || "客队",
  time,

  odds,
  opening,

  raw,
  analysis,
  forecast

 };

}


/* =====================================================
   球小策原始数据提取
===================================================== */

function originalData(m){

 const r=m.raw || {};

 return {

  strengthHome:num(
   deepGet(r,[
    "home_strength",
    "homeStrength",
    "主队实力"
   ])
  ),

  strengthAway:num(
   deepGet(r,[
    "away_strength",
    "awayStrength",
    "客队实力"
   ])
  ),

  xgHome:num(
   deepGet(r,[
    "home_xg",
    "homeXG",
    "home_xg_avg",
    "主队xG"
   ])
  ),

  xgAway:num(
   deepGet(r,[
    "away_xg",
    "awayXG",
    "away_xg_avg",
    "客队xG"
   ])
  ),

  xgaHome:num(
   deepGet(r,[
    "home_xga",
    "homeXGA",
    "主队xGA"
   ])
  ),

  xgaAway:num(
   deepGet(r,[
    "away_xga",
    "awayXGA",
    "客队xGA"
   ])
  ),

  h2hHome:num(
   deepGet(r,[
    "home_wins",
    "homeWins",
    "主胜次数"
   ])
  ),

  h2hDraw:num(
   deepGet(r,[
    "draws",
    "drawCount",
    "平局次数"
   ])
  ),

  h2hAway:num(
   deepGet(r,[
    "away_wins",
    "awayWins",
    "客胜次数"
   ])
  ),

  formationHome:firstValue(
   deepGet(r,[
    "home_formation",
    "homeFormation",
    "主队阵型"
   ]),
   "-"
  ),

  formationAway:firstValue(
   deepGet(r,[
    "away_formation",
    "awayFormation",
    "客队阵型"
   ]),
   "-"
  ),

  injuryHome:num(
   deepGet(r,[
    "home_injury_impact",
    "homeInjuryImpact",
    "injury_home",
    "主队伤停影响"
   ])
  ),

  injuryAway:num(
   deepGet(r,[
    "away_injury_impact",
    "awayInjuryImpact",
    "injury_away",
    "客队伤停影响"
   ])
  ),

  rotationHome:firstValue(
   deepGet(r,[
    "home_rotation_risk",
    "homeRotationRisk",
    "主队轮换风险"
   ]),
   "-"
  ),

  rotationAway:firstValue(
   deepGet(r,[
    "away_rotation_risk",
    "awayRotationRisk",
    "客队轮换风险"
   ]),
   "-"
  ),

   deepGet(r,[

   ]),
   ""
  ),

   ]),
   ""
  ),

  )

 };

/* =====================================================
   市场概率
   严禁缺失时返回33%
===================================================== */

function marketProbability(m){

 const h=m.odds.home;
 const d=m.odds.draw;
 const a=m.odds.away;

 if(!h || !d || !a){

  return {

   valid:false,

   home:null,
   draw:null,
   away:null,

   reason:"缺少完整主/平/客赔率"

  };

 }

 const ih=1/h;
 const id=1/d;
 const ia=1/a;

 const sum=ih+id+ia;

 if(!isFinite(sum) || sum<=0){

  return {

   valid:false,

   home:null,
   draw:null,
   away:null,

   reason:"赔率数据无效"

  };

 }

 return {

  valid:true,

  home:ih/sum,
  draw:id/sum,
  away:ia/sum,

  reason:""

 };

}


/* =====================================================
   变盘
===================================================== */

function movement(m){

 if(
  !m.opening.home ||
  !m.opening.draw ||
  !m.opening.away ||
  !m.odds.home ||
  !m.odds.draw ||
  !m.odds.away
 )
  return null;

 function one(open,current){

  const delta=current-open;

  const percent=(delta/open)*100;

  return {

   open,
   current,
   delta,
   percent,

   direction:
    delta<-.01
     ?"降赔"
     :
    delta>.01
     ?"升赔"
     :
     "基本不变"

  };

 }

 return {

  home:one(
   m.opening.home,
   m.odds.home
  ),

  draw:one(
   m.opening.draw,
   m.odds.draw
  ),

  away:one(
   m.opening.away,
   m.odds.away
  )

 };

}


/* =====================================================
   历史CSV
===================================================== */

function historyResult(row){

 const r=String(
  firstValue(

   row["赛果"],
   row["结果"],
   row["竞彩结果"],
   row["胜平负"],
   row["result"],
   row["Result"]

  )
 ).trim();

 if(
  r==="3" ||
  r==="胜" ||
  r==="主胜"
 )
  return "主胜";

 if(
  r==="1" ||
  r==="平"
 )
  return "平";

 if(
  r==="0" ||
  r==="负" ||
  r==="客胜"
 )
  return "客胜";

 return "";

}


function findSimilar(m){

 if(!historyRows.length)
  return [];

 const h=m.odds.home;
 const d=m.odds.draw;
 const a=m.odds.away;

 if(!h || !d || !a)
  return [];

 return historyRows
 .filter(function(row){

  const rh=num(firstValue(

   row["主胜"],
   row["主胜赔率"],
   row["胜"],
   row["home"],
   row["Home"]

  ));

  const rd=num(firstValue(

   row["平"],
   row["平局"],
   row["平局赔率"],
   row["draw"],
   row["Draw"]

  ));

  const ra=num(firstValue(

   row["负"],
   row["客胜"],
   row["客胜赔率"],
   row["away"],
   row["Away"]

  ));

  if(!rh || !rd || !ra)
   return false;

  return(

   Math.abs(rh-h)<=.15 &&
   Math.abs(rd-d)<=.15 &&
   Math.abs(ra-a)<=.15

  );

 })
 .slice(0,500);

}


function historyAnalysis(m){

 const rows=findSimilar(m);

 if(!rows.length){

  return {

   count:0,
   home:0,
   draw:0,
   away:0

  };

 }

 let h=0;
 let d=0;
 let a=0;

 rows.forEach(function(row){

  const r=historyResult(row);

  if(r==="主胜")h++;
  if(r==="平")d++;
  if(r==="客胜")a++;

 });

 const total=h+d+a;

 if(!total){

  return {

   count:0,
   home:0,
   draw:0,
   away:0

  };

 }

 return {

  count:total,

  home:h/total,
  draw:d/total,
  away:a/total

 };

}


/* =====================================================
   泊松模型
===================================================== */

function poisson(k,lambda){

 let result=Math.exp(-lambda);

 for(let i=1;i<=k;i++){

  result*=lambda/i;

 }

 return result;

}


function poissonModel(m){

 const o=originalData(m);

 let lh=null;
 let la=null;

 if(
  o.xgHome!==null &&
  o.xgAway!==null
 ){

  lh=o.xgHome;
  la=o.xgAway;

 }else{

  const mp=marketProbability(m);

  if(mp.valid){

   const totalGoals=2.55;

   lh=
    clamp(
     totalGoals*mp.home*1.25,
     .35,
     3.5
    );

   la=
    clamp(
     totalGoals*mp.away*1.15,
     .25,
     3.5
    );

  }

 }

 if(lh===null || la===null)
  return null;

 let home=0;
 let draw=0;
 let away=0;

 let bestScore={
  score:"1-1",
  p:0
 };

 for(let hg=0;hg<=7;hg++){

  for(let ag=0;ag<=7;ag++){

   const p=
    poisson(hg,lh)*
    poisson(ag,la);

   if(hg>ag)
    home+=p;

   else if(hg===ag)
    draw+=p;

   else
    away+=p;

   if(p>bestScore.p){

    bestScore={
     score:hg+"-"+ag,
     p

    };

   }

  }

 }

 const sum=home+draw+away;

 return {

  home:home/sum,
  draw:draw/sum,
  away:away/sum,

  homeGoals:lh,
  awayGoals:la,

  score:bestScore.score,
  scoreProbability:bestScore.p

 };

}


/* =====================================================
   独立模型
===================================================== */

function independentModel(m){

 const market=marketProbability(m);

 if(!market.valid){

  return {

   valid:false,

   home:null,
   draw:null,
   away:null,

   pick:"数据不足",

   confidence:0,

   drawIndex:0,
   coldIndex:0,
   handicapDrawIndex:0,

   risk:100,

   history:{
    count:0,
    home:0,
    draw:0,
    away:0
   },

   poisson:null,

   reasons:[
    market.reason
   ]

  };

 }

 const hist=historyAnalysis(m);

 const poi=poissonModel(m);

 const o=originalData(m);

 /*
  市场是基础层，
  但不是最终答案。
 */

 let h=market.home*.55;
 let d=market.draw*.55;
 let a=market.away*.55;

 /*
  历史同赔
 */

 if(hist.count>=8){

  h+=hist.home*.20;
  d+=hist.draw*.20;
  a+=hist.away*.20;

 }else{

  h+=market.home*.20;
  d+=market.draw*.20;
  a+=market.away*.20;

 }

 /*
  泊松
 */

 if(poi){

  h+=poi.home*.25;
  d+=poi.draw*.25;
  a+=poi.away*.25;

 }else{

  h+=market.home*.25;
  d+=market.draw*.25;
  a+=market.away*.25;

 }

 /*
  实力/伤停独立修正
 */

 if(
  o.strengthHome!==null &&
  o.strengthAway!==null
 ){

  const diff=
   o.strengthHome-
   o.strengthAway;

  const adj=
   clamp(
    diff/500,
    -.06,
    .06
   );

  h+=adj;
  a-=adj;

 }

 if(
  o.injuryHome!==null &&
  o.injuryAway!==null
 ){

  /*
   伤停影响越负，
   实力扣分越多
  */

  const diff=
   o.injuryHome-
   o.injuryAway;

  const adj=
   clamp(
    diff/100,
    -.05,
    .05
   );

  h+=adj;
  a-=adj;

 }

 h=clamp(h,.01,.98);
 d=clamp(d,.01,.98);
 a=clamp(a,.01,.98);

 const sum=h+d+a;

 h/=sum;
 d/=sum;
 a/=sum;


 /*
  变盘独立指标
 */

 const mv=movement(m);

 let marketRisk=0;

 if(mv){

  const maxMove=Math.max(

   Math.abs(mv.home.percent),
   Math.abs(mv.draw.percent),
   Math.abs(mv.away.percent)

  );

  marketRisk=
   clamp(
    maxMove*8,
    0,
    35
   );

 }


 /*
  平局指数
 */

 let drawIndex=
  d*100;

 if(
  Math.abs(h-a)<.08
 )
  drawIndex+=10;

 if(
  hist.count>=10 &&
  hist.draw>=.30
 )
  drawIndex+=12;

 if(
  poi &&
  poi.draw>=.29
 )
  drawIndex+=10;

 drawIndex=
  clamp(drawIndex,0,100);


 /*
  冷门指数
 */

 const sorted=[
  h,d,a
 ].sort(function(x,y){
  return y-x;
 });

 let coldIndex=
  (1-sorted[0])*100;

 if(
  hist.count>=10 &&
  Math.max(
   hist.home,
   hist.draw,
   hist.away
  )<.48
 )
  coldIndex+=12;

 if(marketRisk>=20)
  coldIndex+=10;

 coldIndex=
  clamp(coldIndex,0,100);


 /*
  让平独立指数

  这里只在主客方向接近、
  且市场/基本面没有明显一边倒时触发。
 */

 let handicapDrawIndex=0;

 if(
  Math.abs(h-a)<=.13
 )
  handicapDrawIndex+=35;

 if(
  d>=.27
 )
  handicapDrawIndex+=25;

 if(
  poi &&
  Math.abs(
   poi.home-poi.away
  )<=.12
 )
  handicapDrawIndex+=20;

 if(
  hist.count>=10 &&
  Math.abs(
   hist.home-hist.away
  )<=.15
 )
  handicapDrawIndex+=15;

 handicapDrawIndex=
  clamp(
   handicapDrawIndex,
   0,
   100
  );


 /*
  风险
 */

 let risk=0;

 const max=Math.max(h,d,a);
 const second=[
  h,d,a
  ]
  .sort(function(x,y){
   return y-x;
  })[1];

 const gap=max-second;

 if(gap<.03)
  risk+=35;
 else if(gap<.06)
  risk+=25;
 else if(gap<.10)
  risk+=15;

 if(max<.42)
  risk+=25;
 else if(max<.46)
  risk+=15;

 risk+=marketRisk*.5;

 if(coldIndex>=65)
  risk+=10;

 risk=
  clamp(
   risk,
   0,
   100
  );


 /*
  最终方向
 */

 let pick="暂不推荐";

 const arr=[

  {
   name:"主胜",
   value:h
  },

  {
   name:"平",
   value:d
  },

  {
   name:"客胜",
   value:a
  }

 ].sort(function(x,y){
  return y.value-x.value;
 });

 /*
  严格平局条件
 */

 const strongDraw=
  d>=.31 &&
  Math.abs(h-a)<=.11 &&
  (
   !poi ||
   poi.draw>=.28
  );

 if(strongDraw){

  pick="平";

 }else if(
  arr[0].value>=.47 &&
  risk<62
 ){

  pick=arr[0].name;

 }

 /*
  让平观察不是强制推荐
 */

 const reasons=[];

 reasons.push(
  "市场基础概率 "+
  pct(market.home)+
  " / "+
  pct(market.draw)+
  " / "+
  pct(market.away)
 );

 if(hist.count>=8){

  reasons.push(
   "历史同赔 "+
   hist.count+
   " 场参与修正"
  );

 }else{

  reasons.push(
   "历史同赔样本不足，未强行修正"
  );

 }

 if(poi){

  reasons.push(
   "泊松比分 "+
   poi.score+
   "，预期进球 "+
   poi.homeGoals.toFixed(2)+
   " : "+
   poi.awayGoals.toFixed(2)
  );

 }

 if(mv){

  reasons.push(
   "检测到初盘→即时盘变化"
  );

 }else{

  reasons.push(
   "当前没有完整初盘/即时盘，变盘不作强结论"
  );

 }

 return {

  valid:true,

  home:h,
  draw:d,
  away:a,

  pick,

  confidence:
   clamp(
    max*100-risk*.35,
    0,
    100
   ),

  drawIndex,
  coldIndex,
  handicapDrawIndex,

  risk,

  history:hist,

  poisson:poi,

  movement:mv,

  reasons

 };

}

   动态读取今日索引
   有 today-index.json 就优先使用
===================================================== */

async function getTodayFiles(){

 const candidates=[

  "data/today-index.json",
  "data/today.json",
  "today-index.json"

 ];

 for(const path of candidates){

  try{

   const response=
    await fetch(
     path+"?t="+Date.now()
    );

   if(!response.ok)
    continue;

   const data=
    await response.json();

   let files=[];

   if(Array.isArray(data))
    files=data;

   else if(Array.isArray(data.files))
    files=data.files;

   else if(Array.isArray(data.matches))
    files=data.matches.map(function(x){

     return firstValue(
      x.path,
      x.file,
      x.json
     );

    }).filter(Boolean);

   if(files.length)
    return files;

  }catch(e){}

 }

 return TODAY_FILES;

}

/* =====================================================
   CSV解析
===================================================== */

function parseCSV(text){

 text=String(text)
  .replace(/^\uFEFF/,"");

 let delimiter=",";

 const firstLine=
  text.split(/\r?\n/)[0] || "";

 if(
  firstLine.split(";").length>
  firstLine.split(",").length
 )
  delimiter=";";

 const rows=[];

 let row=[];
 let cell="";
 let quoted=false;

 for(
  let i=0;
  i<text.length;
  i++
 ){

  const ch=text[i];
  const next=text[i+1];

  if(ch==='"'){

   if(
    quoted &&
    next==='"'
   ){

    cell+='"';
    i++;

   }else{

    quoted=!quoted;

   }

   continue;

  }

  if(
   ch===delimiter &&
   !quoted
  ){

   row.push(cell);
   cell="";
   continue;

  }

  if(
   (ch==="\n" || ch==="\r") &&
   !quoted
  ){

   if(
    ch==="\r" &&
    next==="\n"
   )
    i++;

   row.push(cell);
   cell="";

   if(
    row.some(function(v){
     return String(v).trim()!=="";
    })
   )
    rows.push(row);

   row=[];

   continue;

  }

  cell+=ch;

 }

 if(
  cell!=="" ||
  row.length
 ){

  row.push(cell);

  if(
   row.some(function(v){
    return String(v).trim()!=="";
   })
  )
   rows.push(row);

 }

 if(rows.length<2)
  return [];

 const headers=
  rows[0].map(function(x){

   return String(x)
    .trim()
    .replace(/^\uFEFF/,"");

  });

 return rows.slice(1)
 .map(function(r){

  const obj={};

  headers.forEach(function(h,i){

   obj[h]=
    r[i]===undefined
     ?""
     :r[i];

  });

  return obj;

 });

}


/* =====================================================
   CSV导入
===================================================== */

function importCSV(){

 const file=
  document.getElementById(
   "csvFile"
  ).files[0];

 const box=
  document.getElementById(
   "historyStatus"
  );

 if(!file){

  box.innerHTML=`

   <div class="notice">
    请先选择CSV文件。
   </div>

  `;

  return;

 }

 const reader=
  new FileReader();

 reader.onload=function(e){

  try{

   const rows=
    parseCSV(
     e.target.result
    );

   if(!rows.length)
    throw new Error(
     "没有读取到有效CSV数据"
    );

   historyRows=rows;

   try{

    localStorage.setItem(
     HISTORY_KEY,
     JSON.stringify(rows)
    );

   }catch(storageError){

    /*
     数据过大时仍保留当前页面会话
    */

    console.log(
     "localStorage容量不足",
     storageError
    );

   }

   box.innerHTML=`

    <div class="success">

     成功读取

     <b>${rows.length}</b>

     条历史记录。

     <br>

     已作为独立历史数据库。

    </div>

   `;

   renderHistoryStats();
   renderMatches();
   renderData();
   renderForecast();

  }catch(error){

   box.innerHTML=`

    <div class="danger">

     CSV读取失败：

     ${esc(error.message)}

    </div>

   `;

  }

 };

 reader.onerror=function(){

  box.innerHTML=`

   <div class="danger">
    文件读取失败。
   </div>

  `;

 };

 reader.readAsText(
  file,
  "UTF-8"
 );

}
