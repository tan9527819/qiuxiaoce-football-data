<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>竞彩足球预测分析</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
  "Microsoft YaHei",Arial,sans-serif;
  background:#070b16;
  color:#eef2ff;
  min-height:100vh;
}

button{
  font:inherit;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(7,11,22,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid #20283d;
}

.header-inner{
  max-width:1180px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:.5px;
}

.logo span{
  color:#58a6ff;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:#8ee6a8;
  font-size:13px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#42d878;
  box-shadow:0 0 10px #42d878;
}

.container{
  max-width:1180px;
  margin:auto;
  padding:22px 18px 50px;
}

.hero{
  padding:28px 0 20px;
}

.hero h1{
  font-size:30px;
  line-height:1.25;
  margin-bottom:10px;
}

.hero p{
  color:#8993aa;
  line-height:1.7;
  font-size:14px;
}

.tabs{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:5px 0 18px;
}

.tab{
  border:1px solid #27324a;
  background:#101729;
  color:#9da8c0;
  padding:9px 16px;
  border-radius:9px;
  white-space:nowrap;
  cursor:pointer;
}

.tab.active{
  background:#18365d;
  color:#fff;
  border-color:#377dcc;
}

.panel{
  background:#0d1322;
  border:1px solid #202a40;
  border-radius:14px;
  overflow:hidden;
  margin-bottom:16px;
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 18px;
  border-bottom:1px solid #202a40;
}

.panel-title{
  font-weight:700;
  font-size:16px;
}

.panel-note{
  color:#7e8aa3;
  font-size:12px;
}

.filters{
  display:flex;
  gap:8px;
  padding:13px 16px;
  border-bottom:1px solid #202a40;
}

.filter{
  padding:7px 12px;
  border-radius:7px;
  border:1px solid #29344c;
  background:#11192b;
  color:#aeb8cb;
  cursor:pointer;
}

.filter.active{
  color:#fff;
  background:#1b426f;
  border-color:#3c81ca;
}

.matches{
  display:grid;
  gap:1px;
  background:#202a40;
}

.match{
  background:#0d1322;
  padding:17px;
  cursor:pointer;
  transition:.15s;
}

.match:hover{
  background:#111a2d;
}

.match-top{
  display:flex;
  justify-content:space-between;
  color:#7f8ba4;
  font-size:12px;
  margin-bottom:13px;
}

.match-main{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
}

.team{
  font-size:16px;
  font-weight:700;
}

.team.away{
  text-align:right;
}

.vs{
  text-align:center;
  color:#7d89a2;
  font-size:13px;
}

.time{
  color:#dfe7f8;
  font-weight:700;
}

.badge{
  display:inline-block;
  padding:3px 7px;
  border-radius:5px;
  background:#152d25;
  color:#75db9a;
  margin-left:5px;
}

.analysis{
  padding:16px;
}

.probabilities{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:12px;
}

.prob{
  background:#111a2c;
  border:1px solid #25314a;
  border-radius:10px;
  padding:13px;
}

.prob-name{
  color:#8e99b0;
  font-size:12px;
  margin-bottom:7px;
}

.prob-value{
  font-size:22px;
  font-weight:800;
}

.bar{
  height:5px;
  background:#252f44;
  border-radius:5px;
  overflow:hidden;
  margin-top:9px;
}

.bar i{
  display:block;
  height:100%;
  background:#4d9be8;
  border-radius:5px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:16px;
}

.info{
  background:#11192a;
  border:1px solid #242e45;
  border-radius:10px;
  padding:14px;
}

.info-label{
  color:#7f8aa2;
  font-size:12px;
  margin-bottom:8px;
}

.info-value{
  font-size:18px;
  font-weight:700;
}

.empty{
  padding:42px 20px;
  text-align:center;
  color:#7d879e;
}

.footer{
  text-align:center;
  padding:28px 10px;
  color:#59657c;
  font-size:12px;
}

@media(max-width:700px){
  .hero h1{
    font-size:25px;
  }

  .container{
    padding:18px 12px 40px;
  }

  .info-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .match-main{
    grid-template-columns:1fr 50px 1fr;
  }

  .team{
    font-size:14px;
  }

  .probabilities{
    gap:6px;
  }

  .prob{
    padding:11px 8px;
  }

  .prob-value{
    font-size:19px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      竞彩足球<span>预测分析</span>
    </div>

    <div class="status">
      <i class="dot"></i>
      免费开放
    </div>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>今日竞彩足球分析</h1>
    <p>
      综合球队状态、历史数据、比赛信息与模型结果，
      提供赛前数据分析及赛后统计。
    </p>
  </section>

  <nav class="tabs">
    <button class="tab active" onclick="switchTab(this,'today')">今日赛事</button>
    <button class="tab" onclick="switchTab(this,'analysis')">数据分析</button>
    <button class="tab" onclick="switchTab(this,'history')">历史数据</button>
    <button class="tab" onclick="switchTab(this,'review')">赛后统计</button>
  </nav>

  <section id="today">

    <div class="panel">

      <div class="panel-head">
        <div class="panel-title">今日赛事</div>
        <div class="panel-note" id="dateText">数据加载中</div>
      </div>

      <div class="filters">
        <button class="filter active">全部</button>
        <button class="filter">待赛</button>
        <button class="filter">进行中</button>
        <button class="filter">已结束</button>
      </div>

      <div class="matches" id="matches">

        <div class="empty">
          正在读取赛事数据……
        </div>

      </div>
    </div>

  </section>

  <section id="analysis" style="display:none">

    <div class="panel">

      <div class="panel-head">
        <div class="panel-title">综合数据分析</div>
        <div class="panel-note">免费开放</div>
      </div>

      <div class="info-grid">

        <div class="info">
          <div class="info-label">分析赛事</div>
          <div class="info-value" id="matchCount">--</div>
        </div>

        <div class="info">
          <div class="info-label">数据状态</div>
          <div class="info-value">正常</div>
        </div>

        <div class="info">
          <div class="info-label">历史数据</div>
          <div class="info-value">已接入</div>
        </div>

        <div class="info">
          <div class="info-label">分析模式</div>
          <div class="info-value">综合</div>
        </div>

      </div>

      <div class="analysis">

        <div class="panel-title">模型输出</div>

        <div class="probabilities">

          <div class="prob">
            <div class="prob-name">主胜</div>
            <div class="prob-value">--</div>
            <div class="bar"><i style="width:0"></i></div>
          </div>

          <div class="prob">
            <div class="prob-name">平局</div>
            <div class="prob-value">--</div>
            <div class="bar"><i style="width:0"></i></div>
          </div>

          <div class="prob">
            <div class="prob-name">客胜</div>
            <div class="prob-value">--</div>
            <div class="bar"><i style="width:0"></i></div>
          </div>

        </div>

      </div>

    </div>

  </section>

  <section id="history" style="display:none">

    <div class="panel">

      <div class="panel-head">
        <div class="panel-title">历史数据</div>
        <div class="panel-note">持续积累</div>
      </div>

      <div class="empty">
        历史比赛数据将在数据接口接入后自动显示。
      </div>

    </div>

  </section>

  <section id="review" style="display:none">

    <div class="panel">

      <div class="panel-head">
        <div class="panel-title">赛后统计</div>
        <div class="panel-note">自动追踪</div>
      </div>

      <div class="info-grid">

        <div class="info">
          <div class="info-label">统计周期</div>
          <div class="info-value">30天</div>
        </div>

        <div class="info">
          <div class="info-label">预测场次</div>
          <div class="info-value">--</div>
        </div>

        <div class="info">
          <div class="info-label">方向命中</div>
          <div class="info-value">--</div>
        </div>

        <div class="info">
          <div class="info-label">命中率</div>
          <div class="info-value">--</div>
        </div>

      </div>

      <div class="empty">
        等待赛后数据统计。
      </div>

    </div>

  </section>

</main>

<footer class="footer">
  竞彩足球预测分析 · 数据分析工具
</footer>

<script>

function switchTab(button,id){

  document.querySelectorAll(".tab")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  ["today","analysis","history","review"]
    .forEach(x=>{
      document.getElementById(x).style.display =
        x===id ? "block" : "none";
    });
}

function today(){

  const d=new Date();

  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");

  document.getElementById("dateText").textContent =
    `${y}-${m}-${day}`;

}

today();

</script>

</body>
</html>
