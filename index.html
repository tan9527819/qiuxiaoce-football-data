<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>竞彩足球预测分析</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f4f6f9;
    color:#172033;
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#101827,#1d3557);
    color:#fff;
    padding:22px 16px 18px;
}

.header h1{
    margin:0;
    font-size:23px;
}

.header p{
    margin:7px 0 0;
    font-size:13px;
    opacity:.75;
}

.toolbar{
    background:#fff;
    padding:12px;
    border-bottom:1px solid #e5e7eb;
    position:sticky;
    top:0;
    z-index:20;
}

.toolbar-inner{
    display:flex;
    gap:8px;
}

input,button{
    height:42px;
    border-radius:9px;
    font-size:15px;
}

input{
    flex:1;
    border:1px solid #d9dee7;
    padding:0 12px;
}

button{
    border:0;
    padding:0 16px;
    background:#172033;
    color:#fff;
}

.container{
    max-width:900px;
    margin:15px auto;
    padding:0 12px 50px;
}

.status{
    background:#fff;
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:13px;
    color:#667085;
    font-size:13px;
}

.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:15px;
    box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.card-head{
    padding:15px;
    border-bottom:1px solid #edf0f4;
}

.code{
    color:#1677ff;
    font-weight:700;
    font-size:13px;
}

.league{
    color:#667085;
    font-size:12px;
    margin-left:6px;
}

.teams{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
}

.team{
    flex:1;
    font-size:18px;
    font-weight:800;
}

.away{
    text-align:right;
}

.vs{
    color:#98a2b3;
    font-size:12px;
}

.time{
    margin-top:8px;
    color:#667085;
    font-size:12px;
}

.section{
    padding:14px 15px;
    border-bottom:1px solid #edf0f4;
}

.section:last-child{
    border-bottom:0;
}

.title{
    font-size:14px;
    font-weight:800;
    margin-bottom:10px;
}

.odds{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.odd{
    background:#f7f8fa;
    border-radius:9px;
    padding:12px 8px;
    text-align:center;
}

.odd-label{
    font-size:12px;
    color:#667085;
    margin-bottom:6px;
}

.odd-value{
    font-size:19px;
    font-weight:800;
}

.handicap{
    background:#f8fafc;
    border-radius:9px;
    padding:10px;
    margin-bottom:10px;
    text-align:center;
    font-weight:700;
}

.analysis{
    line-height:1.8;
    font-size:14px;
}

.final{
    background:#f8fafc;
}

.final-main{
    font-size:19px;
    font-weight:900;
}

.muted{
    color:#98a2b3;
}

.error{
    background:#fff5f5;
    color:#b42318;
    padding:14px;
    border-radius:9px;
    line-height:1.7;
}

.empty{
    background:#fff;
    padding:45px 15px;
    border-radius:12px;
    text-align:center;
    color:#98a2b3;
}

.loading{
    background:#fff;
    padding:45px 15px;
    border-radius:12px;
    text-align:center;
    color:#667085;
}

.refresh{
    margin-top:10px;
    width:100%;
    height:42px;
}

.source{
    font-size:11px;
    color:#98a2b3;
    margin-top:10px;
}

@media(max-width:600px){
    .team{
        font-size:16px;
    }

    .odd-value{
        font-size:17px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>竞彩足球预测分析</h1>
    <p>真实竞彩比赛 · 胜平负 · 让球胜平负</p>
</header>

<div class="toolbar">
    <div class="toolbar-inner">
        <input id="date" type="date">
        <button onclick="loadData()">刷新</button>
    </div>
</div>

<main class="container">

    <div id="status" class="status">
        正在连接中国竞彩网……
    </div>

    <div id="matches">
        <div class="loading">
            正在读取今日竞彩足球……
        </div>
    </div>

</main>

<script>

const API =
"https://webapi.sporttery.cn/gateway/jc/football/getMatchCalculatorV1.qry";

const dateInput =
document.getElementById("date");

const statusBox =
document.getElementById("status");

const matchesBox =
document.getElementById("matches");


/* =========================
   今天
========================= */

function today(){

    const d = new Date();

    return d.getFullYear()
        + "-"
        + String(d.getMonth()+1).padStart(2,"0")
        + "-"
        + String(d.getDate()).padStart(2,"0");
}

dateInput.value=today();


/* =========================
   安全输出
========================= */

function esc(v){

    if(v===undefined || v===null)
        return "";

    return String(v)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}


/* =========================
   数字
========================= */

function number(v){

    if(v===undefined || v===null)
        return "暂无";

    return String(v);
}


/* =========================
   请求官方竞彩
========================= */

async function requestOfficial(date){

    /*
      竞彩接口使用日期参数。
      格式：yyyy-MM-dd
    */

    const url =
        API
        + "?matchDate="
        + encodeURIComponent(date)
        + "&lotteryCode=JCZQ";

    const response =
        await fetch(url,{
            method:"GET",
            headers:{
                "Accept":"application/json"
            },
            cache:"no-store"
        });

    if(!response.ok){

        throw new Error(
            "官方接口 HTTP "+response.status
        );
    }

    const json =
        await response.json();

    return json;
}


/* =========================
   从接口提取比赛
========================= */

function extractMatches(json){

    /*
      不同版本接口字段可能略有差异，
      因此这里兼容常见结构。
    */

    if(!json)
        return [];

    if(Array.isArray(json))
        return json;

    if(json.value &&
       Array.isArray(json.value))
        return json.value;

    if(json.data &&
       Array.isArray(json.data))
        return json.data;

    if(json.data &&
       Array.isArray(json.data.matchList))
        return json.data.matchList;

    if(json.value &&
       Array.isArray(json.value.matchList))
        return json.value.matchList;

    if(json.data &&
       json.data.matchInfo &&
       Array.isArray(json.data.matchInfo))
        return json.data.matchInfo;

    return [];
}


/* =========================
   字段兼容
========================= */

function pick(obj,keys){

    for(const key of keys){

        if(
            obj &&
            obj[key]!==undefined &&
            obj[key]!==null &&
            obj[key]!==""
        ){
            return obj[key];
        }
    }

    return null;
}


/* =========================
   主队
========================= */

function homeName(m){

    return pick(m,[
        "homeTeamName",
        "homeTeam",
        "home",
        "homeName",
        "hName"
    ]) || "主队";
}


/* =========================
   客队
========================= */

function awayName(m){

    return pick(m,[
        "awayTeamName",
        "awayTeam",
        "away",
        "awayName",
        "aName"
    ]) || "客队";
}


/* =========================
   赛事
========================= */

function leagueName(m){

    const league =
        m.league ||
        m.leagueInfo ||
        {};

    if(typeof league==="string")
        return league;

    return pick(league,[
        "leagueName",
        "name",
        "abbName"
    ])
    ||
    pick(m,[
        "leagueName",
        "competitionName",
        "league"
    ])
    ||
    "竞彩足球";
}


/* =========================
   编号
========================= */

function matchNumber(m){

    return pick(m,[
        "matchNumStr",
        "matchNum",
        "matchNumber",
        "num",
        "matchCode",
        "code"
    ]) || "竞彩";


}


/* =========================
   时间
========================= */

function matchTime(m){

    return pick(m,[
        "matchDateTime",
        "matchTime",
        "startTime",
        "dateTime",
        "kickoffTime"
    ]) || "暂无时间";
}


/* =========================
   胜平负
========================= */

function getHad(m){

    const had =
        m.had ||
        m.HAD ||
        m.spf ||
        m.winDrawLose ||
        {};

    return {

        win:pick(had,[
            "h",
            "home",
            "win",
            "homeWin"
        ]),

        draw:pick(had,[
            "d",
            "draw"
        ]),

        lose:pick(had,[
            "a",
            "away",
            "lose",
            "awayWin"
        ])
    };
}


/* =========================
   让球
========================= */

function getHhad(m){

    const hhad =
        m.hhad ||
        m.HHAD ||
        m.handicap ||
        {};

    return {

        line:pick(hhad,[
            "goalLine",
            "handicap",
            "goal",
            "letBall"
        ]),

        win:pick(hhad,[
            "h",
            "home",
            "win"
        ]),

        draw:pick(hhad,[
            "d",
            "draw"
        ]),

        lose:pick(hhad,[
            "a",
            "away",
            "lose"
        ])
    };
}


/* =========================
   分析
========================= */

function buildAnalysis(m,had,hhad){

    const list=[];

    if(
        had.win!==null &&
        had.draw!==null &&
        had.lose!==null
    ){

        const nums=[
            Number(had.win),
            Number(had.draw),
            Number(had.lose)
        ];

        const min=Math.min(...nums);

        if(Number(had.win)===min){

            list.push(
                "竞彩赔率当前最低项为主胜。"
            );

        }else if(Number(had.draw)===min){

            list.push(
                "竞彩赔率当前最低项为平。"
            );

        }else{

            list.push(
                "竞彩赔率当前最低项为主负。"
            );
        }

    }else{

        list.push(
            "胜平负赔率暂无完整数据。"
        );
    }


    if(hhad.line!==null){

        list.push(
            "竞彩让球："+hhad.line+"。"
        );

    }else{

        list.push(
            "让球数据暂无。"
        );
    }


    list.push(
        "XG：暂无数据。"
    );

    list.push(
        "历史同赔：暂无数据。"
    );

    return list;
}


/* =========================
   渲染比赛
========================= */

function renderMatch(m,index){

    const had =
        getHad(m);

    const hhad =
        getHhad(m);

    const home =
        homeName(m);

    const away =
        awayName(m);

    const league =
        leagueName(m);

    const num =
        matchNumber(m);

    const time =
        matchTime(m);

    const analysis =
        buildAnalysis(
            m,
            had,
            hhad
        );


    let finalText =
        "暂不推荐";

    if(
        had.win!==null &&
        had.draw!==null &&
        had.lose!==null
    ){

        const arr=[
            {
                label:"主胜",
                value:Number(had.win)
            },
            {
                label:"平",
                value:Number(had.draw)
            },
            {
                label:"主负",
                value:Number(had.lose)
            }
        ];

        arr.sort(
            (a,b)=>a.value-b.value
        );

        finalText =
            "赔率最低方向："+arr[0].label;
    }


    return `
    <article class="card">

        <div class="card-head">

            <div>
                <span class="code">
                    ${esc(num)}
                </span>

                <span class="league">
                    ${esc(league)}
                </span>
            </div>

            <div class="teams">

                <div class="team">
                    ${esc(home)}
                </div>

                <div class="vs">
                    VS
                </div>

                <div class="team away">
                    ${esc(away)}
                </div>

            </div>

            <div class="time">
                开赛：${esc(time)}
            </div>

        </div>


        <section class="section">

            <div class="title">
                胜平负
            </div>

            <div class="odds">

                <div class="odd">
                    <div class="odd-label">
                        主胜
                    </div>

                    <div class="odd-value">
                        ${esc(number(had.win))}
                    </div>
                </div>

                <div class="odd">
                    <div class="odd-label">
                        平
                    </div>

                    <div class="odd-value">
                        ${esc(number(had.draw))}
                    </div>
                </div>

                <div class="odd">
                    <div class="odd-label">
                        主负
                    </div>

                    <div class="odd-value">
                        ${esc(number(had.lose))}
                    </div>
                </div>

            </div>

        </section>


        <section class="section">

            <div class="title">
                让球胜平负
            </div>

            <div class="handicap">

                让球：
                ${esc(
                    hhad.line===null
                    ? "暂无"
                    : hhad.line
                )}

            </div>

            <div class="odds">

                <div class="odd">
                    <div class="odd-label">
                        让胜
                    </div>

                    <div class="odd-value">
                        ${esc(number(hhad.win))}
                    </div>
                </div>

                <div class="odd">
                    <div class="odd-label">
                        让平
                    </div>

                    <div class="odd-value">
                        ${esc(number(hhad.draw))}
                    </div>
                </div>

                <div class="odd">
                    <div class="odd-label">
                        让负
                    </div>

                    <div class="odd-value">
                        ${esc(number(hhad.lose))}
                    </div>
                </div>

            </div>

        </section>


        <section class="section">

            <div class="title">
                简单分析
            </div>

            <div class="analysis">

                ${analysis.map(x=>
                    `<div>• ${esc(x)}</div>`
                ).join("")}

            </div>

        </section>


        <section class="section final">

            <div class="title">
                最终判断
            </div>

            <div class="final-main">
                ${esc(finalText)}
            </div>

            <div class="source">
                仅根据当前真实竞彩赔率判断，不代表比赛结果。
            </div>

        </section>

    </article>
    `;
}


/* =========================
   加载数据
========================= */

async function loadData(){

    const date =
        dateInput.value ||
        today();

    statusBox.innerHTML =
        "正在读取中国竞彩网真实数据……";

    matchesBox.innerHTML =
        `
        <div class="loading">
            正在读取竞彩足球……
        </div>
        `;


    try{

        const json =
            await requestOfficial(date);

        const matches =
            extractMatches(json);


        if(!matches.length){

            throw new Error(
                "官方接口返回成功，但当前日期没有可读取的竞彩比赛。"
            );
        }


        matchesBox.innerHTML =
            matches
            .map(renderMatch)
            .join("");


        statusBox.innerHTML =
            `
            <b>竞彩足球</b>
            · ${esc(date)}
            · 已读取 ${matches.length} 场
            <div class="source">
                数据来源：中国竞彩网公开数据
            </div>
            `;


    }catch(error){

        console.error(error);

        statusBox.innerHTML =
            "竞彩数据读取失败";

        matchesBox.innerHTML =
            `
            <div class="error">

                <b>无法直接读取官方竞彩接口</b>

                <br><br>

                ${esc(error.message)}

                <br><br>

                这不是虚假数据。
                页面不会用其他网站数据冒充竞彩数据。

                <br><br>

                官方竞彩数据来源：
                sporttery.cn

                <br><br>

                如果你的 GitHub Pages 被官方接口的跨域或 WAF 拦截，
                下一步只需要增加一个很小的中转方式，
                网页本身不用重新设计。

            </div>
            `;
    }
}


/* =========================
   启动
========================= */

loadData();

</script>

</body>
</html>
