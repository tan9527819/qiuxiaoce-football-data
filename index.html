<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>竞彩足球预测分析</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#f5f7fa;
    color:#172033;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
    "Microsoft YaHei",Arial,sans-serif;
}
.header{
    background:#111827;
    color:white;
    padding:18px 16px;
    position:sticky;
    top:0;
    z-index:10;
}
.header h1{
    margin:0;
    font-size:22px;
}
.header p{
    margin:6px 0 0;
    font-size:13px;
    color:#aeb7c6;
}
.container{
    max-width:1100px;
    margin:auto;
    padding:16px;
}
.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}
button{
    border:0;
    border-radius:9px;
    padding:10px 15px;
    background:#2563eb;
    color:white;
    font-size:14px;
    cursor:pointer;
}
button.secondary{
    background:#e5e7eb;
    color:#374151;
}
.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:16px;
}
.summary-box{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.summary-box .num{
    font-size:24px;
    font-weight:700;
}
.summary-box .label{
    font-size:12px;
    color:#6b7280;
    margin-top:4px;
}
.match{
    background:white;
    border-radius:14px;
    margin-bottom:15px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}
.match-head{
    padding:13px 15px;
    background:#f8fafc;
    border-bottom:1px solid #edf0f4;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}
.match-title{
    font-weight:700;
}
.league{
    color:#2563eb;
    font-size:12px;
}
.time{
    color:#6b7280;
    font-size:12px;
}
.match-main{
    padding:18px 15px;
}
.teams{
    display:grid;
    grid-template-columns:1fr 100px 1fr;
    align-items:center;
    text-align:center;
    gap:10px;
}
.team{
    font-size:18px;
    font-weight:700;
}
.vs{
    color:#9ca3af;
    font-size:13px;
}
.odds{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:15px;
    flex-wrap:wrap;
}
.odd{
    min-width:70px;
    padding:8px;
    border:1px solid #e5e7eb;
    border-radius:8px;
    text-align:center;
}
.odd span{
    display:block;
    font-size:11px;
    color:#6b7280;
}
.odd b{
    font-size:16px;
}
.analysis{
    margin-top:17px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.analysis-box{
    background:#f8fafc;
    border-radius:10px;
    padding:13px;
}
.analysis-box h3{
    margin:0 0 8px;
    font-size:14px;
}
.analysis-box p{
    margin:0;
    font-size:13px;
    line-height:1.7;
    color:#4b5563;
}
.signal{
    margin-top:12px;
    padding:13px;
    border-radius:10px;
    background:#eff6ff;
    border-left:4px solid #2563eb;
}
.signal strong{
    font-size:15px;
}
.signal p{
    margin:6px 0 0;
    font-size:13px;
    line-height:1.6;
}
.result{
    margin-top:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:13px;
    border-radius:10px;
    background:#f9fafb;
}
.pick{
    font-size:20px;
    font-weight:800;
}
.risk{
    padding:5px 9px;
    border-radius:7px;
    font-size:12px;
    background:#fef3c7;
    color:#92400e;
}
.empty{
    text-align:center;
    padding:50px 20px;
    color:#6b7280;
    background:white;
    border-radius:14px;
}
.footer{
    text-align:center;
    padding:25px;
    color:#9ca3af;
    font-size:12px;
}
@media(max-width:700px){
    .summary{
        grid-template-columns:repeat(2,1fr);
    }
    .analysis{
        grid-template-columns:1fr;
    }
    .teams{
        grid-template-columns:1fr 50px 1fr;
    }
    .team{
        font-size:16px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>竞彩足球预测分析</h1>
    <p>数据分析 · 赔率变化 · 比赛判断</p>
</header>

<main class="container">

    <div class="toolbar">
        <button onclick="loadData()">刷新比赛</button>
        <button class="secondary" onclick="demoData()">查看示例</button>
    </div>

    <section class="summary">
        <div class="summary-box">
            <div class="num" id="matchCount">0</div>
            <div class="label">比赛场次</div>
        </div>
        <div class="summary-box">
            <div class="num" id="mainCount">0</div>
            <div class="label">重点关注</div>
        </div>
        <div class="summary-box">
            <div class="num" id="drawCount">0</div>
            <div class="label">平局倾向</div>
        </div>
        <div class="summary-box">
            <div class="num" id="coldCount">0</div>
            <div class="label">冷门预警</div>
        </div>
    </section>

    <section id="matches">
        <div class="empty">
            正在读取比赛数据……
        </div>
    </section>

</main>

<div class="footer">
    预测结果仅供数据研究参考，不代表比赛结果。
</div>

<script>

/* =========================
   数据读取
========================= */

async function loadData(){

    const box=document.getElementById("matches");

    box.innerHTML='<div class="empty">正在读取比赛数据……</div>';

    const paths=[
        "./data/api_football/today.json",
        "./data/today.json",
        "./today.json",
        "./matches.json"
    ];

    let data=null;

    for(const path of paths){

        try{

            const res=await fetch(path+"?t="+Date.now());

            if(res.ok){

                data=await res.json();

                if(data) break;
            }

        }catch(e){}
    }

    if(!data){

        box.innerHTML=`
        <div class="empty">
            <h3>暂时没有读取到比赛数据</h3>
            <p>如果 GitHub Actions 已运行，请稍后点击“刷新比赛”。</p>
        </div>`;

        return;
    }

    render(data);
}


/* =========================
   数据标准化
========================= */

function normalize(data){

    let list=[];

    if(Array.isArray(data)) list=data;

    else if(Array.isArray(data.matches)) list=data.matches;

    else if(Array.isArray(data.fixtures)) list=data.fixtures;

    else if(Array.isArray(data.data)) list=data.data;

    return list.map((m,i)=>{

        const home=
            m.home ||
            m.homeTeam ||
            m.home_team ||
            m.teams?.home?.name ||
            "主队";

        const away=
            m.away ||
            m.awayTeam ||
            m.away_team ||
            m.teams?.away?.name ||
            "客队";

        const league=
            m.league ||
            m.competition ||
            m.leagueName ||
            m.league?.name ||
            "足球赛事";

        const time=
            m.time ||
            m.date ||
            m.matchTime ||
            m.fixture?.date ||
            "";

        const odds=m.odds || {};

        return {
            id:i+1,
            home,
            away,
            league,
            time,
            win:odds.win || m.win || m.homeOdd || "",
            draw:odds.draw || m.draw || m.drawOdd || "",
            lose:odds.lose || m.lose || m.awayOdd || "",
            handicap:m.handicap || m.asian || "",
            raw:m
        };

    });
}


/* =========================
   核心分析
========================= */

function analyze(m){

    const win=parseFloat(m.win);
    const draw=parseFloat(m.draw);
    const lose=parseFloat(m.lose);

    let pick="待分析";
    let confidence=0;
    let risk="正常";

    /*
      不再简单粗暴地“低赔率=必胜”。

      综合考虑：
      1. 欧赔结构
      2. 平局赔率
      3. 主客方向
      4. 是否存在明显异常
    */

    if(!isNaN(win) && !isNaN(draw) && !isNaN(lose)){

        const inv=[
            1/win,
            1/draw,
            1/lose
        ];

        const total=inv[0]+inv[1]+inv[2];

        const probs=inv.map(x=>x/total);

        const max=Math.max(...probs);
        const idx=probs.indexOf(max);

        confidence=Math.round(max*100);

        if(idx===0) pick="胜";
        if(idx===1) pick="平";
        if(idx===2) pick="负";

        /*
          平局赔率处于合理区间时，
          不再强行忽略平局。
        */

        if(
            draw>2.65 &&
            draw<3.45 &&
            Math.abs(probs[0]-probs[2])<0.10
        ){
            pick="平";
            risk="平局预警";
        }

        /*
          两边赔率接近，
          说明比赛分歧较大。
        */

        if(
            Math.abs(win-lose)<0.35 &&
            draw<3.50
        ){
            risk="高波动";
        }

        /*
          明显低赔但双方实力/赔率结构不协调，
          提高冷门警戒。
        */

        if(
            (win<1.55 && lose>5) ||
            (lose<1.55 && win>5)
        ){
            risk="热门风险";
        }

    }else{

        pick="待结合数据判断";
        confidence=0;
    }

    let basic=
        `${m.home}与${m.away}的当前盘面需要重点观察主客方向是否与赔率结构一致。`;

    let oddsText="目前缺少完整欧赔数据，暂不进行强行判断。";

    if(!isNaN(win)&&!isNaN(draw)&&!isNaN(lose)){

        oddsText=
        `当前胜/平/负赔率为 ${win.toFixed(2)} / ${draw.toFixed(2)} / ${lose.toFixed(2)}。`+
        `从赔率结构看，${pick}方向暂时占据相对优势，但仍需要结合临场变化确认。`;
    }

    let movement=
        "目前没有足够的连续盘口数据判断变盘方向。";

    if(m.raw){

        if(
            m.raw.movement ||
            m.raw.change ||
            m.raw.oddsChange
        ){
            movement=
                m.raw.movement ||
                m.raw.change ||
                m.raw.oddsChange;
        }
    }

    let cold="暂无明确冷门信号";

    if(risk==="热门风险"){
        cold="热门方向赔率过低，存在防冷必要，建议不要只看表面排名。";
    }

    if(risk==="高波动"){
        cold="主客方向接近，比赛分歧较大，平局或反向结果值得防范。";
    }

    if(risk==="平局预警"){
        cold="平局结构较明显，本场不建议简单按照强弱关系处理。";
    }

    return {
        pick,
        confidence,
        risk,
        basic,
        oddsText,
        movement,
        cold
    };
}


/* =========================
   页面渲染
========================= */

function render(data){

    const list=normalize(data);

    const box=document.getElementById("matches");

    if(!list.length){

        box.innerHTML=`
        <div class="empty">
            暂无比赛数据
        </div>`;

        updateSummary([]);

        return;
    }

    let html="";

    list.forEach((m,index)=>{

        const a=analyze(m);

        html+=`
        <article class="match">

            <div class="match-head">

                <div>
                    <span class="league">${escapeHtml(m.league)}</span>
                    <span class="match-title">
                       　${String(index+1).padStart(2,"0")} ${escapeHtml(m.home)}
                        vs ${escapeHtml(m.away)}
                    </span>
                </div>

                <div class="time">
                    ${formatTime(m.time)}
                </div>

            </div>

            <div class="match-main">

                <div class="teams">

                    <div class="team">
                        ${escapeHtml(m.home)}
                    </div>

                    <div class="vs">
                        VS
                    </div>

                    <div class="team">
                        ${escapeHtml(m.away)}
                    </div>

                </div>

                <div class="odds">

                    <div class="odd">
                        <span>胜</span>
                        <b>${show(m.win)}</b>
                    </div>

                    <div class="odd">
                        <span>平</span>
                        <b>${show(m.draw)}</b>
                    </div>

                    <div class="odd">
                        <span>负</span>
                        <b>${show(m.lose)}</b>
                    </div>

                    <div class="odd">
                        <span>让球</span>
                        <b>${show(m.handicap)}</b>
                    </div>

                </div>

                <div class="analysis">

                    <div class="analysis-box">
                        <h3>基本面判断</h3>
                        <p>${escapeHtml(a.basic)}</p>
                    </div>

                    <div class="analysis-box">
                        <h3>赔率结构</h3>
                        <p>${escapeHtml(a.oddsText)}</p>
                    </div>

                    <div class="analysis-box">
                        <h3>数据异动</h3>
                        <p>${escapeHtml(a.movement)}</p>
                    </div>

                    <div class="analysis-box">
                        <h3>冷门风险</h3>
                        <p>${escapeHtml(a.cold)}</p>
                    </div>

                </div>

                <div class="signal">

                    <strong>综合判断</strong>

                    <p>
                        当前模型倾向：
                        <b>${a.pick}</b>
                        ${a.confidence ? `，结构概率约 ${a.confidence}%` : ""}
                        。
                        ${a.risk}
                    </p>

                </div>

                <div class="result">

                    <div>
                        <span style="font-size:12px;color:#6b7280">
                            单场建议
                        </span>
                        <div class="pick">${a.pick}</div>
                    </div>

                    <div class="risk">
                        ${a.risk}
                    </div>

                </div>

            </div>

        </article>
        `;
    });

    box.innerHTML=html;

    updateSummary(list);
}


/* =========================
   统计
========================= */

function updateSummary(list){

    document.getElementById("matchCount").textContent=list.length;

    let draw=0;
    let cold=0;
    let main=0;

    list.forEach(m=>{

        const a=analyze(m);

        if(a.pick==="平") draw++;

        if(
            a.risk==="热门风险" ||
            a.risk==="高波动" ||
            a.risk==="平局预警"
        ){
            cold++;
        }

        if(a.confidence>=55) main++;

    });

    document.getElementById("drawCount").textContent=draw;
    document.getElementById("coldCount").textContent=cold;
    document.getElementById("mainCount").textContent=main;
}


/* =========================
   示例数据
========================= */

function demoData(){

    render([
        {
            league:"英超",
            home:"主队A",
            away:"客队B",
            time:"20:00",
            odds:{
                win:1.72,
                draw:3.55,
                lose:4.60
            },
            handicap:"-1"
        },
        {
            league:"西甲",
            home:"主队C",
            away:"客队D",
            time:"21:30",
            odds:{
                win:2.55,
                draw:3.10,
                lose:2.65
            },
            handicap:"0"
        }
    ]);
}


/* =========================
   辅助
========================= */

function show(v){

    if(v===undefined || v===null || v==="")
        return "--";

    return v;
}

function formatTime(t){

    if(!t) return "--";

    try{

        const d=new Date(t);

        if(!isNaN(d.getTime())){

            return d.toLocaleString("zh-CN",{
                month:"2-digit",
                day:"2-digit",
                hour:"2-digit",
                minute:"2-digit"
            });

        }

    }catch(e){}

    return t;
}

function escapeHtml(str){

    return String(str ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   自动读取
========================= */

loadData();

</script>

</body>
</html>
