<script>
(function () {
    'use strict';

    /* =========================================
       免费模式：只移除收费/会员限制
       不增加任何新功能
       ========================================= */

    const removeWords = [
        'VIP',
        '会员',
        '会员中心',
        '开通会员',
        '立即开通',
        '购买会员',
        '订阅',
        '充值',
        '支付',
        '付费',
        '付款',
        '积分充值',
        '购买积分',
        '积分商城',
        '付费解锁',
        '会员专享',
        'VIP专享',
        '会员专属',
        '登录后查看',
        '开通后查看',
        '购买后查看',
        '充值后查看'
    ];

    function hasPayWord(text) {
        if (!text) return false;

        return removeWords.some(function(word) {
            return text.indexOf(word) !== -1;
        });
    }

    function removePayElements() {

        const elements = document.querySelectorAll(
            'button, a, div, span, p, li, section, article'
        );

        elements.forEach(function(el) {

            const text = (el.innerText || '').trim();

            if (!text || text.length > 80) return;

            if (hasPayWord(text)) {

                /*
                 * 只删除明显的收费入口。
                 * 如果是整个分析区域，则不删除。
                 */
                const cls = (
                    (el.className || '') + ' ' +
                    (el.id || '')
                ).toLowerCase();

                const payClass =
                    cls.indexOf('vip') !== -1 ||
                    cls.indexOf('member') !== -1 ||
                    cls.indexOf('pay') !== -1 ||
                    cls.indexOf('charge') !== -1 ||
                    cls.indexOf('subscribe') !== -1;

                if (payClass || text.length < 30) {
                    el.remove();
                }
            }
        });
    }

    function unlockButtons() {

        const elements = document.querySelectorAll(
            'button, a, input'
        );

        elements.forEach(function(el) {

            const text =
                (el.innerText || '') +
                ' ' +
                (el.value || '') +
                ' ' +
                (el.getAttribute('title') || '');

            if (hasPayWord(text)) {

                /*
                 * 收费按钮直接移除，
                 * 不替换成新的按钮。
                 */
                el.remove();
            }
        });
    }

    function removePayOverlays() {

        const elements = document.querySelectorAll(
            '[class], [id]'
        );

        elements.forEach(function(el) {

            const name = (
                (el.className || '') + ' ' +
                (el.id || '')
            ).toLowerCase();

            if (
                name.includes('vip') ||
                name.includes('member') ||
                name.includes('payment') ||
                name.includes('paywall') ||
                name.includes('subscribe') ||
                name.includes('recharge')
            ) {

                /*
                 * 避免误删整个页面主体
                 */
                const text = (el.innerText || '').trim();

                if (
                    text.length < 300 ||
                    name.includes('paywall') ||
                    name.includes('payment')
                ) {
                    el.remove();
                }
            }
        });
    }

    function restorePage() {

        removePayElements();
        unlockButtons();
        removePayOverlays();
    }

    /*
     * 页面加载后执行
     */
    if (document.readyState === 'loading') {

        document.addEventListener(
            'DOMContentLoaded',
            restorePage
        );

    } else {

        restorePage();

    }

    /*
     * 如果原模板通过 JS 动态加载会员层，
     * 只监听 DOM 变化并继续清除收费入口。
     */
    const observer = new MutationObserver(function() {
        restorePage();
    });

    observer.observe(document.documentElement, {
        childList: true,
        subtree: true
    });

})();
</script>
