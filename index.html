<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>竞彩足球预测分析</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f4f6f9;
    color:#172033;
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
}

.header{
    background:linear-gradient(135deg,#101827,#1d3557);
    color:#fff;
    padding:22px 16px 18px;
}

.header h1{
    margin:0;
    font-size:23px;
}

.header p{
    margin:7px 0 0;
    font-size:13px;
    opacity:.75;
}

.toolbar{
    background:#fff;
    padding:12px;
    border-bottom:1px solid #e5e7eb;
    position:sticky;
    top:0;
    z-index:20;
}

.toolbar-inner{
    display:flex;
    gap:8px;
}

input,button{
    height:42px;
    border-radius:9px;
    font-size:15px;
}

input{
    flex:1;
    border:1px solid #d9dee7;
    padding:0 12px;
    background:#fff;
}

button{
    border:0;
    padding:0 15px;
    background:#172033;
    color:#fff;
}

.container{
    max-width:900px;
    margin:15px auto;
    padding:0 12px 40px;
}

.status{
    background:#fff;
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:13px;
    color:#667085;
    font-size:13px;
}

.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:15px;
    box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.card-head{
    padding:15px;
    border-bottom:1px solid #edf0f4;
}

.comp{
    font-size:12px;
    color:#667085;
    margin-bottom:9px;
}

.teams{
    display:flex;
    align-items:center;
    gap:10px;
}

.team{
    flex:1;
    font-size:18px;
    font-weight:700;
}

.away{
    text-align:right;
}

.vs{
    color:#98a2b3;
    font-size:12px;
}

.time{
    margin-top:8px;
    color:#667085;
    font-size:12px;
}

.section{
    padding:14px 15px;
    border-bottom:1px solid #edf0f4;
}

.section:last-child{
    border-bottom:0;
}

.title{
    font-weight:700;
    font-size:14px;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.item{
    background:#f7f8fa;
    border-radius:9px;
    padding:10px;
}

.label{
    font-size:11px;
    color:#667085;
    margin-bottom:5px;
}

.value{
    font-size:14px;
    font-weight:600;
    word-break:break-word;
}

.analysis{
    font-size:14px;
    line-height:1.75;
}

.analysis p{
    margin:5px 0;
}

.final{
    background:#f8fafc;
}

.final-main{
    font-size:18px;
    font-weight:800;
    margin-bottom:10px;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.tag{
    background:#fff;
    border:1px solid #e1e5eb;
    border-radius:7px;
    padding:7px 9px;
    font-size:13px;
}

.good{
    color:#087443;
    font-weight:700;
}

.warn{
    color:#b54708;
    font-weight:700;
}

.empty,
.loading{
    text-align:center;
    padding:45px 15px;
    color:#98a2b3;
}

.error{
    color:#b42318;
    background:#fff5f5;
    padding:12px;
    border-radius:8px;
}

.raw{
    margin-top:10px;
    padding:10px;
    border-radius:8px;
    background:#111827;
    color:#d1d5db;
    font-size:11px;
    overflow:auto;
    white-space:pre-wrap;
}

@media(max-width:600px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .team{
        font-size:16px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>竞彩足球预测分析</h1>
    <p>真实数据 · 欧赔 · XG · 基本面</p>
</header>

<div class="toolbar">
    <div class="toolbar-inner">
        <input id="date" type="date">
        <button onclick="loadMatches()">刷新数据</button>
    </div>
</div>

<main class="container">

    <div id="status" class="status">
        正在读取数据……
    </div>

    <div id="matches">
        <div class="loading">
            正在加载……
        </div>
    </div>

</main>

<script>

const OWNER = "tan9527819";
const REPO = "qiuxiaoce-football-data";
const BRANCH = "main";

const API =
`https://api.github.com/repos/${OWNER}/${REPO}/contents`;

const dateInput =
document.getElementById("date");

const statusBox =
document.getElementById("status");

const matchesBox =
document.getElementById("matches");


/* =========================
   今天
========================= */

function today(){

    const d = new Date();

    return d.getFullYear()+"-"+
        String(d.getMonth()+1).padStart(2,"0")+"-"+
        String(d.getDate()).padStart(2,"0");
}

dateInput.value = today();


/* =========================
   HTML安全
========================= */

function esc(v){

    if(v===null || v===undefined)
        return "";

    return String(v)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}


/* =========================
   显示真实数据
========================= */

function show(v){

    if(v===null ||
       v===undefined ||
       v==="")
        return "暂无数据";

    if(Array.isArray(v))
        return v.join(" / ");

    if(typeof v==="object"){

        return Object.entries(v)
            .map(([k,x]) =>
                k+"："+show(x)
            )
            .join("；");
    }

    return String(v);
}


/* =========================
   GitHub JSON
========================= */

async function getJSON(url){

    const response =
        await fetch(url,{
            headers:{
                "Accept":
                "application/vnd.github+json"
            }
        });

    if(!response.ok)
        throw new Error(
            "GitHub "+response.status
        );

    return await response.json();
}


/* =========================
   正确读取日期目录

   关键：

   2026/10/05/*.json

   而不是：

   2026/10/*.json
========================= */

async function getDateFiles(date){

    const [year,month,day] =
        date.split("-");

    /* 先读取当天 */

    const todayURL =
        `${API}/${year}/${month}/${day}?ref=${BRANCH}`;

    try{

        const files =
            await getJSON(todayURL);

        return {
            files,
            date
        };

    }catch(e){

        /* 当天不存在 */

        console.log(
            "当天没有数据，寻找最近日期"
        );
    }


    /* =========================
       读取月份目录
    ========================= */

    const monthURL =
        `${API}/${year}/${month}?ref=${BRANCH}`;

    const monthFiles =
        await getJSON(monthURL);


    const days =
        monthFiles
        .filter(x =>
            x.type==="dir" &&
            /^\d{2}$/.test(x.name)
        )
        .map(x => x.name)
        .sort();


    /* 找到 <= 当前日期的最后一天 */

    const usable =
        days
        .filter(x => x <= day)
        .pop();


    if(!usable){

        return {
            files:[],
            date:null
        };
    }


    const fallbackDate =
        `${year}-${month}-${usable}`;


    const fallbackURL =
        `${API}/${year}/${month}/${usable}?ref=${BRANCH}`;


    const fallbackFiles =
        await getJSON(fallbackURL);


    return {
        files:fallbackFiles,
        date:fallbackDate
    };
}


/* =========================
   读取单场JSON
========================= */

async function getMatch(file){

    try{

        if(file.download_url){

            const response =
                await fetch(
                    file.download_url
                );

            if(response.ok)
                return await response.json();
        }

    }catch(e){

        console.log(
            "赛事读取失败",
            file.name
        );
    }

    return null;
}


/* =========================
   球队
========================= */

function getTeams(data){

    const info =
        data.info || {};

    let teams =
        info.teams || "";

    if(!teams)
        return {
            home:"主队",
            away:"客队"
        };

    const parts =
        teams.split(/\s+vs\s+/i);

    if(parts.length<2){

        const p =
            teams.split("vs");

        if(p.length>=2)
            return {
                home:p[0].trim(),
                away:p[1].trim()
            };
    }

    return {
        home:parts[0].trim(),
        away:parts[1].trim()
    };
}


/* =========================
   欧赔
========================= */

function getOdds(data){

    /*
      当前公开JSON如果没有欧赔，
      必须显示暂无数据。
    */

    const odds =
        data.odds ||
        data.euroOdds ||
        data.europeOdds ||
        data["欧赔"] ||
        null;

    if(!odds)
        return {
            initial:null,
            current:null
        };

    return {
        initial:
            odds.initial ||
            odds.opening ||
            odds.first ||
            odds["初赔"] ||
            null,

        current:
            odds.current ||
            odds.latest ||
            odds.instant ||
            odds["即时赔"] ||
            null
    };
}


/* =========================
   XG
========================= */

function getXG(data){

    const xg =
        data.xg ||
        data.XG ||
        data.expectedGoals ||
        null;

    const xga =
        data.xga ||
        data.XGA ||
        data.expectedGoalsAgainst ||
        null;

    return {
        xg,
        xga
    };
}


/* =========================
   分析
========================= */

function getAnalysis(data){

    const a =
        data.analysis || {};

    const win =
        a.win || {};

    const handicap =
        a.handicap || {};

    const exact =
        a.exact || {};

    const over =
        a.overUnder || {};

    const htft =
        a.htft || {};

    return {

        win:win.pick || null,
        winNote:win.note || null,

        handicap:
            handicap.pick || null,

        handicapNote:
            handicap.note || null,

        exact:
            exact.pick ||
            data.forecasts?.scoreline ||
            null,

        goals:
            over.pick ||
            data.forecasts?.goals ||
            null,

        htft:
            htft.pick ||
            data.forecasts?.halftime ||
            null
    };
}


/* =========================
   风险
========================= */

function getRisk(data){

    const r =
        data.riskAlert;

    if(!r)
        return null;

    return r.risk || null;
}


/* =========================
   单场HTML
========================= */

function render(data){

    const info =
        data.info || {};

    const teams =
        getTeams(data);

    const odds =
        getOdds(data);

    const xg =
        getXG(data);

    const a =
        getAnalysis(data);

    const risk =
        getRisk(data);

    const result =
        data.result?.actual_score ||
        null;


    let analysis = [];


    if(a.winNote){

        analysis.push(
            "欧赔/赛前分析："+a.winNote
        );

    }else{

        analysis.push(
            "欧赔：暂无足够真实赔率数据。"
        );
    }


    if(xg.xg!==null){

        analysis.push(
            "XG："+show(xg.xg)
        );

    }else{

        analysis.push(
            "XG：暂无数据。"
        );
    }


    if(a.win){

        analysis.push(
            "胜平负："+show(a.win)
        );
    }


    if(a.handicap){

        analysis.push(
            "让球："+show(a.handicap)
        );
    }


    if(risk){

        analysis.push(
            "风险提醒："+risk
        );
    }


    const final =
        a.win ||
        "暂不推荐";


    return `

    <article class="card">

        <div class="card-head">

            <div class="comp">
                ${esc(info.code || "")}
                ${info.comp ? " · "+esc(info.comp) : ""}
            </div>

            <div class="teams">

                <div class="team">
                    ${esc(teams.home)}
                </div>

                <div class="vs">
                    VS
                </div>

                <div class="team away">
                    ${esc(teams.away)}
                </div>

            </div>

            <div class="time">
                ${info.time
                    ? "开赛："+esc(info.time)
                    : "开赛时间：暂无数据"}
            </div>

        </div>


        <section class="section">

            <div class="title">
                欧赔
            </div>

            <div class="grid">

                <div class="item">
                    <div class="label">
                        初赔
                    </div>

                    <div class="value">
                        ${esc(show(odds.initial))}
                    </div>
                </div>

                <div class="item">
                    <div class="label">
                        即时赔
                    </div>

                    <div class="value">
                        ${esc(show(odds.current))}
                    </div>
                </div>

                <div class="item">
                    <div class="label">
                        赔率方向
                    </div>

                    <div class="value">
                        ${
                            odds.initial ||
                            odds.current
                            ? "有真实赔率数据"
                            : "暂无数据"
                        }
                    </div>
                </div>

            </div>

        </section>


        <section class="section">

            <div class="title">
                XG
            </div>

            <div class="grid">

                <div class="item">

                    <div class="label">
                        XG
                    </div>

                    <div class="value">
                        ${esc(show(xg.xg))}
                    </div>

                </div>

                <div class="item">

                    <div class="label">
                        XGA
                    </div>

                    <div class="value">
                        ${esc(show(xg.xga))}
                    </div>

                </div>

            </div>

        </section>


        <section class="section">

            <div class="title">
                简单分析
            </div>

            <div class="analysis">

                ${
                    analysis
                    .map(x =>
                        `<p>• ${esc(x)}</p>`
                    )
                    .join("")
                }

            </div>

        </section>


        <section class="section final">

            <div class="title">
                最终判断
            </div>

            <div class="final-main ${
                a.win
                ? "good"
                : "warn"
            }">

                ${esc(show(final))}

            </div>

            <div class="tags">

                <div class="tag">
                    胜平负：
                    ${esc(show(a.win))}
                </div>

                <div class="tag">
                    让球：
                    ${esc(show(a.handicap))}
                </div>

                <div class="tag">
                    比分：
                    ${esc(show(a.exact))}
                </div>

                <div class="tag">
                    进球：
                    ${esc(show(a.goals))}
                </div>

                <div class="tag">
                    半全场：
                    ${esc(show(a.htft))}
                </div>

            </div>

        </section>


        ${
            result
            ?
            `
            <section class="section">

                <div class="title">
                    赛后结果
                </div>

                <div class="final-main">
                    ${esc(result)}
                </div>

            </section>
            `
            :
            ""
        }


        <section class="section">

            <details>

                <summary>
                    查看原始数据
                </summary>

                <div class="raw">
                    ${esc(
                        JSON.stringify(
                            data,
                            null,
                            2
                        )
                    )}
                </div>

            </details>

        </section>

    </article>

    `;
}


/* =========================
   主程序
========================= */

async function loadMatches(){

    const requestedDate =
        dateInput.value ||
        today();


    matchesBox.innerHTML =
        `<div class="loading">
            正在读取真实赛事数据……
        </div>`;


    statusBox.innerHTML =
        "正在连接 GitHub 公共数据……";


    try{

        const result =
            await getDateFiles(
                requestedDate
            );


        if(!result.files.length){

            statusBox.innerHTML =
                `请求日期：${requestedDate} · 暂无公开数据`;

            matchesBox.innerHTML =
                `
                <div class="empty">
                    ${requestedDate}
                    <br><br>
                    暂无公开赛事数据
                </div>
                `;

            return;
        }


        const jsonFiles =
            result.files.filter(file =>
                file.type==="file" &&
                file.name
                    .toLowerCase()
                    .endsWith(".json")
            );


        const matches = [];


        /*
          手机端最多读取50场
        */

        for(
            const file of jsonFiles.slice(0,50)
        ){

            const data =
                await getMatch(file);

            if(data)
                matches.push(data);
        }


        if(!matches.length){

            throw new Error(
                "赛事文件存在，但JSON读取失败"
            );
        }


        matchesBox.innerHTML =
            matches
            .map(render)
            .join("");


        if(result.date !== requestedDate){

            statusBox.innerHTML =
                `请求日期：${requestedDate} · `+
                `当天暂无数据 · `+
                `已自动读取最近可用日期：${result.date} · `+
                `共 ${matches.length} 场`;

        }else{

            statusBox.innerHTML =
                `数据日期：${result.date} · `+
                `已读取 ${matches.length} 场 · `+
                `仅显示真实数据`;
        }


    }catch(error){

        console.error(error);

        statusBox.innerHTML =
            `<div class="error">
                数据读取失败：${esc(error.message)}
            </div>`;

        matchesBox.innerHTML =
            `
            <div class="empty">
                数据暂时无法读取。
                <br><br>
                不使用虚假数据替代。
            </div>
            `;
    }
}


/* =========================
   启动
========================= */

loadMatches();

</script>

</body>
</html>
