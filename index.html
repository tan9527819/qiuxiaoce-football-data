<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>竞彩足球预测分析</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#eee;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",
  "Microsoft YaHei",Arial,sans-serif
}
button{font:inherit;border:0;background:none}
.app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#f6f7f8;
  padding-bottom:80px
}
.browser{
  height:68px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #eee
}
.browser b{font-size:18px}
.circle{
  width:42px;height:42px;border:1px solid #ddd;
  border-radius:50%;display:flex;
  align-items:center;justify-content:center
}
.top{
  height:65px;background:#fff;
  display:grid;grid-template-columns:55px 1fr 80px;
  align-items:center;padding:0 15px;
  border-bottom:1px solid #eee
}
.logo{text-align:center;font-size:32px;color:#4ead63}
.menu{font-size:27px}
.right{text-align:right;font-size:23px}
.content{padding:15px}
.page{display:none}
.page.active{display:block}

.notice{
  background:#effaf2;
  border:1px solid #cdebd4;
  color:#347d48;
  padding:12px 14px;
  border-radius:12px;
  font-size:14px;
  line-height:1.6;
  margin-bottom:12px
}

.title{
  font-size:24px;
  font-weight:800;
  margin:18px 3px 14px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}
.stat{
  background:#fff;
  border-radius:13px;
  padding:15px 5px;
  text-align:center
}
.stat small{color:#858b94}
.stat strong{
  display:block;
  color:#45a463;
  font-size:22px;
  margin-top:6px
}

/* 比赛 */
.match{
  background:#fff;
  border:1px solid #e0e3e7;
  border-radius:17px;
  margin-bottom:12px;
  overflow:hidden;
  cursor:pointer
}
.match:active{transform:scale(.99)}
.match-head{
  display:flex;
  align-items:center;
  gap:6px;
  padding:11px 13px;
  border-bottom:1px solid #eee;
  font-size:12px
}
.league{
  background:#edf3ff;
  color:#3c70c8;
  padding:4px 7px;
  border-radius:5px
}
.time{
  margin-left:auto;
  font-size:15px;
  font-weight:bold
}
.level{
  background:#f5a31c;
  color:white;
  border-radius:5px;
  padding:4px 6px
}
.teams{
  display:grid;
  grid-template-columns:1fr 55px 1fr;
  align-items:center;
  text-align:center;
  padding:19px 10px 10px
}
.team{
  font-weight:700;
  font-size:15px
}
.team-icon{font-size:34px;margin-bottom:4px}
.vs{
  color:#b9bdc4;
  font-weight:800;
  font-size:20px
}
.actions{
  display:flex;
  justify-content:center;
  gap:7px;
  padding:5px 10px 15px
}
.tag{
  background:#f3f4f6;
  color:#747b84;
  border-radius:18px;
  padding:7px 9px;
  font-size:12px
}

/* 详情 */
.back{
  background:#fff;
  border-radius:13px;
  padding:13px 15px;
  margin-bottom:10px;
  cursor:pointer
}
.hero{
  background:#fff;
  border-radius:16px;
  text-align:center;
  overflow:hidden;
  margin-bottom:11px
}
.hero-league{
  padding-top:15px;
  color:#777e88;
  font-size:13px
}
.hero-teams{
  display:grid;
  grid-template-columns:1fr 60px 1fr;
  align-items:center;
  padding:18px 10px
}
.hero-team{
  font-size:17px;
  font-weight:800
}
.hero-icon{font-size:42px;margin-bottom:5px}
.hero-vs{
  color:#babec5;
  font-size:22px;
  font-weight:800
}
.hero-time{
  color:#777e88;
  font-size:13px;
  padding-bottom:17px
}
.section{
  background:#fff;
  border-radius:15px;
  margin-bottom:11px;
  overflow:hidden
}
.section-title{
  padding:14px 15px;
  border-bottom:1px solid #eee;
  font-size:17px;
  font-weight:800
}
.section-title span{
  float:right;
  color:#9298a0;
  font-size:12px;
  font-weight:normal
}
.section-body{padding:14px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}
.item{
  background:#f6f7f8;
  border-radius:10px;
  padding:11px
}
.item small{
  display:block;
  color:#858c95;
  font-size:12px
}
.item b{
  display:block;
  margin-top:6px;
  font-size:16px
}
.pick{
  border-left:4px solid #4bae66;
  background:#f1faf3;
  border-radius:10px;
  padding:13px;
  margin-bottom:9px;
  line-height:1.6
}
.pick b{color:#379453}
.warning{
  border-left-color:#e39b22;
  background:#fff8e9
}
.score{
  display:inline-block;
  background:#f3f4f6;
  padding:8px 13px;
  border-radius:8px;
  margin:3px;
  font-weight:800
}
.prob{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}
.prob-item{
  background:#f5f7f8;
  text-align:center;
  border-radius:10px;
  padding:12px 5px
}
.prob-item small{color:#818891}
.prob-item b{
  display:block;
  font-size:22px;
  color:#43a362;
  margin-top:5px
}
.analysis{
  line-height:1.8;
  font-size:14px
}
.risk{
  background:#fff6e8;
  border:1px solid #f1d59d;
  color:#96651b;
  padding:13px;
  border-radius:10px;
  line-height:1.7
}
.empty{
  background:#fff;
  border-radius:15px;
  text-align:center;
  padding:45px 15px;
  color:#999
}

/* 功能 */
.grid-menu{
  background:#fff;
  border-radius:16px;
  padding:20px 8px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:22px 3px
}
.menu-item{text-align:center;cursor:pointer}
.menu-icon{
  width:52px;height:52px;
  margin:auto;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  background:#eef7ff
}
.menu-item:nth-child(2n) .menu-icon{background:#fff7e8}
.menu-item:nth-child(3n) .menu-icon{background:#effaf2}
.menu-name{
  font-size:12px;
  margin-top:6px;
  white-space:nowrap
}

/* 底部 */
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:76px;
  background:#fff;
  border-top:1px solid #ddd;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:20
}
.nav{
  text-align:center;
  color:#999;
  padding-top:8px;
  font-size:12px;
  cursor:pointer
}
.nav-icon{
  display:block;
  font-size:27px;
  margin-bottom:2px
}
.nav.active{color:#46a963}

.loading{
  text-align:center;
  padding:35px 10px;
  color:#888
}

@media(max-width:390px){
  .grid-menu{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<div class="app">

  <div class="browser">
    <div class="circle">×</div>
    <b>qiuxiaoce.com</b>
    <div class="circle">☰</div>
  </div>

  <div class="top">
    <div class="menu">☰</div>
    <div class="logo">⚽</div>
    <div class="right">⌕　♙</div>

  <main class="content">

    <!-- 首页 -->
    <section id="home" class="page active">

      <div class="notice">
        ✓ 全部分析功能免费开放，不设置会员、VIP、充值、点数或付费解锁。

        <div class="menu-item" onclick="showPage('detail')">
          <div class="menu-icon">🔮</div>

        <div class="menu-item">

        </div>

        <div class="menu-item">
          <div class="menu-icon">📈</div>

        <div class="menu-item">
          <div class="menu-icon">📒</div>
          <div class="menu-name">历史数据</div>
        </div>

        <div class="menu-item">
          <div class="menu-icon">🎯</div>
          <div class="menu-name">命中统计</div>
        </div>

        <div class="menu-item">
          <div class="menu-icon">📅</div>
          <div class="menu-name">每日报告</div>
        </div>

        <div class="menu-item">
          <div class="menu-icon">🏆</div>

        </div>

        <div class="menu-item">
          <div class="menu-icon">🔔</div>

        <div class="menu-item">
          <div class="menu-icon">ℹ️</div>

      </div>

  </main>

  <nav class="bottom">

    <button class="nav active" onclick="nav('home',this)">
      <span class="nav-icon">🏠</span>
      赛事

    <button class="nav" onclick="nav('home',this)">

    <button class="nav" onclick="nav('home',this)">

<script>

/*
 * ============================================================
 * 球小策免费版
 *
 * 直接读取 GitHub Pages 同仓库中的：
 *
 * 2026/10/04/*.json
 *
 * 不使用会员、VIP、充值、点数。
 * ============================================================
 */

const DATA_ROOT = "2026/10/04/";
let matches = [];

/* 页面切换 */
function showPage(id){

  document.querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

  const page = document.getElementById(id);

  if(page){
    page.classList.add("active");
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function nav(id,button){

  showPage(id);

  document.querySelectorAll(".nav")
    .forEach(n => n.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }
}

/* GitHub API读取目录 */
async function loadMatches(){

  const list = document.getElementById("matchList");

  try{

    /*
     * GitHub Pages环境下，
     * 使用GitHub API读取同一个公开仓库的目录。
     */

    const api =
      "https://api.github.com/repos/" +
      "tan9527819/qiuxiaoce-football-data/" +
      "contents/" + DATA_ROOT;

    const response = await fetch(api);

    if(!response.ok){
      throw new Error("无法读取赛事目录");
    }

    const files = await response.json();

    const jsonFiles = files.filter(
      file =>
        file.type === "file" &&
        file.name.toLowerCase().endsWith(".json")
    );

    if(!jsonFiles.length){

      list.innerHTML = `
        <div class="empty">
          暂时没有找到今日赛事数据。
        </div>
      `;

      return;
    }

    const loaded = await Promise.all(

      jsonFiles.map(async file => {

        try{

          const r = await fetch(file.download_url);

          if(!r.ok) return null;

          const data = await r.json();

          return {
            file:file.name,
            data:data
          };

        }catch(e){

          return null;

        }

      })

    );

    matches = loaded.filter(Boolean);

    renderMatches();

  }catch(error){

    console.error(error);

    list.innerHTML = `
      <div class="empty">

        <div style="font-size:32px">⚠️</div>

        <br>

        暂时无法读取赛事数据。

        <br><br>

        请确认 GitHub Pages 已经成功部署，
        并且仓库中的
        <b>2026/10/04</b>
        目录存在。

      </div>
    `;

  }

}

/* 获取球队名称 */
function getTeams(data){

  const info = data.info || {};
  const analysis = data.analysis || {};

  let home =
    analysis.home ||
    info.home ||
    "";

  let away =
    analysis.away ||
    info.away ||
    "";

  if(!home || !away){

    const teams = info.teams || "";

    if(teams.includes(" vs ")){

      const arr = teams.split(" vs ");

      home = home || arr[0];
      away = away || arr[1];

    }

  }

  return {
    home:home || "主队",
    away:away || "客队"
  };

}

/* 渲染赛事 */
function renderMatches(){

  const list = document.getElementById("matchList");

  if(!matches.length){

    list.innerHTML =
      `<div class="empty">暂无赛事</div>`;

    return;

  }

  list.innerHTML = matches.map((item,index)=>{

    const data = item.data || {};
    const info = data.info || {};
    const teams = getTeams(data);

    return `

      <div class="match"
           onclick="openMatch(${index})">

        <div class="match-head">

          <span>${escapeHtml(info.code || "赛事")}</span>

          <span class="league">
            ${escapeHtml(info.comp || "赛事")}
          </span>

          <span class="time">
            ${escapeHtml(
              (info.time || data.analysis?.kickoff || "--")
              .toString()
              .slice(-5)
            )}
          </span>

          <span class="level">
            ${escapeHtml(data.level || "中")}
          </span>

        </div>

        <div class="teams">

          <div class="team">

            <div class="team-icon">🛡️</div>

            ${escapeHtml(teams.home)}

          </div>

          <div class="vs">
            VS
          </div>

          <div class="team">

            <div class="team-icon">🔵</div>

            ${escapeHtml(teams.away)}

          </div>

        </div>

        <div class="actions">

          <span class="tag">🧭 方向</span>
          <span class="tag">⚽ 进球</span>
          <span class="tag">🔢 比分</span>
          <span class="tag">📈 半全</span>

        </div>

      </div>

    `;

  }).join("");

}

/* 打开真实比赛分析 */
function openMatch(index){

  const item = matches[index];

  if(!item) return;

  const data = item.data || {};

  renderDetail(data);

  showPage("detail");

}

/* 深度分析页面 */
function renderDetail(data){

  const info = data.info || {};
  const analysis = data.analysis || {};
  const forecasts = data.forecasts || {};
  const risk = data.riskAlert || {};
  const charts = data.charts || {};

  const teams = getTeams(data);

  const win = analysis.win || {};
  const handicap = analysis.handicap || {};
  const exact = analysis.exact || {};
  const overUnder = analysis.overUnder || {};
  const htft = analysis.htft || {};

  const directions = Array.isArray(data.directions)
    ? data.directions
    : [];

  const scorelines = Array.isArray(forecasts.scoreline)
    ? forecasts.scoreline
    : [];

  const goals = Array.isArray(forecasts.goals)
    ? forecasts.goals
    : [];

  const halftime = Array.isArray(forecasts.halftime)
    ? forecasts.halftime
    : [];

  document.getElementById("detailContent").innerHTML = `

    <div class="hero">

      <div class="hero-league">

        ${escapeHtml(info.code || analysis.code || "")}
       　
        ${escapeHtml(info.comp || analysis.comp || "")}

      </div>

      <div class="hero-teams">

        <div class="hero-team">

          <div class="hero-icon">🛡️</div>

          ${escapeHtml(teams.home)}

        </div>

        <div class="hero-vs">VS</div>

        <div class="hero-team">

          <div class="hero-icon">🔵</div>

          ${escapeHtml(teams.away)}

        </div>

      </div>

      <div class="hero-time">

        ${escapeHtml(info.time || analysis.kickoff || "")}

      </div>

    </div>


    <!-- 综合方向 -->

    <div class="section">

      <div class="section-title">
        综合预测
        <span>
          信心：${escapeHtml(data.level || analysis.confidence || "未定")}
        </span>
      </div>

      <div class="section-body">

        ${
          data.mainPick
          ?
          `<div class="pick">
            <b>主要方向</b><br>
            ${escapeHtml(data.mainPick)}
          </div>`
          :
          ""
        }

        ${
          directions.map(x =>
            `<div class="pick">
              ${escapeHtml(x)}
            </div>`
          ).join("")
        }

      </div>

    </div>


    <!-- 胜负 -->

    <div class="section">

      <div class="section-title">
        胜平负分析
      </div>

      <div class="section-body">

        <div class="grid">

          <div class="item">

            <small>预测</small>

            <b>
              ${escapeHtml(win.pick || "--")}
            </b>

          </div>

          <div class="item">

            <small>分析结论</small>

            <b>
              ${escapeHtml(
                win.note || "暂无分析"
              )}
            </b>

          </div>

        </div>

      </div>

    </div>


    <!-- 让球 -->

    <div class="section">

      <div class="section-title">
        让球分析
      </div>

      <div class="section-body">

        <div class="grid">

          <div class="item">

            <small>让球</small>

            <b>
              ${escapeHtml(
                handicap.spread || "--"
              )}
            </b>

          </div>

          <div class="item">

            <small>判断</small>

            <b>
              ${escapeHtml(
                handicap.pick || "--"
              )}
            </b>

          </div>

        </div>

        <br>

        <div class="analysis">

          ${escapeHtml(
            handicap.note || "暂无让球分析"
          )}

        </div>

      </div>

    </div>


    <!-- 比分 -->

    <div class="section">

      <div class="section-title">
        比分预测
      </div>

      <div class="section-body">

        ${
          scorelines.length
          ?
          scorelines.map(
            x =>
              `<span class="score">
                ${escapeHtml(x)}
              </span>`
          ).join("")
          :
          "<div>暂无比分预测</div>"
        }

        <br><br>

        <div class="analysis">

          ${escapeHtml(
            exact.note || "暂无比分分析"
          )}

        </div>

      </div>

    </div>


    <!-- 进球 -->

    <div class="section">

      <div class="section-title">
        总进球分析
      </div>

      <div class="section-body">

        <div class="grid">

          <div class="item">

            <small>预测进球数</small>

            <b>

              ${
                goals.length
                ?
                goals.map(escapeHtml).join(" / ")
                :
                "--"
              }

            </b>

          </div>

          <div class="item">

            <small>判断</small>

            <b>
              ${escapeHtml(
                overUnder.pick
                ?
                overUnder.pick.join
                  ?
                  overUnder.pick.join(" / ")
                  :
                  overUnder.pick
                :
                "--"
              )}
            </b>

          </div>

        </div>

        <br>

        <div class="analysis">

          ${escapeHtml(
            overUnder.note || "暂无进球分析"
          )}

        </div>

      </div>

    </div>


    <!-- 半全场 -->

    <div class="section">

      <div class="section-title">
        半全场
      </div>

      <div class="section-body">

        ${
          halftime.length
          ?
          halftime.map(
            x =>
              `<span class="score">
                ${escapeHtml(x)}
              </span>`
          ).join("")
          :
          "--"
        }

        <br><br>

        <div class="analysis">

          ${escapeHtml(
            htft.note || "暂无半全场分析"
          )}

        </div>

      </div>

    </div>


    <!-- 风险 -->

    <div class="section">

      <div class="section-title">
        风险提示
      </div>

      <div class="section-body">

        ${
          risk.triggered
          ?
          `
          <div class="risk">

            ⚠️ <b>风险提醒</b>

            <br><br>

            ${escapeHtml(
              risk.risk || "存在风险因素"
            )}

            ${
              risk.outcome
              ?
              `<br><br>
               参考风险结果：
               <b>${escapeHtml(risk.outcome)}</b>`
              :
              ""
            }

          </div>
          `
          :
          `
          <div class="pick">
            当前数据未触发明显风险警报。
          </div>
          `
        }

      </div>

    </div>


    <!-- 模型数据 -->

    <div class="section">

      <div class="section-title">
        模型数据
        <span>原始数据</span>
      </div>

      <div class="section-body">

        ${
          charts.radar
          ?
          `
          <div class="grid">

            <div class="item">

              <small>模型</small>

              <b>
                ${escapeHtml(
                  charts.radar.name || "战力模型"
                )}
              </b>

            </div>

            <div class="item">

              <small>维度</small>

              <b>
                ${
                  Array.isArray(charts.radar.axis)
                  ?
                  charts.radar.axis.length
                  :
                  0
                }
                项
              </b>

            </div>

          </div>
          `
          :
          "<div>暂无模型图表数据</div>"
        }

      </div>

    </div>


    <!-- 原始分析 -->

    <div class="section">

      <div class="section-title">
        深度文字分析
      </div>

      <div class="section-body">

        <div class="analysis">

          ${
            escapeHtml(
              win.note ||
              analysis.highlight ||
              "暂无详细文字分析"
            )
          }

        </div>

      </div>

    </div>

  `;

}

/* HTML安全处理 */
function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* 启动 */
loadMatches();

</script>
