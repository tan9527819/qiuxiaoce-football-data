<script>

/* =====================================================
   基础
===================================================== */

const TODAY_FILES = [

 "2026/10/04/北单088_阿甲_国防与司法vs圣洛伦索_2026-10-04-01-45.json",

 "2026/10/04/北单094_阿甲_图库曼竞技vs巴拉卡斯中央_2026-10-04-04-00.json",

 "2026/10/04/北单096_巴甲_米内罗竞技vs布拉干蒂诺RB_2026-10-04-05-30.json",

 "2026/10/04/北单101_日职乙_宫崎棒牛鸟vsRB大宫松鼠_2026-10-04-18-00.json",

 "2026/10/04/北单102_葡甲_SC法伦斯vs沙维什_2026-10-04-18-00.json"

];


const HISTORY_KEY =
 "qiuxiaoce_history_v6";


let matches=[];
let historyRows=[];


/* =====================================================
   工具
===================================================== */

function firstValue(){

 for(
  let i=0;
  i<arguments.length;
  i++
 ){

  const v=arguments[i];

  if(
   v!==undefined &&
   v!==null &&
   String(v).trim()!==""
  ){
   return v;
  }

 }

 return "";
}


function num(v){

 if(
  v===undefined ||
  v===null ||
  v===""
 ){
  return null;
 }

 if(
  typeof v==="number"
 ){
  return isFinite(v)?v:null;
 }

 const s=
  String(v)
  .replace(/[^\d.-]/g,"");

 const n=
  parseFloat(s);

 return isFinite(n)?n:null;
}


function pct(v){

 if(
  v===null ||
  v===undefined ||
  !isFinite(v)
 ){
  return "-";
 }

 return (
  (v*100).toFixed(1)
 )+"%";
}


function esc(v){

 return String(
  v===undefined ||
  v===null
   ? ""
   : v
 )
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* =====================================================
   赔率识别
===================================================== */

function normalizeOdds(o){

 if(
  !o ||
  typeof o!=="object"
 ){
  return {
   home:null,
   draw:null,
   away:null
  };
 }


 function get(){

  for(
   let i=0;
   i<arguments.length;
   i++
  ){

   const n=
    num(arguments[i]);

   if(
    n!==null &&
    n>1
   ){
    return n;
   }

  }

  return null;
 }


 return {

  home:get(

   o.home,
   o.homeWin,
   o.win,
   o.homeOdds,
   o.home_odds,

   o["3"],
   o["主胜"],
   o["胜"],
   o["主"],
   o["胜赔"],
   o["主胜赔率"],

   o.Home,
   o.home

  ),

  draw:get(

   o.draw,
   o.drawWin,
   o.x,
   o.drawOdds,
   o.draw_odds,

   o["1"],
   o["平"],
   o["平局"],
   o["平赔"],
   o["平局赔率"],

   o.Draw,
   o.draw

  ),

  away:get(

   o.away,
   o.awayWin,
   o.lose,
   o.awayOdds,
   o.away_odds,

   o["0"],
   o["负"],
   o["客胜"],
   o["客"],
   o["负赔"],
   o["客胜赔率"],

   o.Away,
   o.away

  )

 };

}


/*
 递归寻找赔率。
 防止 JSON 结构变化导致赔率读取失败。
*/

function deepFindOdds(
 root,
 depth=0
){

 if(
  !root ||
  typeof root!=="object" ||
  depth>6
 ){
  return null;
 }


 const direct=
  normalizeOdds(root);


 if(
  direct.home &&
  direct.draw &&
  direct.away
 ){
  return direct;
 }


 const priority=[

  "odds",
  "oddsData",
  "williamOdds",
  "william",

  "europeOdds",
  "europe",
  "euroOdds",

  "spOdds",
  "竞彩",
  "欧赔",

  "即时",
  "即时赔率",

  "current",
  "currentOdds",

  "latest",
  "latestOdds",

  "forecastOdds"

 ];


 for(
  const key of priority
 ){

  if(
   root[key] &&
   typeof root[key]==="object"
  ){

   const result=
    deepFindOdds(
     root[key],
     depth+1
    );

   if(
    result &&
    result.home &&
    result.draw &&
    result.away
   ){
    return result;
   }

  }

 }


 for(
  const key of Object.keys(root)
 ){

  const value=
   root[key];

  if(
   value &&
   typeof value==="object"
  ){

   const result=
    deepFindOdds(
     value,
     depth+1
    );

   if(
    result &&
    result.home &&
    result.draw &&
    result.away
   ){
    return result;
   }

  }

 }


 return null;

}


/* =====================================================
   赛事标准化
===================================================== */

function normalize(raw){

 const info=
  raw.info ||
  raw.match ||
  raw.event ||
  {};


 const analysis=
  raw.analysis ||
  {};


 const forecast=
  raw.forecasts ||
  raw.forecast ||
  {};


 const home=
  firstValue(

   info.home,
   info.homeTeam,
   info.home_team,
   info.homeName,

   raw.home,
   raw.homeTeam,
   raw.home_team,
   raw.homeName,
   raw.home_team_name,

   analysis.home,
   analysis.homeTeam

  );


 const away=
  firstValue(

   info.away,
   info.awayTeam,
   info.away_team,
   info.awayName,

   raw.away,
   raw.awayTeam,
   raw.away_team,
   raw.awayName,
   raw.away_team_name,

   analysis.away,
   analysis.awayTeam

  );


 const league=
  firstValue(

   info.league,
   info.leagueName,
   info.league_name,

   info.competition,
   info.competitionName,

   info.tournament,

   raw.league,
   raw.leagueName,
   raw.league_name,

   raw.competition,
   raw.competitionName,

   analysis.league

  );


 const matchNo=
  firstValue(

   info.matchNo,
   info.match_no,
   info.code,
   info.issue,
   info.number,

   raw.matchNo,
   raw.match_no,
   raw.code,
   raw.issue

  );


 const time=
  firstValue(

   info.time,
   info.startTime,
   info.start_time,
   info.dateTime,

   raw.time,
   raw.startTime,
   raw.start_time,
   raw.dateTime

  );


 const odds=
  deepFindOdds(raw) ||

  normalizeOdds(

   raw.odds ||
   raw.oddsData ||
   raw.williamOdds ||

   analysis.odds ||
   forecast.odds ||

   {}

  );


 const opening=
  normalizeOdds(

   raw.opening ||
   raw.openingOdds ||
   raw.openOdds ||

   analysis.opening ||
   analysis.openingOdds ||

   {}

  );


 return {

  id:firstValue(
   info.id,
   raw.id,
   matchNo,
   home+"_"+away
  ),

  matchNo:matchNo,

  league:
   league ||
   "未知联赛",

  home:
   home ||
   "主队",

  away:
   away ||
   "客队",

  time:time,

  odds:odds,

  opening:opening,

  raw:raw,

  analysis:analysis,

  forecast:forecast

 };

}


/* =====================================================
   市场概率
===================================================== */

function marketProbability(m){

 const h=
  m.odds.home;

 const d=
  m.odds.draw;

 const a=
  m.odds.away;


 /*
  非常重要：

  没有完整赔率时，
  不再返回33.3%。
 */

 if(
  !h ||
  !d ||
  !a
 ){

  return {

   home:null,
   draw:null,
   away:null,

   valid:false,

   reason:
    "缺少完整主胜/平/客胜赔率"

  };

 }


 const x=1/h;
 const y=1/d;
 const z=1/a;

 const s=x+y+z;


 if(
  !isFinite(s) ||
  s<=0
 ){

  return {

   home:null,
   draw:null,
   away:null,

   valid:false,

   reason:
    "赔率数据无效"

  };

 }


 return {

  home:x/s,
  draw:y/s,
  away:z/s,

  valid:true,

  reason:""

 };

}


/* =====================================================
   历史相似赔率
===================================================== */

function findSimilar(m){

 if(
  !historyRows.length
 ){
  return [];
 }


 const h=
  m.odds.home;

 const d=
  m.odds.draw;

 const a=
  m.odds.away;


 if(
  !h ||
  !d ||
  !a
 ){
  return [];
 }


 return historyRows
 .filter(function(row){

  const rh=
   num(firstValue(

    row["主胜"],
    row["主胜赔率"],
    row["胜"],
    row["home"],
    row["Home"]

   ));


  const rd=
   num(firstValue(

    row["平"],
    row["平局"],
    row["平局赔率"],
    row["draw"],
    row["Draw"]

   ));


  const ra=
   num(firstValue(

    row["负"],
    row["客胜"],
    row["客胜赔率"],
    row["away"],
    row["Away"]

   ));


  if(
   !rh ||
   !rd ||
   !ra
  ){
   return false;
  }


  return(

   Math.abs(rh-h)<=.15 &&

   Math.abs(rd-d)<=.15 &&

   Math.abs(ra-a)<=.15

  );

 })
 .slice(0,300);

}


/* =====================================================
   历史赛果
===================================================== */

function historyResult(row){

 const r=
  firstValue(

   row["赛果"],
   row["结果"],
   row["竞彩结果"],
   row["胜平负"],

   row["result"],
   row["Result"]

  );


 const s=
  String(r)
  .trim();


 if(
  s==="3" ||
  s==="胜" ||
  s==="主胜"
 ){
  return "主胜";
 }


 if(
  s==="1" ||
  s==="平"
 ){
  return "平";
 }


 if(
  s==="0" ||
  s==="负" ||
  s==="客胜"
 ){
  return "客胜";
 }


 return "";

}


/* =====================================================
   历史分析
===================================================== */

function historyAnalysis(m){

 const rows=
  findSimilar(m);


 if(
  !rows.length
 ){

  return {

   count:0,

   home:0,
   draw:0,
   away:0

  };

 }


 let h=0;
 let d=0;
 let a=0;


 rows.forEach(function(row){

  const r=
   historyResult(row);


  if(r==="主胜")
   h++;

  if(r==="平")
   d++;

  if(r==="客胜")
   a++;

 });


 const total=
  h+d+a;


 if(!total){

  return {

   count:0,

   home:0,
   draw:0,
   away:0

  };

 }


 return {

  count:total,

  home:h/total,

  draw:d/total,

  away:a/total

 };

}


/* =====================================================
   核心分析引擎
===================================================== */

function analyzeMatch(m){

 const market=
  marketProbability(m);


 /*
  核心规则：

  没有真实赔率
  = 不计算概率
  = 不推荐
 */

 if(
  !market.valid
 ){

  return {

   home:null,
   draw:null,
   away:null,

   first:null,
   second:null,

   pick:"数据不足",

   risk:null,

   cold:"",

   history:{
    count:0,
    home:0,
    draw:0,
    away:0
   },

   drawSignal:false,

   valid:false,

   reason:
    market.reason

  };

 }


 let h=
  market.home;

 let d=
  market.draw;

 let a=
  market.away;


 const hist=
  historyAnalysis(m);


 /*
  历史样本>=8才参与修正。
 */

 if(
  hist.count>=8
 ){

  h=
   h*.72+
   hist.home*.28;

  d=
   d*.72+
   hist.draw*.28;

  a=
   a*.72+
   hist.away*.28;


  const total=
   h+d+a;


  h/=total;
  d/=total;
  a/=total;

 }


 const arr=[

  {
   name:"主胜",
   value:h
  },

  {
   name:"平",
   value:d
  },

  {
   name:"客胜",
   value:a
  }

 ]
 .sort(function(x,y){

  return y.value-x.value;

 });


 const first=
  arr[0];

 const second=
  arr[1];


 let risk=0;


 const gap=
  first.value-
  second.value;


 if(
  gap<.04
 ){
  risk+=35;

 }else if(
  gap<.08
 ){
  risk+=25;

 }else if(
  gap<.12
 ){
  risk+=15;

 }


 if(
  first.value<.40
 ){
  risk+=30;

 }else if(
  first.value<.45
 ){
  risk+=20;

 }else if(
  first.value<.50
 ){
  risk+=10;

 }


 /*
  平局触发条件
 */

 let drawSignal=false;


 if(

  d>=.32 &&

  Math.abs(h-a)<=.10 &&

  d>=second.value-.015

 ){

  drawSignal=true;

 }


 let cold="";


 if(
  first.value<.40
 ){

  cold=
   "超级冷门观察";

  risk+=15;

 }else if(
  first.value<.44
 ){

  cold=
   "冷门观察";

  risk+=8;

 }


 risk=
  Math.min(
   100,
   risk
  );


 let pick="";


 if(
  drawSignal
 ){

  pick="平";

 }else if(
  first.value>=.45
 ){

  pick=
   first.name;

 }else{

  pick=
   "暂不推荐";

 }


 return {

  home:h,
  draw:d,
  away:a,

  first:first,
  second:second,

  pick:pick,

  risk:risk,

  cold:cold,

  history:hist,

  drawSignal:drawSignal,

  valid:true,

  reason:""

 };

}

/* =====================================================
   CSV解析
===================================================== */

function parseCSV(text){

 text=
  String(text)
  .replace(/^\uFEFF/,"");


 const rows=[];

 let row=[];

 let cell="";

 let quoted=false;


 for(
  let i=0;
  i<text.length;
  i++
 ){

  const ch=
   text[i];

  const next=
   text[i+1];


  if(
   ch==='"'
  ){

   if(
    quoted &&
    next==='"'
   ){

    cell+='"';
    i++;

   }else{

    quoted=!quoted;

   }

   continue;

  }


  if(
   ch==="," &&
   !quoted
  ){

   row.push(cell);
   cell="";
   continue;

  }


  if(
   (ch==="\n" || ch==="\r") &&
   !quoted
  ){

   if(
    ch==="\r" &&
    next==="\n"
   ){
    i++;
   }


   row.push(cell);
   cell="";


   if(
    row.some(function(v){
     return String(v).trim()!=="";
    })
   ){

    rows.push(row);

   }


   row=[];

   continue;

  }


  cell+=ch;

 }


 if(
  cell!=="" ||
  row.length
 ){

  row.push(cell);

  if(
   row.some(function(v){
    return String(v).trim()!=="";
   })
  ){

   rows.push(row);

  }

 }


 if(
  rows.length<2
 ){
  return [];
 }


 const headers=
  rows[0].map(function(x){

   return String(x)
   .trim();

  });


 return rows
 .slice(1)
 .map(function(r){

  const obj={};

  headers.forEach(function(h,i){

   obj[h]=
    r[i]===undefined
     ? ""
     : r[i];

  });

  return obj;

 });

}


/* =====================================================
   导入CSV
===================================================== */

function importCSV(){

 const file=
  document.getElementById(
   "csvFile"
  ).files[0];


 const box=
  document.getElementById(
   "historyStatus"
  );


 if(!file){

  box.innerHTML=

   `<div class="notice">
    请先选择CSV文件。
   </div>`;

  return;

 }


 const reader=
  new FileReader();


 reader.onload=
  function(e){

   try{

    const rows=
     parseCSV(
      e.target.result
     );


    if(
     !rows.length
    ){

     throw new Error(
      "CSV没有读取到有效数据"
     );

    }


    historyRows=
     rows;


    localStorage.setItem(
     HISTORY_KEY,
     JSON.stringify(rows)
    );


    box.innerHTML=

     `<div class="success">

      已导入

      <b>
       ${rows.length}
      </b>

      条历史记录。

      <br>

      后续历史同赔分析会自动调用。

     </div>`;


    renderHistoryStats();

    renderMatches();

    renderData();

    renderForecast();


   }catch(error){

    box.innerHTML=

     `<div class="danger">

      CSV读取失败：

      ${esc(error.message)}

     </div>`;

   }

  };


 reader.onerror=
  function(){

   box.innerHTML=

    `<div class="danger">
     文件读取失败。
    </div>`;

  };


 reader.readAsText(
  file,
  "UTF-8"
 );

}
