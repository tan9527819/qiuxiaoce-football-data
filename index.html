<script>

/* =====================================================
   配置
===================================================== */

const OLD_FILES=[
 "2026/10/04/北单088_阿甲_国防与司法vs圣洛伦索_2026-10-04-01-45.json",
 "2026/10/04/北单094_阿甲_图库曼竞技vs巴拉卡斯中央_2026-10-04-04-00.json",
 "2026/10/04/北单096_巴甲_米内罗竞技vs布拉干蒂诺RB_2026-10-04-05-30.json",
 "2026/10/04/北单101_日职乙_宫崎棒牛鸟vsRB大宫松鼠_2026-10-04-18-00.json",
 "2026/10/04/北单102_葡甲_SC法伦斯vs沙维什_2026-10-04-18-00.json"
];

const QX_TODAY=[
 "data/qiuxiaoce/today.json",
 "data/qiuxiaoce/digest.json",
 "data/today.json",
 "today-index.json"
];

const HISTORY_KEY="qiuxiaoce_history_v9";

let matches=[];
let historyRows=[];


/* =====================================================
   基础
===================================================== */

function first(){
 for(let i=0;i<arguments.length;i++){
  const v=arguments[i];
  if(v!==undefined&&v!==null&&String(v).trim()!==""){
   return v;
  }
 }
 return "";
}

function num(v){
 if(v===undefined||v===null||v==="")return null;
 if(typeof v==="number"){
  return isFinite(v)?v:null;
 }
 const n=parseFloat(
  String(v).replace(/[^\d.-]/g,"")
 );
 return isFinite(n)?n:null;
}

function esc(v){
 return String(v===undefined||v===null?"":v)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function pct(v){
 if(v===null||v===undefined||!isFinite(v))return "-";
 return (v*100).toFixed(1)+"%";
}

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}


/* =====================================================
   递归找字段
===================================================== */

function deepGet(obj,names,depth=0){

 if(!obj||typeof obj!=="object"||depth>8){
  return null;
 }

 for(const n of names){
  if(Object.prototype.hasOwnProperty.call(obj,n)){
   const v=obj[n];
   if(v!==undefined&&v!==null&&v!==""){
    return v;
   }
  }
 }

 for(const k of Object.keys(obj)){
  const v=obj[k];

  if(v&&typeof v==="object"){
   const r=deepGet(v,names,depth+1);

   if(r!==null&&r!==undefined&&r!==""){
    return r;
   }
  }
 }

 return null;
}


/* =====================================================
   赔率
===================================================== */

function normalizeOdds(o){

 if(!o||typeof o!=="object"){
  return {
   home:null,
   draw:null,
   away:null
  };
 }

 function g(){
  for(let i=0;i<arguments.length;i++){
   const n=num(arguments[i]);
   if(n!==null&&n>1)return n;
  }
  return null;
 }

 return {
  home:g(
   o.home,
   o.homeWin,
   o.homeOdds,
   o.home_odds,
   o.win,
   o["3"],
   o["主胜"],
   o["胜"],
   o["主"],
   o["主胜赔率"]
  ),

  draw:g(
   o.draw,
   o.drawOdds,
   o.draw_odds,
   o.x,
   o["1"],
   o["平"],
   o["平局"],
   o["平赔"]
  ),

  away:g(
   o.away,
   o.awayWin,
   o.awayOdds,
   o.away_odds,
   o.lose,
   o["0"],
   o["负"],
   o["客胜"],
   o["负赔"]
  )
 };
}


function findOdds(root,depth=0){

 if(!root||typeof root!=="object"||depth>8){
  return null;
 }

 const direct=normalizeOdds(root);

 if(
  direct.home&&
  direct.draw&&
  direct.away
 ){
  return direct;
 }

 const keys=[
  "odds",
  "oddsData",
  "william",
  "williamOdds",
  "europeOdds",
  "europe",
  "欧赔",
  "竞彩",
  "即时",
  "即时赔率",
  "currentOdds",
  "latestOdds",
  "marketOdds"
 ];

 for(const k of keys){

  if(root[k]&&typeof root[k]==="object"){

   const r=findOdds(
    root[k],
    depth+1
   );

   if(r)return r;
  }
 }

 for(const k of Object.keys(root)){

  const v=root[k];

  if(v&&typeof v==="object"){

   const r=findOdds(
    v,
    depth+1
   );

   if(r)return r;
  }
 }

 return null;
}


/* =====================================================
   标准赛事
===================================================== */

function normalize(raw){

 const info=
  raw.info||
  raw.match||
  raw.event||
  {};

 const home=first(
  info.home,
  info.homeTeam,
  info.home_team,
  info.homeName,
  raw.home,
  raw.homeTeam,
  raw.home_team,
  raw.homeName,
  raw.home_team_name
 );

 const away=first(
  info.away,
  info.awayTeam,
  info.away_team,
  info.awayName,
  raw.away,
  raw.awayTeam,
  raw.away_team,
  raw.awayName,
  raw.away_team_name
 );

 const league=first(
  info.league,
  info.leagueName,
  info.league_name,
  info.competition,
  info.competitionName,
  raw.league,
  raw.leagueName,
  raw.league_name,
  raw.competition
 );

 const id=first(
  info.fixture_id,
  info.fixtureId,
  info.id,
  raw.fixture_id,
  raw.fixtureId,
  raw.id,
  info.matchNo,
  raw.matchNo,
  home+"_"+away
 );

 const matchNo=first(
  info.lottery_id,
  info.lotteryId,
  info.matchNo,
  info.match_no,
  raw.lottery_id,
  raw.lotteryId,
  raw.matchNo,
  raw.match_no
 );

 const time=first(
  info.kickoff,
  info.time,
  info.startTime,
  info.start_time,
  raw.kickoff,
  raw.time,
  raw.startTime,
  raw.start_time
 );

 const odds=findOdds(raw);

 return {
  id:id,
  fixtureId:first(
   raw.fixture_id,
   info.fixture_id,
   id
  ),
  matchNo:matchNo,
  league:league||"未知联赛",
  home:home||"主队",
  away:away||"客队",
  time:time||"",
  odds:odds||{
   home:null,
   draw:null,
   away:null
  },
  raw:raw,
  source:"legacy"
 };
}


/* =====================================================
   球小策原版数据
===================================================== */

function getQiuOriginal(m){

 const r=m.raw||{};

 let data=
  r.original_report||
  r.qiuxiaoce||
  r.original||
  r.report||
  r.data||
  r;

 const ai=
  data.ai_prediction||
  r.ai_prediction||
  deepGet(
   r,
   ["ai_prediction"]
  );

 return {

  available:!!(
   ai||
   r.match_pack||
   r.matchPack||
   r.fixture
  ),

  source:first(
   r.source,
   data.source,
   "qiuxiaoce_official"
  ),

  level:first(
   ai&&ai.recommendationLevel,
   ai&&ai.recommendation_level,
   deepGet(r,[
    "recommendationLevel",
    "recommendation_level"
   ])
  ),

  core:first(
   ai&&ai.coreRecommendation,
   ai&&ai.core_recommendation,
   deepGet(r,[
    "coreRecommendation",
    "core_recommendation"
   ])
  ),

  spf:first(
   ai&&ai.predictions&&ai.predictions.spf,
   ai&&ai.predictions&&ai.predictions.SPF,
   deepGet(r,[
    "spf",
    "result",
    "胜平负"
   ])
  ),

  goals:first(
   ai&&ai.predictions&&ai.predictions.totalGoals,
   ai&&ai.predictions&&ai.predictions.total_goals,
   deepGet(r,[
    "totalGoals",
    "total_goals",
    "总进球"
   ])
  ),

  scores:(
   ai&&
   ai.predictions&&
   Array.isArray(ai.predictions.scores)
  )
   ?ai.predictions.scores
   :[],

  ai:ai||null,

  raw:r
 };
}


/* =====================================================
   独立模型
   注意：
   不覆盖球小策原版
===================================================== */

function independentModel(m){

 const o=m.odds;

 if(
  !o||
  !o.home||
  !o.draw||
  !o.away
 ){
  return {
   valid:false,
   pick:"暂不推荐",
   reason:"没有完整真实赔率",
   reasons:[
    "缺少主胜/平/客胜完整赔率"
   ]
  };
 }

 /*
  欧赔倒数
  不直接把1/赔率当最终概率，
  先归一化。
 */

 let a=1/o.home;
 let d=1/o.draw;
 let h=1/o.away;

 const sum=a+d+h;

 a/=sum;
 d/=sum;
 h/=sum;

 /*
  主场轻微修正。
  这里只作为独立模型。
  球小策原版完全不参与修改。
 */

 const strengthHome=num(
  deepGet(m.raw,[
   "home_strength",
   "homeStrength",
   "主队实力"
  ])
 );

 const strengthAway=num(
  deepGet(m.raw,[
   "away_strength",
   "awayStrength",
   "客队实力"
  ])
 );

 if(
  strengthHome!==null&&
  strengthAway!==null
 ){

  const diff=
   clamp(
    (strengthHome-strengthAway)/100,
    -0.08,
    0.08
   );

  a+=diff;
  h-=diff;

 }

 a=clamp(a,0.03,0.94);
 d=clamp(d,0.03,0.70);
 h=clamp(h,0.03,0.94);

 const s=a+d+h;

 a/=s;
 d/=s;
 h/=s;

 const values=[
  {key:"胜",v:a},
  {key:"平",v:d},
  {key:"负",v:h}
 ];

 values.sort(
  (x,y)=>y.v-x.v
 );

 const top=values[0];
 const second=values[1];

 const confidence=
  clamp(
   50+
   (top.v-second.v)*180,
   45,
   95
  );

 /*
  平局指数：
  不是单纯把平局概率放大。
 */

 const drawIndex=
  clamp(
   d*100+
   (Math.abs(a-h)<0.10?18:0)+
   (d>=0.29?12:0),
   0,
   100
  );

 /*
  冷门：
  最高赔率方向如果反而有一定概率，
  则作为独立模型的风险提醒。
 */

 const maxProb=Math.max(a,d,h);

 let coldIndex=0;

 if(
  o.home&&
  o.draw&&
  o.away
 ){

  const impliedFav=
   Math.min(
    o.home,
    o.draw,
    o.away
   );

  let marketFav="";

  if(impliedFav===o.home)
   marketFav="胜";

  if(impliedFav===o.draw)
   marketFav="平";

  if(impliedFav===o.away)
   marketFav="负";

  const modelTop=top.key;

  if(modelTop!==marketFav){

   coldIndex=
    clamp(
     55+
     (top.v-
      Math.min(a,d,h))*80,
     0,
     95
    );

  }else{

   coldIndex=
    clamp(
     20+
     (1-maxProb)*80,
     0,
     70
    );

  }

 }

 /*
  让平只是风险指标，
  不能假装成真正的让球胜平负。
 */

 const handicapDrawIndex=
  clamp(
   drawIndex+
   (
    Math.abs(a-h)<0.12
     ?15
     :0
   ),
   0,
   100
  );

 const risk=
  clamp(
   100-confidence+
   coldIndex*.25,
   5,
   95
  );

 let pick=top.key;

 if(
  drawIndex>=72&&
  d>=a*.88&&
  d>=h*.88
 ){
  pick="平";
 }

 if(
  coldIndex>=80&&
  top.key!=="平"
 ){
  pick=top.key+"（冷）";
 }

 return {

  valid:true,

  home:a,
  draw:d,
  away:h,

  pick:pick,

  confidence:confidence,

  drawIndex:drawIndex,

  handicapDrawIndex:
   handicapDrawIndex,

  coldIndex:coldIndex,

  risk:risk,

  odds:o,

  history:findSimilar(m),

  reasons:[]

 };
}


/* =====================================================
   历史CSV字段识别
===================================================== */

function historyResult(row){

 const value=first(
  row["赛果"],
  row["结果"],
  row["胜平负"],
  row["SPF"],
  row["result"],
  row["Result"]
 );

 const s=String(value).trim();

 if(
  s==="3"||
  s==="胜"||
  s==="主胜"
 )return "主胜";

 if(
  s==="1"||
  s==="平"
 )return "平";

 if(
  s==="0"||
  s==="负"||
  s==="客胜"
 )return "客胜";

 return "";
}


function historyOdds(row){

 return {

  home:num(first(
   row["主胜"],
   row["主胜赔率"],
   row["胜"],
   row["胜赔"],
   row["home"],
   row["home_odds"],
   row["Home"]
  )),

  draw:num(first(
   row["平"],
   row["平赔"],
   row["draw"],
   row["draw_odds"],
   row["Draw"]
  )),

  away:num(first(
   row["负"],
   row["负赔"],
   row["客胜"],
   row["客胜赔率"],
   row["away"],
   row["away_odds"],
   row["Away"]
  ))

 };
}


/* =====================================================
   历史同赔
===================================================== */

function findSimilar(m){

 if(!historyRows.length){
  return {
   count:0,
   home:0,
   draw:0,
   away:0
  };
 }

 const o=m.odds;

 if(
  !o||
  !o.home||
  !o.draw||
  !o.away
 ){
  return {
   count:0,
   home:0,
   draw:0,
   away:0
  };
 }

 const list=[];

 for(const row of historyRows){

  const x=historyOdds(row);

  if(
   !x.home||
   !x.draw||
   !x.away
  ){
   continue;
  }

  const distance=
   Math.abs(x.home-o.home)+
   Math.abs(x.draw-o.draw)+
   Math.abs(x.away-o.away);

  /*
   相似盘型阈值。
   越接近越可靠。
  */

  if(distance<=0.45){

   const r=historyResult(row);

   if(r){
    list.push(r);
   }

  }

 }

 let h=0,d=0,a=0;

 list.forEach(function(r){

  if(r==="主胜")h++;
  if(r==="平")d++;
  if(r==="客胜")a++;

 });

 return {
  count:list.length,
  home:h,
  draw:d,
  away:a
 };
}


/* =====================================================
   变盘
===================================================== */

function getOpening(m){

 const r=m.raw||{};

 const o=
  r.opening||
  r.openingOdds||
  r.openOdds||
  r.opening_odds||
  null;

 if(o){
  const x=normalizeOdds(o);

  if(x.home&&x.draw&&x.away)
   return x;
 }

 return null;
}


function movement(m){

 const open=getOpening(m);
 const now=m.odds;

 if(
  !open||
  !now||
  !now.home||
  !now.draw||
  !now.away
 ){
  return null;
 }

 return {

  home:{
   open:open.home,
   current:now.home,
   delta:now.home-open.home
  },

  draw:{
   open:open.draw,
   current:now.draw,
   delta:now.draw-open.draw
  },

  away:{
   open:open.away,
   current:now.away,
   delta:now.away-open.away
  }

 };
}

function compareText(m,a){

 const q=getQiuOriginal(m);

 if(!q.available){

  return `
   <div class="notice">
    当前赛事没有读取到球小策原版结构化判断。
    <br>
    <b>原版：暂无</b>
    <br>
    <b>独立：${esc(a.pick)}</b>
   </div>
  `;
 }

 let original=
  first(
   q.spf,
   q.core,
   "暂无"
  );

 let independent=
  a.valid
   ?a.pick
   :"暂不推荐";

 const same=
  normalizeDirection(original)===
  normalizeDirection(independent);

 return `
  <div class="${same?"success":"notice"}">

   <div>
    球小策原版：
    <b>${esc(original)}</b>
   </div>

   <div style="margin-top:5px">
    独立模型：
    <b>${esc(independent)}</b>
   </div>

   <div style="margin-top:5px">

    ${
     same
      ?"方向一致"
      :"存在分歧，保留两个判断"
    }

   </div>

  </div>
 `;
}


function normalizeDirection(v){

 const s=String(v||"");

 if(
  s.includes("胜")||
  s==="主"
 )return "胜";

 if(
  s.includes("平")
 )return "平";

 if(
  s.includes("负")||
  s==="客"
 )return "负";

 return s;
}

/* =====================================================
   今日文件
===================================================== */

async function getTodayFiles(){

 for(const path of QX_TODAY){

  try{

   const r=await fetch(
    path+"?t="+Date.now()
   );

   if(!r.ok)continue;

   const data=await r.json();

   /*
    QiuXiaoCe today.json
   */

   if(
    data&&
    Array.isArray(data.matches)
   ){

    return data.matches;
   }

   if(
    data&&
    data.data&&
    Array.isArray(data.data.matches)
   ){

    return data.data.matches;
   }

   /*
    如果是文件路径索引
   */

   if(
    data&&
    Array.isArray(data.files)
   ){

    return data.files;
   }

  }catch(e){}
 }

 return OLD_FILES;
}

async function loadToday(){

  );

  document.getElementById(
   "dataStatus"
  );

 list.innerHTML=`
  <div class="empty">
   正在读取赛事数据...
  </div>
 `;

 status.innerHTML="";

 const files=await getTodayFiles();

 const result=[];

 /*
  QiuXiaoCe today.json
  可能直接返回完整赛事对象。
 */

 if(
  Array.isArray(files)&&
  files.length&&
  typeof files[0]==="object"
 ){

  files.forEach(function(item){

   const raw=item;

   const m=normalize(raw);

   /*
    识别为球小策原始层
   */

   m.source="qiuxiaoce";

   m.raw=raw;

   result.push(m);

  });

 }else{

  /*
   兼容旧JSON文件
  */

  for(const file of files){

   try{

    const r=await fetch(
     file+"?t="+Date.now()
    );

    if(!r.ok)continue;

    const raw=await r.json();

    const m=normalize(raw);

    m.sourceFile=file;

    result.push(m);

    console.log(
     "读取失败",

 matches=result;

 }

/* =====================================================
   CSV解析
===================================================== */

function parseCSV(text){

 text=String(text)
  .replace(/^\uFEFF/,"");

 let delimiter=",";

 const firstLine=
  text.split(/\r?\n/)[0]||"";

 if(
  firstLine.split(";").length>
  firstLine.split(",").length
 ){
  delimiter=";";
 }

 const rows=[];
 let row=[];
 let cell="";
 let quote=false;

 for(
  let i=0;
  i<text.length;
  i++
 ){

  const ch=text[i];
  const next=text[i+1];

  if(ch==='"'){

   if(quote&&next==='"'){

    cell+='"';
    i++;

   }else{

    quote=!quote;

   }

   continue;
  }

  if(
   ch===delimiter&&
   !quote
  ){

   row.push(cell);
   cell="";
   continue;
  }

  if(
   (ch==="\n"||ch==="\r")&&
   !quote
  ){

   if(
    ch==="\r"&&
    next==="\n"
   ){
    i++;
   }

   row.push(cell);
   cell="";

   if(
    row.some(
     x=>String(x).trim()!==""
    )
   ){
    rows.push(row);
   }

   row=[];
   continue;
  }

  cell+=ch;
 }

 if(
  cell!==""||
  row.length
 ){

  row.push(cell);

  if(
   row.some(
    x=>String(x).trim()!==""
   )
  ){
   rows.push(row);
  }
 }

 if(rows.length<2){
  return [];
 }

 const headers=
  rows[0].map(function(x){

   return String(x)
    .trim()
    .replace(/^\uFEFF/,"");

  });

 return rows.slice(1)
 .map(function(r){

  const obj={};

  headers.forEach(
   function(h,i){

    obj[h]=
     r[i]===undefined
      ?""
      :r[i];

   }
  );

  return obj;

 });
}


/* =====================================================
   CSV导入
===================================================== */

function importCSV(){

 const file=
  document.getElementById(
   "csvFile"
  ).files[0];

 const box=
  document.getElementById(
   "historyStatus"
  );

 if(!file){

  box.innerHTML=`
   <div class="notice">
    请先选择CSV。
   </div>
  `;

  return;
 }

 const reader=
  new FileReader();

 reader.onload=function(e){

  try{

   const rows=
    parseCSV(
     e.target.result
    );

   if(!rows.length){
    throw new Error(
     "CSV没有有效记录"
    );
   }

   historyRows=rows;

   try{

    localStorage.setItem(
     HISTORY_KEY,
     JSON.stringify(rows)
    );

   }catch(e){

    console.log(
     "CSV过大，使用当前会话"
    );

   }

   box.innerHTML=`
    <div class="success">

     已读取
     <b>${rows.length}</b>
     条历史数据。

     <br>

     已用于历史同赔匹配。

    </div>
   `;

   renderHistoryStats();
   renderMatches();
   renderData();
   renderForecast();

  }catch(err){

   box.innerHTML=`
    <div class="danger">
     ${esc(err.message)}
    </div>
   `;

  }
 };

 reader.readAsText(
  file,
  "UTF-8"
 );
}

  );

 if(!historyRows.length){

   "暂无历史数据";

  return;

  function(row){

   const r=

   if(r==="主胜")h++;
   if(r==="平")d++;
   if(r==="客胜")a++;

  }
 );

   <div class="stat">
    <b>${historyRows.length}</b>
    <span>CSV记录</span>
   </div>

   <div class="stat">
    <b>${total}</b>
    <span>有效赛果</span>
   </div>

   <div class="stat">
    <b>
     ${total?(h/total*100).toFixed(1)+"%":"-"}
    </b>
    <span>主胜</span>
   </div>

   <div class="stat">
    <b>
     ${total?(d/total*100).toFixed(1)+"%":"-"}
    </b>
    <span>平</span>
   </div>

  </div>

  <div class="reason"
   style="margin-top:9px">

   <b>
    ${total?(a/total*100).toFixed(1)+"%":"-"}
   </b>

   <br>

   当前CSV只参与独立历史匹配，
   不修改球小策原版结果。

  </div>
 `;
}
