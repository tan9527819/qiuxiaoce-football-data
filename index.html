<script>


/* =====================================================
   今日赛事文件
===================================================== */

const TODAY_FILES = [

 "2026/10/04/北单088_阿甲_国防与司法vs圣洛伦索_2026-10-04-01-45.json",

 "2026/10/04/北单094_阿甲_图库曼竞技vs巴拉卡斯中央_2026-10-04-04-00.json",

 "2026/10/04/北单096_巴甲_米内罗竞技vs布拉干蒂诺RB_2026-10-04-05-30.json",

 "2026/10/04/北单101_日职乙_宫崎棒牛鸟vsRB大宫松鼠_2026-10-04-18-00.json",

 "2026/10/04/北单102_葡甲_SC法伦斯vs沙维什_2026-10-04-18-00.json"

];


let matches=[];

let historyRows=[];


/* =====================================================
   页面切换
===================================================== */

function showPage(id,btn){

 document.querySelectorAll(".page")
 .forEach(function(x){
  x.classList.remove("active");
 });

 document.getElementById(id)
 .classList.add("active");


 document.querySelectorAll("nav button")
 .forEach(function(x){
  x.classList.remove("active");
 });

 btn.classList.add("active");


 if(id==="data"){
  renderData();
 }

 if(id==="forecast"){
  renderForecast();
 }

}


/* =====================================================
   工具：数字
===================================================== */

function num(v){

 if(
  v===undefined ||
  v===null ||
  v===""
 ){
  return null;
 }

 const n=parseFloat(
  String(v).replace(/[^\d.]/g,"")
 );

 return isFinite(n)?n:null;
}


/* =====================================================
   工具：第一个有效值
===================================================== */

function firstValue(){

 for(
  let i=0;
  i<arguments.length;
  i++
 ){

  const v=arguments[i];

  if(
   v!==undefined &&
   v!==null &&
   String(v).trim()!==""
  ){
   return v;
  }

 }

 return "";
}


/* =====================================================
   标准化赛事
===================================================== */

function normalize(raw){

 const info=
  raw.info ||
  raw.match ||
  raw.event ||
  {};


 const analysis=
  raw.analysis ||
  {};


 const forecast=
  raw.forecasts ||
  raw.forecast ||
  {};


 const home=firstValue(

  info.home,

  info.homeTeam,

  info.home_team,

  info.homeName,

  raw.home,

  raw.homeTeam,

  raw.home_team,

  raw.homeName,

  raw.home_team_name,

  analysis.home,

  analysis.homeTeam

 );


 const away=firstValue(

  info.away,

  info.awayTeam,

  info.away_team,

  info.awayName,

  raw.away,

  raw.awayTeam,

  raw.away_team,

  raw.awayName,

  raw.away_team_name,

  analysis.away,

  analysis.awayTeam

 );


 const league=firstValue(

  info.league,

  info.leagueName,

  info.league_name,

  info.competition,

  info.competitionName,

  info.tournament,

  raw.league,

  raw.leagueName,

  raw.league_name,

  raw.competition,

  raw.competitionName,

  analysis.league

 );


 const matchNo=firstValue(

  info.matchNo,

  info.match_no,

  info.code,

  info.issue,

  info.number,

  raw.matchNo,

  raw.match_no,

  raw.code,

  raw.issue

 );


 const time=firstValue(

  info.time,

  info.startTime,

  info.start_time,

  info.dateTime,

  raw.time,

  raw.startTime,

  raw.start_time,

  raw.dateTime

 );


 return {

  id:firstValue(
   info.id,
   raw.id,
   matchNo,
   home+"_"+away
  ),

  matchNo:matchNo,

  league:league || "未知联赛",

  home:home || "主队",

  away:away || "客队",

  time:time,

  odds:normalizeOdds(

   raw.odds ||

   raw.oddsData ||

   raw.williamOdds ||

   analysis.odds ||

   forecast.odds ||

   {}

  ),

  opening:normalizeOdds(

   raw.opening ||

   raw.openingOdds ||

   raw.openOdds ||

   analysis.opening ||

   {}

  ),

  raw:raw,

  analysis:analysis,

  forecast:forecast

 };

}


/* =====================================================
   赔率
===================================================== */

function normalizeOdds(o){

 if(
  !o ||
  typeof o!=="object"
 ){

  return {
   home:null,
   draw:null,
   away:null
  };

 }


 return {

  home:num(firstValue(

   o.home,

   o.homeWin,

   o.win,

   o["3"],

   o["主胜"],

   o["胜"]

  )),

  draw:num(firstValue(

   o.draw,

   o.drawWin,

   o.x,

   o["1"],

   o["平"],

   o["平局"]

  )),

  away:num(firstValue(

   o.away,

   o.awayWin,

   o.lose,

   o["0"],

   o["负"],

   o["客胜"]

  ))

 };

}


/* =====================================================
   市场概率
===================================================== */

function marketProbability(m){

 const h=m.odds.home;

 const d=m.odds.draw;

 const a=m.odds.away;


 if(!h || !d || !a){

  return {

   home:.3333,

   draw:.3334,

   away:.3333,

   valid:false

  };

 }


 const x=1/h;

 const y=1/d;

 const z=1/a;

 const s=x+y+z;


 return {

  home:x/s,

  draw:y/s,

  away:z/s,

  valid:true

 };

}


/* =====================================================
   历史相似赔率
===================================================== */

function findSimilar(m){

 if(!historyRows.length)
  return [];


 const h=m.odds.home;

 const d=m.odds.draw;

 const a=m.odds.away;


 if(!h || !d || !a)
  return [];


 return historyRows.filter(function(row){

  const rh=num(firstValue(

   row["主胜"],

   row["主胜赔率"],

   row["胜"],

   row["home"],

   row["Home"]

  ));


  const rd=num(firstValue(

   row["平"],

   row["平局"],

   row["平局赔率"],

   row["draw"],

   row["Draw"]

  ));


  const ra=num(firstValue(

   row["负"],

   row["客胜"],

   row["客胜赔率"],

   row["away"],

   row["Away"]

  ));


  if(
   !rh ||
   !rd ||
   !ra
  ){
   return false;
  }


  return(

   Math.abs(rh-h)<=.15 &&

   Math.abs(rd-d)<=.15 &&

   Math.abs(ra-a)<=.15

  );

 }).slice(0,200);

}


/* =====================================================
   历史赛果
===================================================== */

function historyResult(row){

 const r=firstValue(

  row["赛果"],

  row["结果"],

  row["竞彩结果"],

  row["胜平负"],

  row["result"],

  row["Result"]

 );


 const s=String(r).trim();


 if(
  s==="3" ||
  s==="胜" ||
  s==="主胜"
 ){
  return "主胜";
 }


 if(
  s==="1" ||
  s==="平"
 ){
  return "平";
 }


 if(
  s==="0" ||
  s==="负" ||
  s==="客胜"
 ){
  return "客胜";
 }


 return "";

}


/* =====================================================
   历史分析
===================================================== */

function historyAnalysis(m){

 const rows=findSimilar(m);


 if(!rows.length){

  return {

   count:0,

   home:0,

   draw:0,

   away:0

  };

 }


 let h=0;

 let d=0;

 let a=0;


 rows.forEach(function(row){

  const r=historyResult(row);

  if(r==="主胜")h++;

  if(r==="平")d++;

  if(r==="客胜")a++;

 });


 const total=h+d+a;


 if(!total){

  return {

   count:rows.length,

   home:0,

   draw:0,

   away:0

  };

 }


 return {

  count:total,

  home:h/total,

  draw:d/total,

  away:a/total

 };

}


/* =====================================================
   核心分析
===================================================== */

function analyzeMatch(m){

 const market=marketProbability(m);


 let h=market.home;

 let d=market.draw;

 let a=market.away;


 const hist=
  historyAnalysis(m);


 /*
  * 历史样本至少8场才参与修正
  */

 if(hist.count>=8){

  h=h*.72+hist.home*.28;

  d=d*.72+hist.draw*.28;

  a=a*.72+hist.away*.28;


  const total=h+d+a;

  h/=total;

  d/=total;

  a/=total;

 }


 const arr=[

  {
   name:"主胜",
   value:h
  },

  {
   name:"平",
   value:d
  },

  {
   name:"客胜",
   value:a
  }

 ];


 arr.sort(function(x,y){
  return y.value-x.value;
 });


 const first=arr[0];

 const second=arr[1];


 let risk=0;


 const gap=
  first.value-
  second.value;


 if(gap<.04)
  risk+=35;

 else if(gap<.08)
  risk+=25;

 else if(gap<.12)
  risk+=15;


 if(first.value<.40)
  risk+=30;

 else if(first.value<.45)
  risk+=20;

 else if(first.value<.50)
  risk+=10;


 /*
  * 平局必须同时满足：
  * 1. 概率>=32%
  * 2. 主客差距<=10%
  * 3. 平局不能明显落后
  */

 let drawSignal=false;


 if(

  d>=.32 &&

  Math.abs(h-a)<=.10 &&

  d>=second.value-.015

 ){

  drawSignal=true;

 }


 let cold="";


 if(first.value<.40){

  cold="超级冷门观察";

  risk+=15;

 }

 else if(first.value<.44){

  cold="冷门观察";

  risk+=8;

 }


 risk=Math.min(
  100,
  risk
 );


 let pick="";


 if(drawSignal){

  pick="平";

 }

 else if(first.value>=.45){

  pick=first.name;

 }

 else{

  pick="暂不推荐";

 }


 return {

  home:h,

  draw:d,

  away:a,

  first:first,

  second:second,

  pick:pick,

  risk:risk,

  cold:cold,

  history:hist,

  drawSignal:drawSignal

 };

}


/* =====================================================
   赛事卡片
===================================================== */

function renderMatchCard(m){

 const a=analyzeMatch(m);


 return `

 <div class="card">

  <div class="league">

   ${esc(m.matchNo || "")}

   ${m.matchNo ? " · " : ""}

   ${esc(m.league)}

  </div>


  <div class="match-title">

   ${esc(m.home)}

   <span class="vs">
    VS
   </span>

   ${esc(m.away)}

  </div>


  <div class="time">

   ${esc(
    m.time ||
    "开赛时间待更新"
   )}

  </div>


  <div class="prob">

   <div
    class="p-home"
    style="width:${a.home*100}%">
   </div>

   <div
    class="p-draw"
    style="width:${a.draw*100}%">
   </div>

   <div
    class="p-away"
    style="width:${a.away*100}%">
   </div>

  </div>


  <div class="labels">

   <span>
    主 ${pct(a.home)}
   </span>

   <span>
    平 ${pct(a.draw)}
   </span>

   <span>
    客 ${pct(a.away)}
   </span>

  </div>


  <div class="grid">

   <div class="stat">

    <b>
     ${m.odds.home || "-"}
    </b>

    <span>
     主胜赔率
    </span>

   </div>


   <div class="stat">

    <b>
     ${m.odds.draw || "-"}
    </b>

    <span>
     平局赔率
    </span>

   </div>


   <div class="stat">

    <b>
     ${m.odds.away || "-"}
    </b>

    <span>
     客胜赔率
    </span>

   </div>

  </div>


  <div class="badges">

   <span class="badge main">

    单选：

    ${a.pick}

   </span>


   <span class="badge">

    风险 ${a.risk}

   </span>


   ${
    a.drawSignal

    ?

    `<span class="badge draw">
      防平信号
     </span>`

    :

    ""
   }


   ${
    a.cold

    ?

    `<span class="badge cold">
      ${a.cold}
     </span>`

    :

    ""
   }

  </div>


  <div class="analysis">

   <div class="analysis-title">
    🧠 深度分析
   </div>


   <div class="reason">

    市场/模型概率：

    主 ${pct(a.home)}

    ·

    平 ${pct(a.draw)}

    ·

    客 ${pct(a.away)}

    <br>

    第一概率：

    <b>
     ${a.first.name}
    </b>

    <br>

    ${
     a.pick==="暂不推荐"

     ?

     "三项概率优势不足，暂不强行推荐。"

     :

     a.pick==="平"

     ?

     "平局同时满足模型触发条件，进入防平/平局观察。"

     :

     "当前最高概率方向具有一定优势，暂列单选方向。"
    }

    <br>

    历史同赔样本：

    <b>
     ${a.history.count}
    </b>

    场

   </div>

  </div>

 </div>

 `;

}


/* =====================================================
   渲染赛事
===================================================== */

function renderMatches(){

 const list=
  document.getElementById(
   "matchList"
  );


 const q=
  String(
   document.getElementById(
    "search"
   ).value || ""
  ).toLowerCase();


 const league=
  document.getElementById(
   "league"
  ).value;


 const arr=
  matches.filter(function(m){

   const text=
    (
     m.home+
     " "+
     m.away+
     " "+
     m.league
    ).toLowerCase();


   return(

    (!q ||
     text.includes(q)) &&

    (!league ||
     m.league===league)

   );

  });


 if(!arr.length){

  list.innerHTML=
   `<div class="empty">
     暂无符合条件的赛事
    </div>`;

  return;

 }


 list.innerHTML=
  arr.map(
   renderMatchCard
  ).join("");

}

/* =====================================================
   读取今日赛事
===================================================== */

async function loadToday(){

 const list=
  document.getElementById(
   "matchList"
  );


 list.innerHTML=
  `<div class="empty">
    正在读取今日赛事...
   </div>`;


 const result=[];


 for(
  const file of TODAY_FILES
 ){

  try{

   const response=
    await fetch(
     file+
     "?t="+
     Date.now()
    );


   if(!response.ok)
    continue;


   const raw=
    await response.json();


   result.push(
    normalize(raw)
   );


  }catch(error){

   console.log(
    "读取赛事失败",
    file,
    error
   );

  }

 }


 matches=result;


 renderLeagues();

 renderMatches();

 renderData();

 renderForecast();

}

/* =====================================================
   CSV解析
===================================================== */

function parseCSV(text){

 const lines=
  String(text)
  .replace(/\r/g,"")
  .split("\n")
  .filter(function(x){

   return x.trim();

  });


 if(!lines.length)
  return [];


 const headers=
  parseCSVLine(
   lines[0]
  );


 return lines
  .slice(1)
  .map(function(line){

   const cells=
    parseCSVLine(line);


   const obj={};


   headers.forEach(
    function(h,i){

     obj[h]=
      (
       cells[i] ||
       ""
      ).trim();

    }
   );


   return obj;

  });

}


/* =====================================================
   CSV单行解析
===================================================== */

function parseCSVLine(line){

 const arr=[];

 let current="";

 let quote=false;


 for(
  let i=0;
  i<line.length;
  i++
 ){

  const c=line[i];


  if(c==='"'){

   if(
    quote &&
    line[i+1]==='"'
   ){

    current+='"';

    i++;

   }else{

    quote=!quote;

   }

  }

  else if(
   c==="," &&
   !quote
  ){

   arr.push(current);

   current="";

  }

  else{

   current+=c;

  }

 }


 arr.push(current);

 return arr;

}

/* =====================================================
   工具
===================================================== */

function esc(value){

 return String(
  value ?? ""
 )
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");

}


function pct(value){

 return Math.round(
  value*100
 )+"%";

}
