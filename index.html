<script>

/* =========================================================
   数据源
   ========================================================= */

const TODAY_FILES = [
 "2026/10/04/北单088_阿甲_国防与司法vs圣洛伦索_2026-10-04-01-45.json",
 "2026/10/04/北单094_阿甲_图库曼竞技vs巴拉卡斯中央_2026-10-04-04-00.json",
 "2026/10/04/北单096_巴甲_米内罗竞技vs布拉干蒂诺RB_2026-10-04-05-30.json",
 "2026/10/04/北单101_日职乙_宫崎棒牛鸟vsRB大宫松鼠_2026-10-04-18-00.json",
 "2026/10/04/北单102_葡甲_SC法伦斯vs沙维什_2026-10-04-18-00.json"
];

const HISTORY_KEY = "qiuxiaoce_history_csv_v3";

let matches = [];
let historyRows = [];


/* =========================================================
   页面
   ========================================================= */

function showPage(id){

 document.querySelectorAll(".page").forEach(page=>{
  page.classList.remove("active");
 });

 const target=document.getElementById(id);

 if(target){
  target.classList.add("active");
 }

 document.querySelectorAll("nav button").forEach(button=>{
  button.classList.toggle(
   "active",
   button.dataset.page===id
  );
 });

 if(id==="data"){
  renderData();
 }

 if(id==="forecast"){
  renderForecast();
 }

 if(id==="history"){
  updateHistoryInfo();
 }
}


document.querySelectorAll("nav button").forEach(button=>{

 button.addEventListener("click",()=>{

  showPage(button.dataset.page);

 });

});


/* =========================================================
   加载今日赛事
   ========================================================= */

async function loadToday(){

 const list=document.getElementById("matchList");

 list.innerHTML=
  '<div class="loading">正在读取今日赛事数据...</div>';

 const result=[];

 for(const file of TODAY_FILES){

  try{

   const response=await fetch(
    file+"?t="+Date.now(),
    {
     cache:"no-store"
    }
   );

   if(!response.ok){
    continue;
   }

   const raw=await response.json();

   const match=normalize(raw);

   if(match){
    result.push(match);
   }

  }catch(error){

   console.warn(
    "读取赛事失败:",
    file,
    error
   );

  }

 }

 matches=result;

 renderLeague();
 renderMatches();
 renderData();
 renderForecast();

 if(!matches.length){

  list.innerHTML=`
   <div class="empty">
    暂无赛事数据。<br><br>
    请确认对应 JSON 数据文件已经上传到 GitHub。
   </div>
  `;

 }

}


/* =========================================================
   数据标准化
   ========================================================= */

function normalize(raw){

 if(!raw || typeof raw!=="object"){
  return null;
 }

 const info=
  raw.info ||
  raw.basic ||
  {};

 const analysis=
  raw.analysis ||
  {};

 const forecast=
  raw.forecasts ||
  raw.forecast ||
  {};

 const oddsSource=
  raw.odds ||
  analysis.odds ||
  forecast.odds ||
  {};

 const openingSource=
  raw.opening ||
  analysis.opening ||
  {};

 return {

  id:
   info.id ||
   raw.id ||
   createLocalId(),

  matchNo:
   info.matchNo ||
   info.code ||
   raw.matchNo ||
   raw.code ||
   "",

  league:
   info.league ||
   info.competition ||
   raw.league ||
   raw.competition ||
   "未知联赛",

  home:
   info.home ||
   info.homeTeam ||
   raw.home ||
   raw.homeTeam ||
   "主队",

  away:
   info.away ||
   info.awayTeam ||
   raw.away ||
   raw.awayTeam ||
   "客队",

  time:
   info.time ||
   info.startTime ||
   raw.time ||
   raw.startTime ||
   "",

  odds:normalizeOdds(oddsSource),

  opening:normalizeOdds(openingSource),

  forecast:forecast,

  analysis:analysis,

  risk:
   raw.riskAlert ||
   analysis.riskAlert ||
   ""

 };

}


function normalizeOdds(o){

 o=o||{};

 return {

  home:num(
   firstValue(
    o.home,
    o.win,
    o["3"],
    o["主胜"]
   )
  ),

  draw:num(
   firstValue(
    o.draw,
    o.x,
    o["1"],
    o["平"]
   )
  ),

  away:num(
   firstValue(
    o.away,
    o.lose,
    o["0"],
    o["客胜"],
    o["负"]
   )
  )

 };

}


function firstValue(...values){

 for(const value of values){

  if(
   value!==undefined &&
   value!==null &&
   value!==""
  ){
   return value;
  }

 }

 return null;

}


function num(x){

 if(x===null || x===undefined || x===""){
  return null;
 }

 const n=parseFloat(
  String(x).replace(/,/g,"").trim()
 );

 return Number.isFinite(n) ? n : null;

}


function createLocalId(){

 return "local_"+Date.now()+"_"+Math.random()
  .toString(36)
  .slice(2,8);

}


/* =========================================================
   概率
   ========================================================= */

function marketProbability(match){

 const home=match.odds.home;
 const draw=match.odds.draw;
 const away=match.odds.away;

 /*
  * 这里非常重要：
  *
  * 原来的代码在没有赔率时直接返回
  * 33% / 34% / 33%。
  *
  * 这会制造“虚假概率”。
  *
  * 现在没有完整赔率就明确返回 invalid。
  */

 if(
  !(home>0) ||
  !(draw>0) ||
  !(away>0)
 ){

  return {
   home:null,
   draw:null,
   away:null,
   valid:false
  };

 }

 const a=1/home;
 const b=1/draw;
 const c=1/away;

 const sum=a+b+c;

 if(!(sum>0)){
  return {
   home:null,
   draw:null,
   away:null,
   valid:false
  };
 }

 return {

  home:a/sum,
  draw:b/sum,
  away:c/sum,

  valid:true

 };

}


/* =========================================================
   基础分析
   ========================================================= */

function deepAnalyze(match){

 const p=marketProbability(match);

 if(!p.valid){

  return {

   p:p,

   direction:"暂无",

   primary:"暂不推荐",

   confidence:null,

   risk:null,

   cold:"",

   gap:null,

   valid:false

  };

 }

 const probs=[
  p.home,
  p.draw,
  p.away
 ];

 const max=Math.max(...probs);

 let direction="主胜";

 if(max===p.draw){
  direction="平";
 }

 if(max===p.away){
  direction="客胜";
 }

 const sorted=[...probs].sort(
  (a,b)=>b-a
 );

 const gap=sorted[0]-sorted[1];

 let risk=0;

 if(gap<0.08){
  risk+=30;
 }else if(gap<0.15){
  risk+=15;
 }

 if(p.draw>=0.30){
  risk+=15;
 }

 if(max<0.45){
  risk+=20;
 }

 let cold="";

 if(max<0.40){

  cold="超级冷门候选";

 }else if(max<0.48){

  cold="冷门观察";

 }

 let primary=direction;

 if(
  p.draw>=0.31 &&
  Math.abs(p.home-p.away)<0.12
 ){

  primary="平";

 }

 return {

  p:p,

  direction:direction,

  primary:primary,

  confidence:Math.round(max*100),

  risk:risk,

  cold:cold,

  gap:gap,

  valid:true

 };

}


/* =========================================================
   赛事列表
   ========================================================= */

function renderMatches(){

 const query=(
  document.getElementById("search").value||""
 ).trim().toLowerCase();

 const league=
  document.getElementById("league").value;

 const list=
  document.getElementById("matchList");

 const filtered=matches.filter(match=>{

  const text=(
   match.league+" "+
   match.home+" "+
   match.away
  ).toLowerCase();

  return(
   (!query || text.includes(query)) &&
   (!league || match.league===league)
  );

 });

 if(!filtered.length){

  list.innerHTML=
   '<div class="empty">暂无赛事数据</div>';

  return;

 }

 list.innerHTML=
  filtered.map(renderMatchCard).join("");

}


function renderMatchCard(match){

 const analysis=deepAnalyze(match);

 const p=analysis.p;

 const probabilityBlock=
  analysis.valid
   ? `
    <div class="prob">

     <div
      class="p1"
      style="width:${p.home*100}%"
     ></div>

     <div
      class="px"
      style="width:${p.draw*100}%"
     ></div>

     <div
      class="p2"
      style="width:${p.away*100}%"
     ></div>

    </div>

    <div class="labels">

     <span>主 ${pct(p.home)}</span>
     <span>平 ${pct(p.draw)}</span>
     <span>客 ${pct(p.away)}</span>

    </div>
   `
   : `
    <div class="notice">
     当前没有完整的主胜 / 平 / 客胜赔率，
     暂不计算市场概率。
    </div>
   `;

 const confidence=
  analysis.valid
   ? `<span class="badge">${analysis.confidence}%倾向</span>`
   : `<span class="badge">数据不足</span>`;

 const riskBadge=
  analysis.cold
   ? `<span class="badge cold">${analysis.cold}</span>`
   : analysis.valid
    ? `<span class="badge safe">相对稳定</span>`
    : "";

 const pickText=
  analysis.valid
   ? analysis.primary
   : "暂不推荐";

 const reason=
  analysis.valid
   ? (
    analysis.primary==="平"
     ? "双方市场概率接近且平局概率较高，建议重点防平。"
     : "当前最高概率方向为"+
       analysis.primary+
       "，仍需结合后续数据和历史样本验证。"
   )
   : "当前缺少完整赔率数据，证据不足，不强行判断。";

 return `

 <div
  class="card"
  data-match-id="${esc(match.id)}"
 >

  <div class="match-head">

   <div>

    <div class="muted">
     ${esc(match.matchNo)}
     ·
     ${esc(match.league)}
    </div>

    <div class="match-title">
     ${esc(match.home)}
     <span class="muted"> vs </span>
     ${esc(match.away)}
    </div>

    <div class="muted">
     ${esc(match.time)}
    </div>

   </div>

   <div style="text-align:right">

    ${confidence}

    ${riskBadge}

   </div>

  </div>

  ${probabilityBlock}

  <div class="grid">

   <div class="stat">
    <b>${displayOdds(match.odds.home)}</b>
    <span>主胜赔率</span>
   </div>

   <div class="stat">
    <b>${displayOdds(match.odds.draw)}</b>
    <span>平局赔率</span>
   </div>

   <div class="stat">
    <b>${displayOdds(match.odds.away)}</b>
    <span>客胜赔率</span>
   </div>

  </div>

  <div class="pick">

   <span class="badge hot">
    单选判断
   </span>

   <strong>
    ${pickText}
   </strong>

   ${
    analysis.cold
     ? `<span class="badge cold">
         ${analysis.cold}
        </span>`
     : ""
   }

   <div class="reason">

    ${reason}

    ${
     analysis.valid
      ? `<br>风险评分：${analysis.risk}/100。`
      : ""
    }

   </div>

  </div>

  <div style="margin-top:10px">

   <button
    class="action"
    style="height:36px"
    onclick="openHistoryForMatch('${escAttr(match.id)}')"
   >
    查看历史同赔
   </button>

  </div>

 </div>

 `;

}


/* =========================================================
   数据页面
   ========================================================= */

function renderData(){

 document.getElementById("totalMatches")
  .textContent=matches.length;

 let draw=0;
 let cold=0;

 matches.forEach(match=>{

  const analysis=deepAnalyze(match);

  if(
   analysis.valid &&
   analysis.primary==="平"
  ){
   draw++;
  }

  if(analysis.cold){
   cold++;
  }

 });

 document.getElementById("drawCount")
  .textContent=draw;

 document.getElementById("coldCount")
  .textContent=cold;


 let h=0;
 let d=0;
 let a=0;
 let validCount=0;

 matches.forEach(match=>{

  const p=marketProbability(match);

  if(!p.valid){
   return;
  }

  h+=p.home;
  d+=p.draw;
  a+=p.away;

  validCount++;

 });


 if(validCount){

  h/=validCount;
  d/=validCount;
  a/=validCount;

  document.getElementById("direction").innerHTML=`

   <div class="grid">

    <div class="stat">
     <b>${pct(h)}</b>
     <span>平均主胜概率</span>
    </div>

    <div class="stat">
     <b>${pct(d)}</b>
     <span>平均平局概率</span>
    </div>

    <div class="stat">
     <b>${pct(a)}</b>
     <span>平均客胜概率</span>
    </div>

   </div>

  `;

 }else{

  document.getElementById("direction").innerHTML=`

   <div class="notice">
    当前没有足够完整的赔率数据，
    暂不计算市场概率。
   </div>

  `;

 }

 document.getElementById("movement")
  .innerHTML=movementAnalysis();

}


/* =========================================================
   变盘分析
   ========================================================= */

function movementAnalysis(){

 const available=matches.filter(match=>

  match.opening.home &&
  match.opening.draw &&
  match.opening.away &&

  match.odds.home &&
  match.odds.draw &&
  match.odds.away

 );

 if(!available.length){

  return `
   <div class="notice">
    当前赛事数据没有完整的
    “初盘 + 即时盘”字段，
    因此暂不判断真实变盘，
    避免制造虚假异动。
   </div>
  `;

 }

 return available.map(match=>{

  const dh=
   match.odds.home-
   match.opening.home;

  const dd=
   match.odds.draw-
   match.opening.draw;

  const da=
   match.odds.away-
   match.opening.away;

  return `

   <div class="reason">

    <b>
     ${esc(match.home)}
     vs
     ${esc(match.away)}
    </b>

    <br>

    主胜
    ${movementArrow(dh)}
    ·
    平
    ${movementArrow(dd)}
    ·
    客胜
    ${movementArrow(da)}

   </div>

  `;

 }).join("");

}


function movementArrow(value){

 if(value>0){
  return "↑";
 }

 if(value<0){
  return "↓";
 }

 return "—";

}


/* =========================================================
   前瞻
   ========================================================= */

function renderForecast(){

 const box=
  document.getElementById("forecastList");

 if(!matches.length){

  box.innerHTML=
   '<div class="empty">暂无赛事</div>';

  renderParlays([]);

  return;
 }

 const arr=matches
  .map(match=>({

   match:match,

   analysis:deepAnalyze(match)

  }))
  .sort((a,b)=>{

   const aa=a.analysis.confidence||0;
   const bb=b.analysis.confidence||0;

   return bb-aa;

  });


 box.innerHTML=arr.map(item=>{

  const match=item.match;
  const analysis=item.analysis;

  return `

   <div class="card">

    <div class="muted">
     ${esc(match.league)}
     ·
     ${esc(match.time)}
    </div>

    <div class="match-title">
     ${esc(match.home)}
     vs
     ${esc(match.away)}
    </div>

    <div class="pick">

     <span class="badge hot">
      首选
     </span>

     <strong>
      ${analysis.primary}
     </strong>

     <div class="reason">

      ${
       analysis.valid
        ? `
          概率 ${analysis.confidence}%
          ·
          平局 ${pct(analysis.p.draw)}
          ·
          风险 ${analysis.risk}/100。
          `
        : `
          当前赔率数据不足，
          暂不推荐。
          `
      }

     </div>

    </div>

   </div>

  `;

 }).join("");


 renderParlays(arr);

}


/* =========================================================
   串关
   ========================================================= */

function renderParlays(arr){

 const box=
  document.getElementById("parlays");

 const good=arr
  .filter(item=>
   item.analysis.valid &&
   item.analysis.confidence>=45 &&
   item.analysis.risk<65
  )
  .slice(0,8);

 if(good.length<3){

  box.innerHTML=`

   <div class="notice">
    当前证据不足，暂不强行生成串关。
    至少需要 3 场达到基础置信条件。
   </div>

  `;

  return;
 }

 const sizes=[8,7,6,5,3];

 box.innerHTML=sizes.map(size=>{

  if(good.length<size){

   return `

    <div class="card">

     <b>${size}串1</b>

     <div class="reason">
      暂不推荐：
      符合条件的赛事不足 ${size} 场。
     </div>

    </div>

   `;

  }

  const picks=good.slice(0,size);

  return `

   <div class="card">

    <b>${size}串1</b>

    <div class="reason">

     ${picks.map((item,index)=>`

      ${index+1}.
      ${esc(item.match.home)}
      vs
      ${esc(item.match.away)}
      →
      <b>${item.analysis.primary}</b>

     `).join("<br>")}

    </div>

   </div>

  `;

 }).join("");

}


/* =========================================================
   CSV
   ========================================================= */

document.getElementById("csvFile")
 .addEventListener(
  "change",
  handleCSV
 );


function handleCSV(event){

 const file=event.target.files &&
  event.target.files[0];

 if(!file){
  return;
 }

 const reader=new FileReader();

 reader.onload=function(){

  try{

   historyRows=
    parseCSV(String(reader.result||""));

   try{

    localStorage.setItem(
     HISTORY_KEY,
     JSON.stringify(historyRows)
    );

   }catch(error){

    console.warn(
     "历史数据缓存失败",
     error
    );

   }

   updateHistoryInfo();

  }catch(error){

   historyRows=[];

   document.getElementById(
    "historyInfo"
   ).innerHTML=
    `
     <div class="notice">
      CSV读取失败，请检查文件格式。
     </div>
    `;

   console.error(error);

  }

 };

 reader.readAsText(file,"UTF-8");

}


/* =========================================================
   CSV解析
   ========================================================= */

function parseCSV(text){

 const normalized=text
  .replace(/^\uFEFF/,"")
  .replace(/\r/g,"");

 const lines=normalized
  .split("\n")
  .filter(line=>line.trim());

 if(!lines.length){
  return [];
 }

 const headers=parseCSVLine(lines[0]);

 return lines.slice(1).map(line=>{

  const cells=parseCSVLine(line);
  const obj={};

  headers.forEach((header,index)=>{

   obj[header]=
    (cells[index]||"").trim();

  });

  return obj;

 });

}


function parseCSVLine(line){

 const result=[];

 let current="";
 let quoted=false;

 for(let i=0;i<line.length;i++){

  const char=line[i];

  if(char==='"'){

   if(
    quoted &&
    line[i+1]==='"'
   ){

    current+='"';
    i++;

   }else{

    quoted=!quoted;

   }

  }else if(
   char==="," &&
   !quoted
  ){

   result.push(current);
   current="";

  }else{

   current+=char;

  }

 }

 result.push(current);

 return result;

}


/* =========================================================
   历史数据库
   ========================================================= */

function updateHistoryInfo(){

 const info=
  document.getElementById("historyInfo");

 if(!historyRows.length){

  info.textContent=
   "请导入你的历史 CSV 数据库。导入后会缓存在本机浏览器。";

function clearHistory(){

 historyRows=[];

 try{

  localStorage.removeItem(HISTORY_KEY);

 }catch(error){

  console.warn(error);

 }

 updateHistoryInfo();

 document.getElementById(
  "similarHistory"
 ).innerHTML=
  "历史数据库已清除。";

}


/* =========================================================
   历史缓存加载
   ========================================================= */

function loadHistory(){

 try{

  const cached=
   localStorage.getItem(HISTORY_KEY);

  if(!cached){
   updateHistoryInfo();
   return;
  }

  const parsed=JSON.parse(cached);

  if(Array.isArray(parsed)){

   historyRows=parsed;

  }

 }catch(error){

  historyRows=[];

  console.warn(
   "历史缓存读取失败",
   error
  );

 }

 updateHistoryInfo();

}


/* =========================================================
   历史同赔
   ========================================================= */

function findSimilar(match){

 if(!historyRows.length){
  return [];
 }

 const odds=match.odds;

 if(
  !(odds.home>0) ||
  !(odds.draw>0) ||
  !(odds.away>0)
 ){

  return [];

 }

 return historyRows.filter(row=>{

  const home=num(
   firstValue(
    row["主胜"],
    row["主胜赔率"],
    row["胜"],
    row["home"]
   )
  );

  const draw=num(
   firstValue(
    row["平"],
    row["平局"],
    row["平局赔率"],
    row["draw"]
   )
  );

  const away=num(
   firstValue(
    row["负"],
    row["客胜"],
    row["客胜赔率"],
    row["away"]
   )
  );

  if(
   !(home>0) ||
   !(draw>0) ||
   !(away>0)
  ){

   return false;

  }

  return(

   Math.abs(
    home-odds.home
   )<=0.15 &&

   Math.abs(
    draw-odds.draw
   )<=0.15 &&

   Math.abs(
    away-odds.away
   )<=0.15

  );

 }).slice(0,100);

}


function analyzeSimilar(match){

 const rows=findSimilar(match);

 if(!rows.length){

  return {

   count:0,

   text:"暂无足够历史同赔样本"

  };

 }

 let win=0;
 let draw=0;
 let lose=0;

 rows.forEach(row=>{

  const result=String(
   firstValue(
    row["赛果"],
    row["结果"],
    row["result"],
    row["Result"]
   )||""
  ).trim();

  if(
   result==="胜" ||
   result==="主胜" ||
   result==="3"
  ){

   win++;

  }else if(
   result==="平" ||
   result==="1"
  ){

   draw++;

  }else if(
   result==="负" ||
   result==="客胜" ||
   result==="0"
  ){

   lose++;

  }

 });

 return {

  count:rows.length,

  text:
   `样本 ${rows.length} 场；`+
   `主胜 ${Math.round(win/rows.length*100)}%；`+
   `平 ${Math.round(draw/rows.length*100)}%；`+
   `客胜 ${Math.round(lose/rows.length*100)}%。`

 };

}

/* =========================================================
   30天统计
   ========================================================= */

function renderThirtyDays(){

 const box=
  document.getElementById("thirtyDays");

 if(!historyRows.length){

  box.innerHTML=
   "暂无历史数据。";

  return;

 }

 const dates=[];

 historyRows.forEach(row=>{

  const date=firstValue(
   row["日期"],
   row["比赛日期"],
   row["date"],
   row["Date"]
  );

  if(date){
   dates.push(date);
  }

 });

 if(!dates.length){

  box.innerHTML=
   `
    数据库共
    ${historyRows.length}
    条记录。<br>
    已载入历史数据库，但没有识别到标准日期字段。
   `;

  return;

 }

 box.innerHTML=
  `
   数据库共
   <b>${historyRows.length}</b>
   条记录。<br>
   已识别日期字段
   <b>${dates.length}</b>
   条。
  `;

}

/* =========================================================
   工具函数
   ========================================================= */

function pct(value){

 if(
  value===null ||
  value===undefined ||
  !Number.isFinite(value)
 ){
  return "-";
 }

 return Math.round(value*100)+"%";

}


function displayOdds(value){

 if(
  value===null ||
  value===undefined ||
  !Number.isFinite(value)
 ){
  return "-";
 }

 return String(value);

}


function esc(value){

 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#39;");

}


function escAttr(value){

 return esc(value);

}
