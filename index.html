<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#111827">
<title>竞彩足球预测分析</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}

.header{
 position:sticky;top:0;z-index:100;
 height:58px;background:#fff;border-bottom:1px solid #e9eaed;
 display:flex;align-items:center;padding:0 14px;
}
.logo{font-size:20px;font-weight:800;color:#1f2937;white-space:nowrap}
.logo span{color:#e53935}
.header-right{margin-left:auto;display:flex;gap:8px}
.header-btn{
 border:0;background:#f3f4f6;color:#555;border-radius:8px;
 padding:7px 11px;font-size:13px
}

.nav{
 position:sticky;top:58px;z-index:90;
 background:#fff;border-bottom:1px solid #eee;
 display:flex;overflow-x:auto;white-space:nowrap;
}
.nav::-webkit-scrollbar{display:none}
.nav-item{
 padding:13px 17px;font-size:14px;color:#666;position:relative
}
.nav-item.active{color:#e53935;font-weight:700}
.nav-item.active:after{
 content:"";position:absolute;bottom:0;left:18px;right:18px;
 height:2px;background:#e53935;border-radius:2px
}

.container{max-width:1180px;margin:auto;padding:12px}

.datebar{
 background:#fff;border-radius:8px;padding:10px;
 display:flex;align-items:center;gap:8px;
 overflow-x:auto;border:1px solid #eee
}
.date{
 min-width:76px;text-align:center;padding:8px 7px;
 border-radius:7px;color:#666;font-size:12px
}
.date strong{display:block;font-size:15px;margin-top:3px}
.date.active{background:#e53935;color:#fff}

.toolbar{
 margin-top:10px;background:#fff;border:1px solid #eee;
 border-radius:8px;padding:10px;
 display:flex;gap:8px;overflow-x:auto
}
.filter{
 border:1px solid #ddd;background:#fff;border-radius:6px;
 padding:7px 12px;color:#555;white-space:nowrap;font-size:13px
}
.filter.active{border-color:#e53935;color:#e53935;background:#fff7f7}

.page{display:none}
.page.active{display:block}

.summary{
 margin-top:10px;background:#fff;border-radius:8px;
 border:1px solid #eee;padding:12px;
 display:grid;grid-template-columns:repeat(4,1fr);gap:8px
}
.summary-item{text-align:center;border-right:1px solid #eee}
.summary-item:last-child{border-right:0}
.summary-label{font-size:12px;color:#999}
.summary-value{font-size:19px;font-weight:800;margin-top:3px}

.match{
 margin-top:10px;background:#fff;border:1px solid #e7e8eb;
 border-radius:8px;overflow:hidden
}
.match-head{
 min-height:43px;padding:0 11px;background:#fafafa;
 display:flex;align-items:center;border-bottom:1px solid #eee
}
.match-no{font-size:13px;font-weight:700;color:#e53935;margin-right:8px}
.league{font-size:12px;color:#666}
.time{margin-left:auto;font-size:12px;color:#999}

.match-main{
 display:grid;grid-template-columns:1fr 150px 1fr;
 align-items:center;padding:16px 12px
}
.team{text-align:center;font-weight:700;font-size:16px}
.team.home{text-align:right}
.team.away{text-align:left}
.team-sub{font-size:11px;color:#aaa;margin-top:4px;font-weight:400}
.vs{text-align:center}
.vs-time{font-size:12px;color:#999}
.vs-text{font-size:18px;font-weight:800;margin-top:3px}

.prediction{
 border-top:1px solid #eee;padding:11px 12px;
 display:grid;grid-template-columns:repeat(4,1fr);gap:7px
}
.pred-box{
 background:#f7f8fa;border-radius:6px;padding:8px;text-align:center
}
.pred-title{font-size:11px;color:#999}
.pred-value{font-size:14px;font-weight:700;margin-top:3px;color:#333}
.pred-value.hot{color:#e53935}

.analysis{
 display:none;border-top:1px solid #eee;background:#fcfcfd;
 padding:13px
}
.analysis.open{display:block}
.analysis-title{font-weight:800;font-size:15px;margin-bottom:9px}
.analysis-text{
 color:#555;font-size:13px;line-height:1.75
}
.analysis-grid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px
}
.analysis-card{
 background:#fff;border:1px solid #eee;border-radius:7px;padding:10px
}
.analysis-card h4{margin:0 0 7px;font-size:13px}
.analysis-card p{margin:0;color:#666;font-size:12px;line-height:1.6}

.match-foot{
 border-top:1px solid #eee;padding:9px 12px;
 display:flex;justify-content:space-between;align-items:center
}
.level{font-size:12px;color:#999}
.detail-btn{
 border:0;background:#fff0f0;color:#e53935;
 border-radius:5px;padding:6px 11px;font-size:12px
}

.empty{
 background:#fff;border:1px solid #eee;border-radius:8px;
 text-align:center;padding:45px 20px;color:#999;margin-top:10px
}

.loading{
 background:#fff;border:1px solid #eee;border-radius:8px;
 padding:35px;text-align:center;color:#999;margin-top:10px
}

.section{
 background:#fff;border:1px solid #eee;border-radius:8px;
 margin-top:10px;padding:14px
}
.section-title{
 font-weight:800;font-size:16px;padding-bottom:10px;
 border-bottom:1px solid #eee
}
.report-row{
 display:flex;justify-content:space-between;
 padding:12px 3px;border-bottom:1px solid #f0f0f0;
 font-size:13px
}
.report-row:last-child{border:0}

.search{
 width:100%;border:1px solid #ddd;border-radius:7px;
 padding:9px 11px;outline:0
}
.search:focus{border-color:#e53935}

.badge{
 display:inline-block;padding:2px 6px;border-radius:4px;
 background:#fef2f2;color:#e53935;font-size:10px;margin-left:5px
}

@media(max-width:650px){
 .container{padding:8px}
 .summary{grid-template-columns:repeat(4,1fr);padding:9px 5px}
 .summary-value{font-size:16px}
 .summary-label{font-size:10px}
 .match-main{grid-template-columns:1fr 72px 1fr;padding:14px 8px}
 .team{font-size:14px}
 .prediction{grid-template-columns:repeat(2,1fr)}
 .analysis-grid{grid-template-columns:1fr}
 .nav-item{padding-left:14px;padding-right:14px}
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">竞彩足球<span>预测分析</span></div>
  <div class="header-right">
    <button class="header-btn" onclick="reloadData()">刷新</button>
  </div>
</header>

<nav class="nav">
  <div class="nav-item active" data-page="matches">赛事</div>
  <div class="nav-item" data-page="forecast">前瞻</div>
  <div class="nav-item" data-page="analysis">AI分析</div>
  <div class="nav-item" data-page="scores">比分</div>
  <div class="nav-item" data-page="history">历史</div>
  <div class="nav-item" data-page="statistics">统计</div>
</nav>

<main class="container">

<!-- 赛事 -->
<section id="page-matches" class="page active">

  <div class="datebar" id="dateBar"></div>

  <div class="toolbar">
    <button class="filter active" data-league="all">全部赛事</button>
    <button class="filter" data-league="中超">中超</button>
    <button class="filter" data-league="日职">日职</button>
    <button class="filter" data-league="日职乙">日职乙</button>
    <button class="filter" data-league="韩职">韩职</button>
    <button class="filter" data-league="英超">英超</button>
    <button class="filter" data-league="西甲">西甲</button>
    <button class="filter" data-league="德甲">德甲</button>
    <button class="filter" data-league="意甲">意甲</button>
  </div>

  <div class="summary">
    <div class="summary-item">
      <div class="summary-label">赛事</div>
      <div class="summary-value" id="countAll">0</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">重点</div>
      <div class="summary-value" id="countFocus">0</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">冷门</div>
      <div class="summary-value" id="countUpset">0</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">高信心</div>
      <div class="summary-value" id="countHigh">0</div>
    </div>
  </div>

  <div id="matchList">
    <div class="loading">正在读取赛事数据...</div>
  </div>

</section>


<!-- 前瞻 -->
<section id="page-forecast" class="page">

  <div class="section">
    <div class="section-title">赛事前瞻</div>
    <div style="margin-top:12px">
      <input class="search" id="forecastSearch"
             placeholder="搜索球队 / 联赛 / 编号">
    </div>
  </div>

  <div id="forecastList"></div>

</section>


<!-- AI分析 -->
<section id="page-analysis" class="page">

  <div class="section">
    <div class="section-title">AI综合分析</div>
    <p style="color:#888;font-size:13px;line-height:1.7">
      基于赛事 JSON 中已有的赛前分析、胜平负、让球、进球数、
      半全场、比分及风险提示进行统一展示。
    </p>
  </div>

  <div id="analysisList"></div>

</section>


<!-- 比分 -->
<section id="page-scores" class="page">

  <div class="section">
    <div class="section-title">比分预测</div>
  </div>

  <div id="scoreList"></div>

</section>


<!-- 历史 -->
<section id="page-history" class="page">

  <div class="section">
    <div class="section-title">历史分析记录</div>
    <p style="font-size:13px;color:#888;line-height:1.7">
      当前优先读取 GitHub 已保存的历史赛事 JSON。
      后续可以继续加入赛果回填、预测命中与连续 30 天统计。
    </p>
  </div>

  <div id="historyList"></div>

</section>


<!-- 统计 -->
<section id="page-statistics" class="page">

  <div class="section">
    <div class="section-title">30天预测统计</div>
    <div id="statisticsBox" style="margin-top:10px"></div>
  </div>

</section>

</main>


<script>
/* =========================================================
   数据层
   ========================================================= */

const DATA_BASE = "./";

let allMatches = [];
let currentDate = "2026-10-04";
let currentLeague = "all";


/*
 * 自动尝试读取当前日期目录。
 *
 * GitHub Pages:
 * /2026/10/04/*.json
 *
 * 因为浏览器不能直接列目录，所以这里使用
 * GitHub 仓库 API 获取该目录文件列表。
 */
async function loadDate(date){

  const parts = date.split("-");
  const year = parts[0];
  const month = parts[1];
  const day = parts[2];

  const path = `${year}/${month}/${day}`;

  const api =
    `https://api.github.com/repos/tan9527819/qiuxiaoce-football-data/contents/${path}`;

  try{

    const response = await fetch(api,{
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error("GitHub目录读取失败");
    }

    const files = await response.json();

    const jsonFiles = files.filter(x =>
      x.type === "file" &&
      x.name.toLowerCase().endsWith(".json")
    );

    const results = [];

    for(const file of jsonFiles){

      try{

        const r = await fetch(file.download_url,{
          cache:"no-store"
        });

        if(!r.ok) continue;

        const data = await r.json();

        const match = normalizeMatch(data,file.name);

        if(match){
          results.push(match);
        }

      }catch(e){
        console.warn("JSON读取失败",file.name,e);
      }
    }

    return results;

  }catch(error){

    console.error(error);

    return [];
  }
}


/* =========================================================
   数据标准化
   ========================================================= */

function normalizeMatch(data,fileName){

  if(!data) return null;

  const info = data.info || {};
  const analysis = data.analysis || {};

  const home =
    info.home ||
    info.homeTeam ||
    analysis.home ||
    "";

  const away =
    info.away ||
    info.awayTeam ||
    analysis.away ||
    "";

  const comp =
    info.comp ||
    info.league ||
    analysis.comp ||
    "";

  const kickoff =
    info.time ||
    info.kickoff ||
    analysis.kickoff ||
    "";

  const code =
    info.code ||
    analysis.code ||
    fileName.match(/(北单\d+|竞彩\d+)/)?.[1] ||
    "";

  const level =
    info.level ||
    analysis.confidence ||
    "中";

  const mainPick =
    info.mainPick ||
    analysis.highlight ||
    "";

  const directions =
    Array.isArray(info.directions)
      ? info.directions
      : [];

  const forecasts =
    info.forecasts || {};

  const scoreline =
    getValue(
      forecasts,
      ["scoreline","比分","exact"],
      analysis.exact
    );

  const goals =
    getValue(
      forecasts,
      ["goals","进球","overUnder"],
      analysis.overUnder
    );

  const halftime =
    getValue(
      forecasts,
      ["halftime","半全场","htft"],
      analysis.htft
    );

  const win =
    analysis.win ||
    findDirection(directions,"胜平负") ||
    {};

  const handicap =
    analysis.handicap ||
    findDirection(directions,"让球") ||
    {};

  const risk =
    data.riskAlert ||
    analysis.riskAlert ||
    false;

  return {
    raw:data,
    fileName,
    code,
    comp,
    home,
    away,
    kickoff,
    level,
    mainPick,
    directions,
    scoreline,
    goals,
    halftime,
    win,
    handicap,
    risk
  };
}


function getValue(obj,keys,fallback){

  for(const key of keys){

    if(obj && obj[key] !== undefined){

      if(Array.isArray(obj[key]))
        return obj[key];

      if(typeof obj[key] === "object")
        return obj[key];

      return obj[key];
    }
  }

  return fallback || [];
}


function findDirection(arr,key){

  if(!Array.isArray(arr)) return {};

  return arr.find(x =>
    String(x.type || x.title || x.name || "")
      .includes(key)
  ) || {};
}


/* =========================================================
   日期
   ========================================================= */

function buildDates(){

  const bar = document.getElementById("dateBar");

  const dates = [];

  for(let i=-2;i<=3;i++){

    const d = new Date("2026-10-04T00:00:00");

    d.setDate(d.getDate()+i);

    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");

    dates.push(`${y}-${m}-${day}`);
  }

  bar.innerHTML = dates.map(d => {

    const date = new Date(d+"T00:00:00");

    const week =
      ["日","一","二","三","四","五","六"][date.getDay()];

    const active =
      d===currentDate ? "active" : "";

    return `
      <div class="date ${active}" onclick="changeDate('${d}')">
        周${week}
        <strong>${d.slice(5)}</strong>
      </div>
    `;

  }).join("");
}


async function changeDate(date){

  currentDate = date;

  buildDates();

  document.getElementById("matchList").innerHTML =
    `<div class="loading">正在读取 ${date} 赛事...</div>`;

  allMatches = await loadDate(date);

  renderAll();
}


/* =========================================================
   赛事渲染
   ========================================================= */

function filteredMatches(){

  return allMatches.filter(m => {

    if(currentLeague==="all") return true;

    return String(m.comp).includes(currentLeague);
  });
}


function renderAll(){

  const list = filteredMatches();

  renderSummary(list);
  renderMatches(list);
  renderForecast(list);
  renderAnalysis(list);
  renderScores(list);
  renderHistory();
  renderStatistics();
}


function renderSummary(list){

  document.getElementById("countAll").textContent =
    list.length;

  const focus =
    list.filter(x =>
      x.level==="高" ||
      x.level==="high" ||
      Number(x.level)>=80
    ).length;

  const upset =
    list.filter(x =>
      x.risk ||
      /冷|爆|防/.test(
        JSON.stringify(x.raw)
      )
    ).length;

  const high =
    list.filter(x =>
      x.mainPick &&
      x.mainPick.length>5
    ).length;

  document.getElementById("countFocus").textContent=focus;
  document.getElementById("countUpset").textContent=upset;
  document.getElementById("countHigh").textContent=high;
}


function renderMatches(list){

  const box = document.getElementById("matchList");

  if(!list.length){

    box.innerHTML = `
      <div class="empty">
        当前日期暂无可读取赛事数据
      </div>
    `;

    return;
  }

  box.innerHTML =
    list.map((m,i)=>matchHTML(m,i)).join("");
}


function matchHTML(m,index){

  const score =
    formatValue(m.scoreline);

  const goals =
    formatValue(m.goals);

  const ht =
    formatValue(m.halftime);

  const winPick =
    getPick(m.win);

  const handicapPick =
    getPick(m.handicap);

  return `
  <article class="match">

    <div class="match-head">
      <span class="match-no">${escapeHTML(m.code || String(index+1))}</span>
      <span class="league">${escapeHTML(m.comp || "赛事")}</span>
      ${m.risk ? '<span class="badge">风险</span>' : ''}
      <span class="time">${escapeHTML(m.kickoff || "")}</span>
    </div>

    <div class="match-main">

      <div class="team home">
        ${escapeHTML(m.home || "主队")}
        <div class="team-sub">主</div>
      </div>

      <div class="vs">
        <div class="vs-time">
          ${formatKickoff(m.kickoff)}
        </div>
        <div class="vs-text">VS</div>
      </div>

      <div class="team away">
        ${escapeHTML(m.away || "客队")}
        <div class="team-sub">客</div>
      </div>

    </div>

    <div class="prediction">

      <div class="pred-box">
        <div class="pred-title">胜平负</div>
        <div class="pred-value hot">
          ${escapeHTML(winPick || "—")}
        </div>
      </div>

      <div class="pred-box">
        <div class="pred-title">让球</div>
        <div class="pred-value">
          ${escapeHTML(handicapPick || "—")}
        </div>
      </div>

      <div class="pred-box">
        <div class="pred-title">进球</div>
        <div class="pred-value">
          ${escapeHTML(goals || "—")}
        </div>
      </div>

      <div class="pred-box">
        <div class="pred-title">比分</div>
        <div class="pred-value">
          ${escapeHTML(score || "—")}
        </div>
      </div>

    </div>

    <div class="match-foot">

      <span class="level">
        信心：${escapeHTML(String(m.level))}
      </span>

      <button class="detail-btn"
        onclick="toggleAnalysis(${index})">
        查看分析
      </button>

    </div>

    <div class="analysis" id="analysis-${index}">

      <div class="analysis-title">
        综合赛前分析
      </div>

      <div class="analysis-text">
        ${escapeHTML(
          m.mainPick ||
          "暂无详细赛前结论"
        )}
      </div>

      <div class="analysis-grid">

        <div class="analysis-card">
          <h4>胜平负</h4>
          <p>${escapeHTML(
            JSON.stringify(m.win || {})
          )}</p>
        </div>

        <div class="analysis-card">
          <h4>让球方向</h4>
          <p>${escapeHTML(
            JSON.stringify(m.handicap || {})
          )}</p>
        </div>

        <div class="analysis-card">
          <h4>进球预测</h4>
          <p>${escapeHTML(
            formatValue(m.goals)
          )}</p>
        </div>

        <div class="analysis-card">
          <h4>半全场</h4>
          <p>${escapeHTML(
            formatValue(m.halftime)
          )}</p>
        </div>

      </div>

    </div>

  </article>
  `;
}


function toggleAnalysis(index){

  const el =
    document.getElementById("analysis-"+index);

  if(el) el.classList.toggle("open");
}


/* =========================================================
   前瞻
   ========================================================= */

function renderForecast(list){

  const box=document.getElementById("forecastList");

  if(!list.length){

    box.innerHTML=`<div class="empty">暂无前瞻数据</div>`;
    return;
  }

  box.innerHTML=list.map(m=>`

    <div class="section">

      <div style="font-weight:800">
        ${escapeHTML(m.code)}
        ${escapeHTML(m.home)}
        vs
        ${escapeHTML(m.away)}
      </div>

      <div style="font-size:12px;color:#999;margin-top:5px">
        ${escapeHTML(m.comp)}　
        ${escapeHTML(m.kickoff)}
      </div>

      <div style="
        margin-top:10px;
        color:#555;
        font-size:13px;
        line-height:1.7">
        ${escapeHTML(
          m.mainPick || "暂无前瞻结论"
        )}
      </div>

    </div>

  `).join("");
}


/* =========================================================
   AI
   ========================================================= */

function renderAnalysis(list){

  const box=document.getElementById("analysisList");

  if(!list.length){

    box.innerHTML=`<div class="empty">暂无 AI 分析</div>`;
    return;
  }

  box.innerHTML=list.map(m=>`

    <div class="section">

      <div class="section-title">
        ${escapeHTML(m.home)}
        vs
        ${escapeHTML(m.away)}
      </div>

      <div style="font-size:13px;line-height:1.8;color:#555;margin-top:10px">
        ${escapeHTML(
          m.mainPick || "暂无分析"
        )}
      </div>

      <div style="font-size:12px;color:#999;margin-top:8px">
        信心：${escapeHTML(String(m.level))}
        ${m.risk ? "　⚠ 存在风险提示" : ""}
      </div>

    </div>

  `).join("");
}


/* =========================================================
   比分
   ========================================================= */

function renderScores(list){

  const box=document.getElementById("scoreList");

  if(!list.length){

/* =========================================================
   工具
   ========================================================= */

function getPick(obj){

  if(!obj) return "";

  if(typeof obj==="string")
    return obj;

  return obj.pick ||
         obj.mainPick ||
         obj.value ||
         obj.result ||
         obj.direction ||
         "";
}


function formatValue(value){

  if(value===undefined || value===null)
    return "";

  if(Array.isArray(value))
    return value.join(" / ");

  if(typeof value==="object"){

    return (
      value.pick ||
      value.mainPick ||
      value.value ||
      value.result ||
      value.direction ||
      Object.values(value).join(" / ")
    );
  }

  return String(value);
}


function formatKickoff(value){

  if(!value) return "";

  const s=String(value);

  if(s.includes(" "))
    return s.split(" ")[1].slice(0,5);

  return s;
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
