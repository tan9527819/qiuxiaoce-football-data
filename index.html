<body>

<header class="header">
    <h1>竞彩足球预测分析</h1>
    <p>真实数据分析 · 欧赔 · XG · 基本面</p>
</header>

<div class="toolbar">
    <div class="toolbar-inner">
        <input id="dateInput" type="date">
        <button onclick="loadData()">刷新数据</button>
    </div>
</div>

<main class="container">

    <div id="status" class="status">
        正在读取真实赛事数据……
    </div>

    <div id="list">
        <div class="loading">正在加载……</div>
    </div>

</main>

<script>

/* =========================================================
   基础配置
   ========================================================= */

const OWNER = "tan9527819";
const REPO = "qiuxiaoce-football-data";
const BRANCH = "main";

const API_ROOT =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents`;

const RAW_ROOT =
    `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;

const statusBox = document.getElementById("status");
const listBox = document.getElementById("list");
const dateInput = document.getElementById("dateInput");


/* =========================================================
   日期
   ========================================================= */

function localDate(){

    const d = new Date();

    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;
}

dateInput.value = localDate();


/* =========================================================
   通用工具
   ========================================================= */

function esc(value){

    if(value === undefined || value === null)
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function show(value){

    if(value === undefined ||
       value === null ||
       value === "" ||
       (Array.isArray(value) && value.length === 0))
        return "暂无数据";

    if(Array.isArray(value))
        return value.join(" / ");

    if(typeof value === "object")
        return Object.entries(value)
            .map(([k,v]) => `${k}: ${show(v)}`)
            .join("；");

    return String(value);
}


function pick(obj, keys){

    if(!obj || typeof obj !== "object")
        return null;

    for(const key of keys){

        if(obj[key] !== undefined &&
           obj[key] !== null &&
           obj[key] !== "")
            return obj[key];
    }

    return null;
}


function findKeyDeep(obj, keys, depth=0){

    if(!obj || typeof obj !== "object" || depth > 5)
        return null;

    for(const key of keys){

        if(Object.prototype.hasOwnProperty.call(obj,key)){

            const value = obj[key];

            if(value !== null &&
               value !== undefined &&
               value !== "")
                return value;
        }
    }

    for(const key of Object.keys(obj)){

        const result =
            findKeyDeep(obj[key],keys,depth+1);

        if(result !== null &&
           result !== undefined &&
           result !== "")
            return result;
    }

    return null;
}


/* =========================================================
   读取 GitHub
   ========================================================= */

async function githubJSON(url){

    const res = await fetch(url, {
        headers:{
            "Accept":"application/vnd.github+json"
        }
    });

    if(!res.ok)
        throw new Error(`GitHub ${res.status}`);

    return await res.json();
}


/* =========================================================
   获取某一天目录
   ========================================================= */

async function getDirectory(date){

    const parts = date.split("-");

    const year = parts[0];
    const month = parts[1];

    /*
      qiuxiaoce 数据结构：

      2026/
        09/
          xxx.json
    */

    const url =
        `${API_ROOT}/${year}/${month}?ref=${BRANCH}`;

    return await githubJSON(url);
}


/* =========================================================
   下载单个 JSON
   ========================================================= */

async function getMatch(file){

    try{

        if(file.download_url){

            const res = await fetch(file.download_url);

            if(res.ok)
                return await res.json();
        }

        const data =
            await githubJSON(file.url);

        if(data.content){

            const text =
                decodeURIComponent(
                    escape(
                        atob(
                            data.content.replace(/\n/g,"")
                        )
                    )
                );

            return JSON.parse(text);
        }

    }catch(e){

        console.warn("读取赛事失败",file.name,e);
    }

    return null;
}


/* =========================================================
   从 JSON 提取球队
   ========================================================= */

function getTeams(data){

    const info = data?.info || {};

    let home =
        pick(info,[
            "home",
            "homeTeam",
            "home_team",
            "主队"
        ]);

    let away =
        pick(info,[
            "away",
            "awayTeam",
            "away_team",
            "客队"
        ]);

    const teams =
        pick(info,[
            "teams",
            "match",
            "对阵"
        ]);

    if((!home || !away) && typeof teams === "string"){

        const arr =
            teams.split(/\s*(?:vs|VS|v|—|-)\s*/);

        if(arr.length >= 2){

            home = home || arr[0];
            away = away || arr[1];
        }
    }

    return {
        home:home || "主队",
        away:away || "客队"
    };
}


/* =========================================================
   提取欧赔
   ========================================================= */

function getOdds(data){

    const root = data || {};

    const odds =
        findKeyDeep(root,[
            "odds",
            "euroOdds",
            "europeOdds",
            "europeanOdds",
            "欧赔",
            "欧洲赔率"
        ]);

    if(!odds)
        return null;

    if(typeof odds === "string")
        return {
            current:odds
        };

    return odds;
}


function oddsText(value){

    if(value === null ||
       value === undefined ||
       value === "")
        return "暂无数据";

    if(typeof value !== "object")
        return String(value);

    const home =
        pick(value,[
            "home",
            "h",
            "主",
            "主胜"
        ]);

    const draw =
        pick(value,[
            "draw",
            "d",
            "平",
            "平局"
        ]);

    const away =
        pick(value,[
            "away",
            "a",
            "客",
            "客胜"
        ]);

    if(home !== null ||
       draw !== null ||
       away !== null){

        return [
            home !== null ? `主 ${home}` : "",
            draw !== null ? `平 ${draw}` : "",
            away !== null ? `客 ${away}` : ""
        ].filter(Boolean).join(" / ");
    }

    return show(value);
}


/* =========================================================
   提取 XG
   ========================================================= */

function getXG(data){

    const root = data || {};

    const xg =
        findKeyDeep(root,[
            "xg",
            "XG",
            "expectedGoals",
            "expected_goals"
        ]);

    const xga =
        findKeyDeep(root,[
            "xga",
            "XGA",
            "expectedGoalsAgainst",
            "expected_goals_against"
        ]);

    return {
        xg:xg,
        xga:xga
    };
}


/* =========================================================
   基本信息
   ========================================================= */

function getInfo(data){

    const info = data?.info || {};

    return {
        code:pick(info,[
            "code",
            "matchCode",
            "编号"
        ]),
        comp:pick(info,[
            "comp",
            "competition",
            "league",
            "联赛"
        ]),
        time:pick(info,[
            "time",
            "date",
            "datetime",
            "开赛时间"
        ])
    };
}


/* =========================================================
   分析数据
   ========================================================= */

function getAnalysis(data){

    const analysis =
        data?.analysis || {};

    const forecasts =
        data?.forecasts || {};

    const win =
        analysis.win || {};

    const handicap =
        analysis.handicap || {};

    const exact =
        analysis.exact || {};

    const overUnder =
        analysis.overUnder || {};

    const htft =
        analysis.htft || {};

    return {

        winPick:
            pick(win,[
                "pick",
                "result",
                "recommend"
            ]),

        winNote:
            pick(win,[
                "note",
                "reason",
                "analysis"
            ]),

        handicapPick:
            pick(handicap,[
                "pick",
                "result",
                "recommend"
            ]),

        handicapLine:
            pick(handicap,[
                "line",
                "handicap",
                "让球"
            ]),

        exactPick:
            pick(exact,[
                "pick",
                "score",
                "scores"
            ]) ||
            forecasts.scoreline,

        goals:
            pick(overUnder,[
                "pick",
                "result"
            ]) ||
            forecasts.goals,

        htft:
            pick(htft,[
                "pick",
                "result"
            ]) ||
            forecasts.halftime,

        risk:
            pick(data,[
                "riskAlert",
                "risk",
                "风险"
            ]),

        directions:
            data.directions || []
    };
}


/* =========================================================
   赛果
   ========================================================= */

function getResult(data){

    const result =
        data?.result || {};

    return pick(result,[
        "actual_score",
        "actualScore",
        "score",
        "比分",
        "result"
    ]);
}


/* =========================================================
   欧赔市场倾向
   ========================================================= */

function oddsDirection(odds){

    if(!odds)
        return "暂无数据";

    const current =
        odds.current ||
        odds.latest ||
        odds.instant ||
        odds.即时 ||
        null;

    const initial =
        odds.initial ||
        odds.opening ||
        odds.first ||
        odds.初赔 ||
        null;

    if(!current)
        return "暂无数据";

    /*
      不计算所谓真实概率。
      这里只在源数据本身提供方向时显示。
    */

    const direction =
        pick(odds,[
            "direction",
            "trend",
            "market",
            "倾向"
        ]);

    if(direction)
        return show(direction);

    if(initial)
        return "已读取初赔与即时赔，结合变化判断";

    return "已有即时赔率";
}


/* =========================================================
   生成简单分析
   ========================================================= */

function makeAnalysis(data){

    const odds = getOdds(data);
    const xg = getXG(data);
    const a = getAnalysis(data);

    const lines = [];

    if(a.winNote){
        lines.push(
            `欧赔/赛前分析：${show(a.winNote)}`
        );
    }else if(odds){
        lines.push(
            `欧赔：已读取真实赔率数据，可结合初赔与即时赔观察市场方向。`
        );
    }else{
        lines.push(
            `欧赔：暂无真实赔率数据。`
        );
    }

    if(xg.xg !== null){

        lines.push(
            `XG：${show(xg.xg)}`
        );

    }else{

        lines.push(
            `XG：暂无数据。`
        );
    }

    if(a.winPick){

        lines.push(
            `胜平负原始分析：${show(a.winPick)}`
        );
    }

    if(a.handicapPick){

        lines.push(
            `让球原始分析：${show(a.handicapPick)}`
        );
    }

    if(a.risk){

        if(typeof a.risk === "object"){

            const riskText =
                pick(a.risk,[
                    "text",
                    "note",
                    "message",
                    "risk"
                ]);

            if(riskText)
                lines.push(
                    `风险提醒：${show(riskText)}`
                );
            else
                lines.push(
                    `风险提醒：${show(a.risk)}`
                );

        }else{

            lines.push(
                `风险提醒：${show(a.risk)}`
            );
        }
    }

    if(odds && xg.xg !== null){

        lines.push(
            `<span class="good">欧赔与 XG：均有真实数据，可进行交叉验证。</span>`
        );

    }else if(!odds && xg.xg === null){

        lines.push(
            `<span class="warn">目前关键数据不足，不强行给出结论。</span>`
        );
    }

    return lines;
}


/* =========================================================
   渲染赛事
   ========================================================= */

function renderMatch(data, index){

    const teams = getTeams(data);
    const info = getInfo(data);
    const odds = getOdds(data);
    const xg = getXG(data);
    const a = getAnalysis(data);
    const result = getResult(data);

    const oddsInitial =
        odds ?
        pick(odds,[
            "initial",
            "opening",
            "first",
            "open",
            "初赔"
        ]) : null;

    const oddsCurrent =
        odds ?
        pick(odds,[
            "current",
            "latest",
            "instant",
            "now",
            "即时",
            "即时赔"
        ]) : null;

    const analysisLines =
        makeAnalysis(data);

    const hasRecommendation =
        a.winPick ||
        a.handicapPick ||
        a.exactPick;

    const finalMain =
        a.winPick ||
        "暂不推荐";

    const riskClass =
        hasRecommendation ?
        "good" :
        "warn";

    return `
    <article class="card">

        <div class="card-head">

            <div class="comp">
                ${esc(info.code || `赛事 ${index+1}`)}
                ${info.comp ? " · " + esc(info.comp) : ""}
            </div>

            <div class="teams">

                <div class="team">
                    ${esc(teams.home)}
                </div>

                <div class="vs">
                    VS
                </div>

                <div class="team away">
                    ${esc(teams.away)}
                </div>

            </div>

            ${
                info.time
                ?
                `<div class="time">
                    开赛：${esc(info.time)}
                </div>`
                :
                ""
            }

        </div>


        <!-- 欧赔 -->

        <section class="section">

            <div class="section-title">
                欧赔
            </div>

            <div class="grid">

                <div class="item">

                    <div class="label">
                        初赔
                    </div>

                    <div class="value">
                        ${esc(oddsText(oddsInitial))}
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        即时赔
                    </div>

                    <div class="value">
                        ${esc(oddsText(oddsCurrent))}
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        市场方向
                    </div>

                    <div class="value">
                        ${esc(oddsDirection(odds))}
                    </div>

                </div>

            </div>

        </section>


        <!-- XG -->

        <section class="section">

            <div class="section-title">
                XG
            </div>

            <div class="grid">

                <div class="item">

                    <div class="label">
                        XG
                    </div>

                    <div class="value">
                        ${esc(show(xg.xg))}
                    </div>

                </div>

                <div class="item">

                    <div class="label">
                        XGA
                    </div>

                    <div class="value">
                        ${esc(show(xg.xga))}
                    </div>

                </div>

            </div>

        </section>


        <!-- 基本面 -->

        <section class="section">

            <div class="section-title">
                基本面
            </div>

            <div class="analysis">

                ${
                    a.directions &&
                    a.directions.length
                    ?
                    a.directions
                    .slice(0,3)
                    .map(d => {

                        const text =
                            typeof d === "string"
                            ? d
                            : pick(d,[
                                "title",
                                "text",
                                "name",
                                "direction"
                            ]);

                        return text
                            ?
                            `<p>• ${esc(text)}</p>`
                            :
                            "";

                    }).join("")
                    :
                    `<p>暂无足够基本面数据。</p>`
                }

            </div>

        </section>


        <!-- 简单分析 -->

        <section class="section">

            <div class="section-title">
                简单分析
            </div>

            <div class="analysis">

                ${
                    analysisLines
                    .map(x => `<p>${x}</p>`)
                    .join("")
                }

            </div>

        </section>


        <!-- 最终 -->

        <section class="section final">

            <div class="section-title">
                最终判断
            </div>

            <div class="final-main ${riskClass}">
                ${esc(show(finalMain))}
            </div>

            <div class="final-row">

                <div class="tag">
                    胜平负：
                    ${esc(show(a.winPick))}
                </div>

                <div class="tag">
                    让球：
                    ${esc(show(a.handicapPick))}
                </div>

                <div class="tag">
                    比分：
                    ${esc(show(a.exactPick))}
                </div>

                ${
                    a.goals
                    ?
                    `<div class="tag">
                        进球：
                        ${esc(show(a.goals))}
                    </div>`
                    :
                    ""
                }

                ${
                    a.htft
                    ?
                    `<div class="tag">
                        半全场：
                        ${esc(show(a.htft))}
                    </div>`
                    :
                    ""
                }

            </div>

        </section>


        <!-- 赛果 -->

        ${
            result
            ?
            `
            <section class="section">

                <div class="section-title">
                    赛后结果
                </div>

                <div class="final-main">
                    ${esc(show(result))}
                </div>

            </section>
            `
            :
            ""
        }


        <!-- 原始数据 -->

        <section class="section">

            <details>

                <summary>
                    查看原始数据
                </summary>

                <div class="raw">
                    ${esc(JSON.stringify(data,null,2))}
                </div>

            </details>

        </section>

    </article>
    `;
}


/* =========================================================
   主加载函数
   ========================================================= */

async function loadData(){

    const date =
        dateInput.value ||
        localDate();

    listBox.innerHTML =
        `<div class="loading">正在读取 ${date} 的真实赛事数据……</div>`;

    statusBox.innerHTML =
        `正在读取 GitHub 公共数据……`;

    try{

        const files =
            await getDirectory(date);

        if(!Array.isArray(files)){

            throw new Error("没有读取到赛事目录");
        }

        const jsonFiles =
            files.filter(file =>
                file.type === "file" &&
                file.name.toLowerCase().endsWith(".json")
            );

        if(jsonFiles.length === 0){

            listBox.innerHTML =
                `<div class="empty">
                    ${date}<br><br>
                    暂无公开赛事数据
                </div>`;

            statusBox.innerHTML =
                `数据日期：${date} · 暂无公开 JSON 数据`;

            return;
        }

        /*
          为避免手机一次加载过多文件，
          默认最多显示前 50 场。
        */

        const selected =
            jsonFiles.slice(0,50);

        const matches = [];

        for(const file of selected){

            const data =
                await getMatch(file);

            if(data)
                matches.push(data);
        }

        if(matches.length === 0){

            throw new Error(
                "赛事文件存在，但没有成功读取 JSON"
            );
        }

        listBox.innerHTML =
            matches
            .map((data,i) =>
                renderMatch(data,i)
            )
            .join("");

        statusBox.innerHTML =
            `数据日期：${date} · 已读取 ${matches.length} 场 · 仅显示真实数据`;

    }catch(error){

        console.error(error);

        statusBox.innerHTML =
            `<div class="error">
                数据读取失败：${esc(error.message)}
                <br><br>
                请确认 GitHub 仓库为公开仓库，
                并确认 ${date} 对应目录存在。
            </div>`;

        listBox.innerHTML =
            `
            <div class="empty">
                暂时无法读取赛事数据。
                <br><br>
                不会使用虚假数据替代。
            </div>
            `;
    }
}


/* =========================================================
   启动
   ========================================================= */

loadData();

</script>

</body>
</html>
